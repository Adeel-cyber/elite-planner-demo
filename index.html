function phoneLayout() {
  return !!(window.matchMedia && window.matchMedia("(max-width: 760px)").matches);
}

function blockWhen(date, startMins) {
  return Core.formatDayShort(date) + " at " + Core.minsToTime(startMins);
}

// ---------- Block dialog (Edit a block, or give a card its first time) ----------

// The start time: a text box you can type in (14:25, 9:05) with arrow keys and two buttons that move it by
// 15 minutes. There is no saved list of start times. opts: { minutes, getLen(), rs, re, onChange }.
// Returns a node with .input, .minutes() (the typed time or null, quiet), .check() (the same, and says
// why in a kind line when it does not fit), .recheck() (after the length changed) and .focus().
function startTimeBox(opts) {
  var input = el("input", {
    type: "text",
    className: "time-input",
    inputmode: "numeric",
    autocomplete: "off",
    maxLength: 5,
    "aria-label": "Start time",
    title: "Type a time like 14:25, or use the arrow keys"
  });
  var note = el("p", { className: "hint gentle time-note", role: "status", hidden: true });

  function typed() {
    return Core.parseTypedTime(input.value);
  }

  function show(r) {
    note.textContent = r.message;
    note.hidden = r.ok;
  }

  function check() {
    var m = typed();
    var r = Core.checkStartTime(m, opts.getLen(), opts.rs, opts.re);
    show(r);
    if (r.ok) input.value = Core.minsToTime(m);
    return r.ok ? m : null;
  }

  function set(m) {
    input.value = Core.minsToTime(m);
    check();
    if (opts.onChange) opts.onChange();
  }

  // One step of 15 minutes, kept inside the hours shown (the end is the latest start for this length).
  function step(dir) {
    var m = typed();
    if (m === null) m = opts.minutes;
    var latest = Math.max(opts.rs, opts.re - opts.getLen());
    set(Core.stepTime(m, dir, Core.BLOCK_STEP, opts.rs, latest));
  }

  input.value = Core.minsToTime(opts.minutes);
  input.addEventListener("keydown", function (e) {
    if (e.key === "ArrowUp") { e.preventDefault(); step(1); }
    else if (e.key === "ArrowDown") { e.preventDefault(); step(-1); }
    else if (e.key === "Enter") { e.preventDefault(); check(); }
  });
  input.addEventListener("blur", function () {
    if (input.value.trim() || note.hidden === false) check();
  });
  input.addEventListener("input", function () {
    if (opts.onChange) opts.onChange();
  });

  var row = el("div", { className: "time-box" }, [
    el("button", { type: "button", className: "time-step", "aria-label": "15 minutes earlier", onclick: function () { step(-1); } }, "-"),
    input,
    el("button", { type: "button", className: "time-step", "aria-label": "15 minutes later", onclick: function () { step(1); } }, "+")
  ]);
  var root = el("div", { className: "time-field" }, [row, note]);
  root.input = input;
  root.minutes = typed;
  root.check = check;
  root.recheck = function () { if (typed() !== null) check(); };
  root.focus = function () { input.focus(); };
  return root;
}

function openBlockDialog(taskId, opts) {
  var task = findTask(taskId);
  if (!task) return;
  opts = opts || {};
  var existing = task.scheduled;
  var range = Core.weekRange(App.state, weekDates());
  if (existing) {
    var s0 = Core.timeToMins(existing.start);
    range.start = Math.min(range.start, Math.floor(s0 / 60) * 60);
    range.end = Math.max(range.end, Math.ceil(Math.min(1440, s0 + existing.mins) / 60) * 60);
  }
  var rs = range.start;
  var re = range.end;
  var today = Core.todayISO();

  var mins = existing ? existing.mins : Core.defaultBlockMins(task);
  var date = existing ? existing.date : (opts.date || today);
  var start;
  if (existing) start = Core.timeToMins(existing.start);
  else {
    // The next half hour when planning for today, otherwise a calm 09:00.
    var now = new Date();
    var soon = Math.ceil((now.getHours() * 60 + now.getMinutes()) / 30) * 30;
    start = date === today && soon >= rs && soon + mins <= re ? soon : 540;
    start = Core.fitBlock(start, mins, rs, re).start;
  }

  var title = el("input", { type: "text", maxLength: Core.LIMITS.title, autocomplete: "off", dir: "auto" });
  title.value = task.title;
  var hint = el("p", { className: "hint", role: "status" });
  // Status is for a card that already has a block. It is the same control as in the card dialog.
  var statusField = existing ? StatusField.create(task.status) : null;
  var day = el("input", { type: "date" });
  day.value = date;

  var lenBox = null;
  var timeBox = startTimeBox({
    minutes: start,
    rs: rs,
    re: re,
    getLen: function () { return lenBox ? lenBox.mins : mins; },
    onChange: function () { if (lenBox) lenBox.refresh(); }
  });
  // "Use my real time": the card's Plan for number (Time Reality Check). Picking it only sets the Length box,
  // Save still goes through Core.saveBlockEdit, so the same one-step Undo applies.
  var realMins = Core.realTimeMins(task, Core.planMultiplier(App.state));
  var extras = realMins === null ? [] : [{
    label: "Use my real time (" + realMins + " min)",
    onclick: function () { lenBox.choose(realMins); }
  }];
  lenBox = LengthChooser.create({
    minutes: mins,
    getStart: function () { return timeBox.minutes(); },
    getLimit: function () { return re; },
    extras: extras,
    onChange: function () { timeBox.recheck(); }
  });

  function snapshot() {
    return JSON.stringify([title.value, statusField ? statusField.select.value : "", day.value, timeBox.input.value, lenBox.mins]);
  }
  var initial = snapshot();

  function say(text) {
    hint.className = "hint gentle";
    hint.textContent = text;
  }

  function save() {
    var text = title.value.trim();
    if (!text) {
      title.value = task.title;
      say("A card needs a name, so the old one is back. Press Save when you are ready.");
      title.focus();
      return false;
    }
    if (!Core.isValidISODate(day.value)) {
      say("Pick a day for it.");
      day.focus();
      return false;
    }
    var s = timeBox.check();
    if (s === null) {
      timeBox.focus();
      return false;
    }
    var len = lenBox.mins;
    // All or nothing: the time is checked and saved first, then the title and status (Core.saveBlockEdit).
    // The dialog keeps exactly what was typed or picked, so nothing is snapped.
    var edit = { title: text, date: day.value, start: s, mins: len };
    if (statusField) edit.status = statusField.select.value;
    var r = Core.saveBlockEdit(App.state, task.id, edit, { start: rs, end: re }, Core.SNAP_NONE);
    if (!r.ok) {
      say(r.reason === "missing" ? "That card is gone, so nothing was changed."
        : "That time did not fit, so nothing was changed.");
      return false;
    }
    commit(r.state);
    var told = "Scheduled for " + blockWhen(day.value, s) + "." + (r.statusChanged ? " Moved to " + Core.COLUMN_NAMES[edit.status] + "." : "");
    weekToast(told, function () { undoScheduleChange(r.undo, Core.applyBlockEditUndo); });
    // The redraw replaced the buttons. Put focus on the block if it is on screen.
    setTimeout(function () {
      if (!focusByKey("block-" + task.id) && !focusByKey("rail-" + task.id)) Shell.main.focus();
    }, 0);
  }

  var buttons = [{ label: "Delete card", onclick: function () { removeTaskWithUndo(task.id); } }];
  if (existing) {
    buttons.push({
      label: "Unschedule",
      onclick: function () {
        var r = Core.unschedule(App.state, task.id);
        commit(r.state);
        weekToast("Back on your board.", r.undo ? function () { undoScheduleChange(r.undo); } : undefined);
        setTimeout(function () { focusByKey("rail-" + task.id) || Shell.main.focus(); }, 0);
      }
    });
  }
  buttons.push({ label: "Cancel" });
  buttons.push({ label: "Save", primary: true, onclick: save });

  var dlg = Dialog.open({
    title: existing ? "Edit time block" : "Schedule",
    body: el("div", null, [
      el("label", { className: "field" }, [el("span", null, "Title"), title]),
      hint,
      statusField ? statusField.node : null,
      el("label", { className: "field" }, [el("span", null, "Day"), day]),
      el("div", { className: "field" }, [el("span", null, "Start time"), timeBox]),
      el("div", { className: "field" }, [el("span", null, "Length"), lenBox])
    ]),
    hasChanges: function () { return snapshot() !== initial; },
    buttons: buttons
  });
  title.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      if (save() !== false) dlg.close();
    }
  });
}

// ---------- Drawing ----------

// One text line in the same size as the CSS uses, for Core.blockLayout. The line height comes from
// the --wk-lh token in style.css, so the two never disagree.
function weekLinePx() {
  var cs = window.getComputedStyle(document.documentElement);
  var root = parseFloat(cs.fontSize) || 16;
  var lh = parseFloat(cs.getPropertyValue("--wk-lh")) || 1.25;
  return root * 0.85 * lh;
}

// Shortens each block title until it fits its lines, always from the full title kept in data-full,
// cutting only between whole characters and ending with "...". The title is never emptied.
// The same search for every title, but all titles move together: each round first writes every title, then
// reads every result, so the page lays out a few times instead of once per title and step. A block is placed
// by its own style, so one title never changes the room of another.
function fitWeekTitles(scope) {
  var linePx = weekLinePx();
  var items = [].map.call(scope.querySelectorAll(".wk-title[data-full]"), function (t) {
    return {
      t: t,
      block: t.closest(".wk-block"),
      full: t.getAttribute("data-full"),
      room: (+t.getAttribute("data-lines") || 1) * linePx + 1
    };
  });
  function fits(it) {
    return it.t.scrollHeight <= it.room && it.t.scrollWidth <= it.t.clientWidth + 1;
  }
  // A narrow block shows its title on one line, so a word is never broken across lines.
  items.forEach(function (it) { it.blockWidth = it.block ? it.block.clientWidth : 0; });
  items.forEach(function (it) {
    if (it.block) it.block.classList.toggle("is-narrow", it.blockWidth > 0 && it.blockWidth < WK_NARROW_PX);
    it.t.textContent = it.full;
  });
  var pending = items.filter(function (it) { return it.t.clientWidth !== 0 && !fits(it); });
  pending.forEach(function (it) {
    it.lo = 1;
    it.hi = Core.graphemes(it.full).length - 1;
    it.best = 1;
  });
  var active = pending;
  while (active.length) {
    active.forEach(function (it) {
      it.mid = (it.lo + it.hi) >> 1;
      it.t.textContent = Core.safeTruncate(it.full, it.mid);
    });
    active.forEach(function (it) {
      if (fits(it)) { it.best = it.mid; it.lo = it.mid + 1; } else it.hi = it.mid - 1;
    });
    active = active.filter(function (it) { return it.lo <= it.hi; });
  }
  pending.forEach(function (it) { it.t.textContent = Core.safeTruncate(it.full, it.best); });
}

// Titles are fitted again when the window changes size (the columns change width).
var weekFitTimer = null;
window.addEventListener("resize", function () {
  clearTimeout(weekFitTimer);
  weekFitTimer = setTimeout(function () {
    var wk = document.querySelector(".week");
    if (wk && !Drag.busy()) fitWeekTitles(wk);
  }, 150);
});

function blockEl(t, lane, rs, linePx, pm, minPx) {
  var s = Core.timeToMins(t.scheduled.start);
  var e = s + t.scheduled.mins;
  var label = t.labelId ? findLabel(t.labelId) : null;
  var done = t.status === "done";
  var range = Core.minsToTime(s) + " to " + Core.minsToTime(Math.min(1439, e));
  var real = Core.isRealTimeBlock(t, weekMult);
  var lay = Core.blockLayout({
    mins: t.scheduled.mins,
    heightPx: t.scheduled.mins * pm,
    minPx: minPx,
    linePx: linePx,
    lanes: lane.lanes,
    hasLabel: !!label,
    extras: real ? [{ kind: "padded", text: "Real time", minTier: "medium" }] : []
  });
  // The full title, label, time and real length always stay in the tooltip and the aria-label.
  var full = t.title.slice(0, 80) + (label ? ", " + label.name : "") + ", " + range + ", " + Core.formatMins(t.scheduled.mins) +
    (real ? ", planned with your real time" : "");
  var strip = Core.lengthStripPx(t.scheduled.mins, pm, minPx);
  var kids = lay.parts.map(function (p) {
    if (p.kind === "title") {
      var line = el("span", { className: "wk-line", dir: "auto" }, [
        lay.dot ? colorDot(label.color) : null,
        el("span", {
          className: "wk-title",
          style: "--lines:" + p.lines,
          "data-lines": String(p.lines),
          "data-full": (done ? "✓ " : "") + t.title
        }, (done ? "✓ " : "") + t.title)
      ]);
      return line;
    }
    if (p.kind === "label") return el("span", { className: "wk-sub", dir: "auto" }, label.name);
    if (p.kind === "time") return el("span", { className: "wk-sub wk-time" }, range);
    return el("span", { className: "wk-sub wk-marker" }, p.text);
  });
  var open = el("button", {
    type: "button",
    className: "wk-open",
    "data-key": "block-" + t.id,
    // A block with a note shows the note preview instead of the browser's own tooltip. The aria-label has it all.
    title: Core.hasNote(t) ? null : full,
    "aria-haspopup": "dialog",
    "aria-label": full + ", " + Core.formatDayShort(t.scheduled.date) + ". Edit time block",
    onclick: function () { openBlockDialog(t.id); }
  }, kids);
  // Hover and keyboard focus show the note. No icon on a block: it is too small, and the dialog shows the note.
  NotePreview.attach(open, open, t);
  var block = el("div", {
    className: "wk-block" + (done ? " is-done" : "") + (strip ? " has-strip" : "") + (minPx < Core.MIN_BLOCK_PX ? " is-compact" : ""),
    "data-id": t.id
  }, [
    // A block drawn taller than its time: a thin strip shows how long it really is.
    strip ? el("span", { className: "wk-strip", "aria-hidden": "true", style: "--real:" + strip + "px" }) : null,
    open,
    // A plain tap on the handle opens the block too. After a real drag the click is swallowed.
    el("div", { className: "wk-resize", "aria-hidden": "true", onclick: function () { openBlockDialog(t.id); } })
  ]);
  var place = Core.laneStyle(lane.lane, lane.lanes, 48);
  block.style.top = (s - rs) * pm + "px";
  block.style.height = t.scheduled.mins * pm + "px";
  block.style.left = place.left;
  block.style.width = place.width;
  // Later lanes sit on top when narrow blocks overlap like fanned cards.
  block.style.setProperty("--lane-z", String(1 + lane.lane));
  return block;
}

function dayColumn(date, today, rs, re, selected, pm, minPx) {
  var blocks = Core.blocksForDay(App.state, date);
  var full = fullDayNote(date, today);
  var lay = Core.layoutBlocks(blocks.map(function (t) {
    var s = Core.timeToMins(t.scheduled.start);
    return { id: t.id, start: s, end: s + t.scheduled.mins };
  }), Core.minBlockMins(pm, minPx));
  var linePx = weekLinePx();
  var col = el("div", {
    className: "wk-day" + (date === today ? " is-today" : "") + (date < today ? " is-past" : "") + (date === selected ? " is-selected" : ""),
    "data-date": date,
    role: "group",
    "aria-label": Core.formatDayShort(date) + (date === today ? ", today" : "") + (full ? ". " + full : "")
  }, blocks.map(function (t) { return blockEl(t, lay[t.id], rs, linePx, pm, minPx); }));
  col.style.height = (re - rs) * pm + "px";
  if (date === today) col.appendChild(el("div", { className: "wk-now", "aria-hidden": "true" }));
  return col;
}

// The gentle "Full day" note: today and later days whose padded minutes are more than the waking hours.
// Returns the kind sentence (Core.fullDayText) or "" for a day that fits, or a past day.
function fullDayNote(date, today) {
  if (date < today) return "";
  var load = Core.dayLoad(App.state, date, weekMult);
  return load.over ? Core.fullDayText(load, App.state.settings, weekMult) : "";
}

function nowMinutes() {
  var n = new Date();
  return n.getHours() * 60 + n.getMinutes();
}

function placeNowLine(rs, re, pm) {
  var line = document.querySelector(".wk-now");
  if (!line) return false;
  var m = nowMinutes();
  line.hidden = m < rs || m > re;
  line.style.top = (m - rs) * pm + "px";
  return true;
}

function railSection(list, dates, today) {
  var open = App.railOpen;
  var items = list.map(function (t) {
    return el("li", { className: "rail-card", "data-id": t.id }, [
      el("button", {
        type: "button",
        className: "rail-open",
        "data-key": "rail-" + t.id,
        "aria-haspopup": "dialog",
        onclick: function () { openCardEdit(t.id); }
      }, el("span", { className: "card-title", dir: "auto" }, t.title)),
      el("button", {
        type: "button",
        className: "rail-schedule",
        "data-key": "rail-sched-" + t.id,
        "aria-label": "Schedule " + t.title.slice(0, 60),
        onclick: function () {
          openBlockDialog(t.id, { date: dates.indexOf(today) >= 0 ? today : App.weekDate });
        }
      }, "Schedule")
    ]);
  });
  return el("section", { className: "wk-rail" + (open ? " is-open" : ""), "aria-labelledby": "rail-h" }, [
    el("h3", { id: "rail-h" }, ["Not scheduled ", el("span", { className: "count", "aria-label": list.length + " cards" }, String(list.length))]),
    el("button", {
      type: "button",
      className: "rail-toggle",
      "aria-expanded": open ? "true" : "false",
      "aria-controls": "rail-list",
      "data-key": "rail-toggle",
      onclick: function () { App.railOpen = !App.railOpen; render(); }
    }, open ? "Hide the list" : "Show the list"),
    list.length
      ? el("ul", { id: "rail-list", className: "rail-list" }, items)
      : el("p", { id: "rail-list", className: "col-empty" }, "Every open card has a time. Nice.")
  ]);
}

// How a drag snaps. A move keeps the length and only the start snaps to 15 minutes (Core.SNAP_MOVE).
// A resize keeps the start and only the length snaps (Core.SNAP_RESIZE). A card from the rail has
// no time yet, so both snap.
function snapFor(ctx) {
  return ctx.mode === "move" ? Core.SNAP_MOVE : ctx.mode === "resize" ? Core.SNAP_RESIZE : undefined;
}

// One Drag.bind for the whole view: rail cards, blocks and the resize handle.
function weekDrag(wrap, rs, re, pm) {
  var scroller = wrap.querySelector(".wk-scroll");
  var markers = { ph: null };

  function clearSpot() {
    if (markers.ph) markers.ph.remove();
  }

  function dayAt(x) {
    var cols = [].slice.call(wrap.querySelectorAll(".wk-day"));
    for (var i = 0; i < cols.length; i++) {
      var r = cols[i].getBoundingClientRect();
      if (r.width > 0 && x >= r.left && x <= r.right) return cols[i];
    }
    return null;
  }

  function showSpot(col, fit) {
    if (!markers.ph) {
      markers.ph = el("div", { className: "wk-drop", "aria-hidden": "true" });
    }
    if (markers.ph.parentNode !== col) col.appendChild(markers.ph);
    markers.ph.style.top = (fit.start - rs) * pm + "px";
    markers.ph.style.height = fit.mins * pm + "px";
    markers.ph.textContent = Core.minsToTime(fit.start) + " to " + Core.minsToTime(fit.start + fit.mins);
  }

  Drag.bind(wrap, {
    itemSelector: ".wk-block, .rail-card",
    ignoreSelector: ".rail-schedule",
    handleSelector: ".wk-resize",
    ghost: function (ctx) { return ctx.mode !== "resize"; },
    scrollTargets: function () { return [scroller, window]; },
    begin: function (item, info) {
      var id = item.getAttribute("data-id");
      var t = findTask(id);
      if (!t) return null;
      if (item.classList.contains("rail-card")) {
        return { mode: "rail", id: id, mins: Core.defaultBlockMins(t), grab: 0, item: item };
      }
      if (!t.scheduled) return null;
      var start = Core.timeToMins(t.scheduled.start);
      var ctx = { mode: info.handle ? "resize" : "move", id: id, item: item, date: t.scheduled.date, start: start, mins: t.scheduled.mins };
      if (ctx.mode === "move") {
        ctx.grab = Math.max(0, (info.event.clientY - item.getBoundingClientRect().top) / pm);
      } else {
        // Short blocks have no time line, so it is optional here.
        ctx.timeEl = item.querySelector(".wk-time");
        ctx.origTime = ctx.timeEl ? ctx.timeEl.textContent : "";
        ctx.origHeight = item.style.height;
        ctx.col = item.parentNode;
        ctx.startY = info.event.clientY;
        ctx.colTop0 = ctx.col.getBoundingClientRect().top;
      }
      return ctx;
    },
    over: function (ctx, x, y) {
      if (ctx.mode === "resize") {
        // The real length plus how far the pointer moved inside the column (auto scroll included).
        // The drawn height is never used: a short block is drawn taller than its time.
        var dy = (y - ctx.col.getBoundingClientRect().top) - (ctx.startY - ctx.colTop0);
        var mins = Core.resizeMins(ctx.mins, dy, pm, Math.min(600, re - ctx.start));
        var label = Core.minsToTime(ctx.start) + " to " + Core.minsToTime(Math.min(1439, ctx.start + mins));
        ctx.item.style.height = mins * pm + "px";
        if (ctx.timeEl) ctx.timeEl.textContent = label;
        showSpot(ctx.col, { start: ctx.start, mins: mins });
        return mins === ctx.mins ? null : { date: ctx.date, start: ctx.start, mins: mins };
      }
      var sc = scroller.getBoundingClientRect();
      var col = y >= sc.top && y <= sc.bottom ? dayAt(x) : null;
      if (!col) { clearSpot(); return null; }
      var s = Core.slotFromPoint(y, col.getBoundingClientRect().top, pm, rs, ctx.grab);
      var fit = Core.fitBlock(s, ctx.mins, rs, re, snapFor(ctx));
      var date = col.getAttribute("data-date");
      if (ctx.mode === "move" && date === ctx.date && fit.start === ctx.start && fit.mins === ctx.mins) {
        clearSpot();
        return null;
      }
      showSpot(col, fit);
      return { date: date, start: fit.start, mins: fit.mins };
    },
    end: function (ctx) {
      clearSpot();
      if (ctx.mode === "resize") {
        ctx.item.style.height = ctx.origHeight;
        if (ctx.timeEl) ctx.timeEl.textContent = ctx.origTime;
      }
    },
    drop: function (ctx, target) {
      var r = Core.setSchedule(App.state, ctx.id, target, { start: rs, end: re }, snapFor(ctx));
      if (!r.changed) return;
      commit(r.state);
      var text = ctx.mode === "rail" ? "Scheduled for " + blockWhen(target.date, target.start) + "."
        : ctx.mode === "resize" ? "Length is now " + Core.formatMins(target.mins) + "."
        : "Moved to " + blockWhen(target.date, target.start) + ".";
      // One-step Undo in the toast only, never in the 10-entry stack.
      weekToast(text, function () { undoScheduleChange(r.undo); });
    }
  });
}

// A swipe sideways on the empty grid changes the day on a phone. Vertical movement stays a scroll.
function weekSwipe(scroller) {
  var swipe = null;
  scroller.addEventListener("pointerdown", function (e) {
    if (e.pointerType !== "touch" || (e.target.closest && e.target.closest(".wk-block"))) return;
    swipe = { x: e.clientX, y: e.clientY, id: e.pointerId };
  });
  scroller.addEventListener("pointerup", function (e) {
    if (!swipe || e.pointerId !== swipe.id) return;
    var dx = e.clientX - swipe.x;
    var dy = e.clientY - swipe.y;
    swipe = null;
    if (phoneLayout() && Math.abs(dx) >= 60 && Math.abs(dx) > Math.abs(dy) * 1.5) shiftDay(dx < 0 ? 1 : -1);
  });
  scroller.addEventListener("pointercancel", function () { swipe = null; });
}

function renderWeek(root) {
  var today = Core.todayISO();
  if (!App.weekDate || !Core.isValidISODate(App.weekDate)) App.weekDate = today;
  var dates = weekDates();
  var range = Core.weekRange(App.state, dates);
  var rs = range.start;
  var re = range.end;
  var selected = App.weekDate;
  var pm = weekPm();
  var minPx = weekMinPx();
  weekMult = Core.planMultiplier(App.state);

  var heads = dates.map(function (d) {
    var full = fullDayNote(d, today);
    return el("div", {
      className: "wk-dayhead" + (d === today ? " is-today" : "") + (d === selected ? " is-selected" : ""),
      "aria-current": d === today ? "date" : null
    }, [
      el("span", { className: "wk-dayname" }, Core.formatDayShort(d)),
      full ? el("span", { className: "wk-full", title: full }, [
        el("span", { "aria-hidden": "true" }, "Full day"),
        el("span", { className: "visually-hidden" }, full)
      ]) : null
    ]);
  });
  var gutter = el("div", { className: "wk-gutter", "aria-hidden": "true" });
  for (var m = rs; m <= re && m < 1440; m += 60) {
    var tick = el("span", null, Core.minsToTime(m));
    tick.style.top = (m - rs) * pm + "px";
    gutter.appendChild(tick);
  }
  gutter.style.height = (re - rs) * pm + "px";

  var scroller = el("div", { className: "wk-scroll", role: "group", "aria-label": "Week schedule" }, [
    el("div", { className: "wk-head" }, [el("div", { className: "wk-corner" })].concat(heads)),
    el("div", { className: "wk-body" }, [gutter].concat(dates.map(function (d) { return dayColumn(d, today, rs, re, selected, pm, minPx); })))
  ]);

  var strip = el("div", { className: "wk-daystrip", role: "group", "aria-label": "Choose a day" }, dates.map(function (d) {
    return el("button", {
      type: "button",
      className: d === selected ? "is-on" : "",
      "aria-pressed": d === selected ? "true" : "false",
      "data-key": "day-" + d,
      "aria-label": Core.formatLongDate(d),
      onclick: function () { App.weekDate = d; render(); }
    }, [
      el("span", { className: "chip-dow" }, Core.formatDayShort(d).split(" ")[0]),
      el("span", { className: "chip-date" }, Core.formatDayShort(d).split(" ")[1])
    ]);
  }));

  var bar = el("div", { className: "wk-bar" }, [
    el("h2", { className: "wk-range", id: "wk-title" }, Core.formatWeekRange(dates)),
    el("div", { className: "wk-weeknav" }, [
      el("button", { type: "button", "data-key": "week-prev", onclick: function () { shiftWeek(-1); } }, "Previous week"),
      el("button", { type: "button", "data-key": "week-now", onclick: goToThisWeek }, "This week"),
      el("button", { type: "button", "data-key": "week-next", onclick: function () { shiftWeek(1); } }, "Next week")
    ]),
    el("div", { className: "wk-daynav" }, [
      el("button", { type: "button", className: "nav-arrow", "data-key": "day-prev", "aria-label": "Previous day", onclick: function () { shiftDay(-1); } }, [
        el("span", { className: "nav-long" }, "Previous day"),
        el("span", { className: "nav-short", "aria-hidden": "true" }, "‹")
      ]),
      el("button", { type: "button", "data-key": "day-now", onclick: goToThisWeek }, "Today"),
      el("button", { type: "button", className: "nav-arrow", "data-key": "day-next", "aria-label": "Next day", onclick: function () { shiftDay(1); } }, [
        el("span", { className: "nav-long" }, "Next day"),
        el("span", { className: "nav-short", "aria-hidden": "true" }, "›")
      ])
    ]),
    el("p", { className: "wk-daylabel", "aria-live": "polite" }, Core.formatLongDate(selected))
  ]);

  var wrap = el("div", { className: "week" }, [
    bar,
    strip,
    el("div", { className: "wk-layout" }, [railSection(Core.unscheduledList(App.state), dates, today), scroller])
  ]);
  // The hour lines follow the row size: one line every 30 minutes. A shorter block (Small) gets a
  // smaller resize grab, so most of it still opens the dialog on a tap.
  wrap.style.setProperty("--wk-row", 30 * pm + "px");
  wrap.style.setProperty("--wk-min", minPx + "px");
  wrap.style.setProperty("--wk-grab", (minPx < Core.MIN_BLOCK_PX ? 12 : 24) + "px");
  weekDrag(wrap, rs, re, pm);
  weekSwipe(scroller);
  root.appendChild(wrap);
  fitWeekTitles(wrap);

  // The first open and This week put "now" a third of the way down (another week opens at the first hour).
  // Every other redraw keeps the same time at the top, also when the row size changes.
  if (weekAutoScroll || weekTopMins === null) {
    var head = scroller.querySelector(".wk-head");
    weekTopMins = Core.weekOpenTop({
      hasToday: dates.indexOf(today) >= 0,
      nowMins: nowMinutes(),
      rs: rs,
      re: re,
      viewPx: scroller.clientHeight - (head ? head.offsetHeight : 0),
      pxPerMin: pm
    });
    weekAutoScroll = false;
  }
  scroller.scrollTop = (weekTopMins - rs) * pm;
  scroller.addEventListener("scroll", function () { weekTopMins = rs + scroller.scrollTop / pm; });

  // The current time line moves once a minute while this view is on screen.
  clearInterval(weekClock);
  weekClock = null;
  if (placeNowLine(rs, re, pm)) {
    weekClock = setInterval(function () {
      if (!placeNowLine(rs, re, pm)) { clearInterval(weekClock); weekClock = null; }
    }, 60000);
  }
}

// Boots the app: storage, load, debounced save and undo. Views render from App.state.

var App = {
  state: null,
  store: null,
  saver: null,
  undo: null,
  loadInfo: null,
  saveStatus: "",
  otherTab: false,
  view: "board",
  bannerDismissed: false,
  boardFilter: "",
  laterOpen: false,
  doneAll: false,
  renderPending: false,
  firstRun: false,
  pickAll: false,
  timeChartOpen: false, // the chart on the Today "Your real time" card, folded each time Today opens
  weekDate: null,
  railOpen: false,
  monthSel: null,
  shownDay: null, // the date the view was last drawn for
  changes: 0, // real edits so far (Core.isRealEdit). An import Undo only runs while this is unchanged.
  backupSnoozed: false // "Not now" on the backup reminder, until the next open

};

// Some browsers throw just for touching localStorage (private modes, sandboxes).
function getStorage() {
  try {
    var s = window.localStorage;
    s.getItem(Core.KEYS.state);
    return s;
  } catch (e) {
    return null;
  }
}

// A save only adds a new updatedAt, and every change already redrew through commit. So only the
// banners are updated here. Rebuilding the view 400 ms after a change would throw away a button the
// person is pressing at that moment, and the browser would then drop their click.
function saveNow() {
  var r = App.store.save(App.state);
  if (r.ok) {
    App.state = r.state;
    App.saveStatus = "Saved";
  } else {
    App.saveStatus = r.reason;
  }
  refreshStatus();
}

function refreshStatus() {
  updateBanners();
}

// Every change goes through here. Pass an undo entry for destructive actions.
// Export and the Fresh day marker are not real edits, so they never switch an import Undo off.
function commit(nextState, undoEntry) {
  if (Demo.commitBlocked(nextState)) return;
  if (Core.isRealEdit(App.state, nextState)) App.changes++;
  App.state = nextState;
  if (undoEntry) App.undo.push(undoEntry);
  App.saveStatus = "Saving";
  App.saver.schedule();
  render();
}

// Deletes a task and offers Undo. Used by every view that can delete a card.
function removeTaskWithUndo(id) {
  var r = Core.deleteTask(App.state, id);
  if (!r.undo) return;
  var entry = r.undo;
  commit(r.state, entry);
  Toast.show("Card deleted", {
    undo: function () {
      if (Demo.undoBlocked(entry)) return;
      if (App.undo.peek() === entry) App.undo.pop();
      commit(Core.applyUndo(App.state, entry));
    }
  });
}

// ---------- Today Focus: adding a card to Today ----------
// Every add goes through here (Today pick list, Move menu). Two limits: 3 open tasks, and the
// battery once today's battery is picked. Each may be gone over once a day ("Add it anyway"),
// one tap covers both. When an override is used up, the way out is a swap.
// opts.place: the spot (data-place) the add came from, kept still on screen (see keepPlace).

function addToToday(taskId, opts) {
  var task = null;
  App.state.tasks.forEach(function (t) { if (t.id === taskId) task = t; });
  if (!task) return;
  opts = opts || {};
  var date = Core.todayISO();
  var r = Core.addToday(App.state, date, taskId, opts);
  if (r.status === "added") {
    keepPlace(opts.place, function () { commit(r.state); });
    var bat = Core.batteryOf(App.state, date);
    Toast.show(bat.set
      ? "Added to Today. " + r.open + " of 3 cards, " + Core.batteryUsed(App.state, date) + " of " + bat.value + " points."
      : "Added to Today (" + r.open + " of 3)");
  } else if (r.status === "override") {
    keepPlace(opts.place, function () { commit(r.state); });
    Toast.show("Added to Today");
  } else if (r.status === "duplicate") {
    Toast.show("Already in Today.");
  } else if (r.status === "done") {
    Toast.show("This one is already done.");
  } else if (r.status === "ask" || r.status === "full") {
    askTodayFull(task, r.check, opts.place);
  }
}

// One dialog for both limits. check comes from Core.checkTodayAdd. place: see addToToday.
// The button that opened it is often gone after the change, so focus then goes to the card in its
// new home, without scrolling.
function askTodayFull(task, check, place) {
  var date = Core.todayISO();
  var open = Core.focusSummary(App.state, date).open;
  var full = check.status === "full";
  var kids = [];
  if (check.tasks.over) {
    kids.push(el("p", null, check.tasks.overUsed ? "Today is full." : "That is a lot for one day."));
  }
  if (check.battery.over) {
    kids.push(el("p", null, "Your battery is full. Rest is part of the plan."));
    kids.push(el("p", { className: "hint" }, "This one is " + Core.sizeText(task.cost) + ". " +
      check.battery.used + " of " + check.battery.value + " points are used."));
  }
  kids.push(el("p", { className: "hint" }, "\"" + task.title.slice(0, 80) + "\" stays safe in " + Core.COLUMN_NAMES[task.status] + "."));
  var swapOut = null;
  if (open.length) {
    kids.push(el("p", null, "Want to swap one out?"));
    swapOut = Menu.select({
      ariaLabel: "Swap out",
      items: open.map(function (t) { return { value: t.id, label: t.title + ", " + Core.SIZE_NAMES[t.cost] }; }),
      value: open[0].id
    });
    kids.push(el("div", { className: "field" }, [el("span", null, "Swap out"), swapOut]));
  }
  var buttons = [];
  if (swapOut) {
    buttons.push({
      label: "Swap them",
      primary: true,
      onclick: function () {
        keepPlace(place, function () { commit(Core.swapFocus(App.state, date, swapOut.value, task.id)); });
        Toast.show("Swapped. Today now has \"" + task.title.slice(0, 40) + "\".");
      }
    });
  }
  if (!full) {
    buttons.push({
      label: "Add it anyway",
      primary: !swapOut,
      onclick: function () { addToToday(task.id, { override: true, place: place }); }
    });
  }
  buttons.push({ label: "Cancel" });
  Dialog.open({
    title: "Today is busy",
    body: el("div", null, kids),
    buttons: buttons,
    fallbackFocus: function () { return focusQuiet("start-" + task.id) || focusQuiet("card-" + task.id); }
  });
}

// ---------- Soft Reset: a new day ----------
// Runs on open, when the tab comes back, on window focus and once a minute (open at 23:59, still open at
// 00:01: it runs at 00:01). A new date redraws the view at once. The Fresh day question waits while a dialog
// is open or a card is held, and never runs in a tab another tab has changed (its data is old).
// lastResetDay is saved before the dialog opens, so Esc or a reload never ask again.
// With the Fresh day check-in switched off (Settings) the day is still saved, but no dialog opens.
function checkNewDay() {
  // The welcome screen comes first. Saving the check-in day now would count as "saved" and skip it next time.
  if (App.firstRun) return;
  var today = Core.todayISO();
  if (App.shownDay !== today) render();
  if (App.otherTab || Dialog.isOpen() || Drag.busy()) return;
  var plan = Core.softResetPlan(App.state, today, FocusRun ? [FocusRun.taskId] : []);
  if (!plan.due) return;
  commit(Core.markResetDone(App.state, today));
  if (plan.items.length && Core.freshDayOn(App.state)) openFreshDay(plan, today);
}

function setSetting(key, value) {
  var next = Object.assign({}, App.state.settings);
  next[key] = value;
  commit(Object.assign({}, App.state, { settings: next }));
}

function applySettings() {
  var root = document.documentElement;
  var s = App.state.settings;
  root.setAttribute("data-theme", s.theme);
  root.style.setProperty("--scale", String(s.fontScale));
  // Large text (or bigger, from an import) on a narrow phone shows the tabs as a 2 by 2 grid (style.css).
  root.setAttribute("data-textsize", s.fontScale >= LARGE_TEXT_SCALE ? "large" : "normal");
  if (s.reduceMotion) root.setAttribute("data-motion", "reduce");
  else root.removeAttribute("data-motion");
  // A new text size changes how many lines an open toast needs.
  Toast.fitAll();
}

// ---------- Shell ----------

var VIEWS = [
  { id: "board", label: "Board", render: function (r) { renderBoard(r); } },
  { id: "today", label: "Today", render: function (r) { renderToday(r); } },
  { id: "week", label: "Week", render: function (r) { renderWeek(r); } },
  { id: "month", label: "Month", render: function (r) { renderMonth(r); } }
];

var Shell = { root: null, banners: null, recovery: null, reminder: null, tabs: null, main: null, bannerKey: null, recoveryKey: null, reminderKey: null };

// The open tab is remembered for this browser tab only (a reload keeps it, a fresh open does not).
// sessionStorage, never localStorage and never the backup. Anything unreadable is ignored.
var TAB_KEY = "eliteplanner.tab";

function savedTab() {
  try {
    return Core.validView(window.sessionStorage.getItem(TAB_KEY));
  } catch (e) {
    return null;
  }
}

function rememberTab(id) {
  try {
    window.sessionStorage.setItem(TAB_KEY, id);
  } catch (e) {
    /* private mode or blocked storage: the tab is simply not remembered */
  }
}

// Only real problems get a banner. A normal save stays quiet.
function bannerProblems() {
  var list = [];
  function add(text, extra) {
    if (text && !list.some(function (p) { return p.text === text; })) list.push({ text: text, extra: extra || null });
  }
  if (!App.store.persistent) add(Core.MSG.blocked);
  if (App.otherTab || App.store.locked === Core.MSG.conflict) add(Core.MSG.conflict, "reload");
  else add(App.store.locked);
  // A kept copy has its own banner with Download (updateRecovery).
  if (App.loadInfo.message && App.loadInfo.status !== "recovered" && !App.bannerDismissed) add(App.loadInfo.message, "dismiss");
  var st = App.saveStatus;
  if (st && st !== "Saved" && st !== "Saving") add(st);
  return list;
}

function updateBanners() {
  if (!Shell.root) return; // the welcome screen has no shell yet
  updateRecovery();
  updateReminder();
  var problems = bannerProblems();
  var key = JSON.stringify(problems);
  if (key === Shell.bannerKey) return; // unchanged: do not re-announce
  Shell.bannerKey = key;
  Shell.banners.textContent = "";
  problems.forEach(function (p) {
    var kids = [el("p", null, p.text)];
    if (p.extra === "reload") {
      kids.push(el("button", { type: "button", className: "primary", onclick: function () { location.reload(); } }, "Reload"));
    } else if (p.extra === "dismiss") {
      kids.push(el("button", { type: "button", onclick: function () { App.bannerDismissed = true; updateBanners(); } }, "Got it"));
    }
    Shell.banners.appendChild(el("div", { className: "banner", role: "alert" }, kids));
  });
}

function currentView() {
  return App.view;
}

function updateTabs() {
  [].forEach.call(Shell.tabs.children, function (b) {
    var on = b.getAttribute("data-view") === App.view;
    b.setAttribute("aria-selected", on ? "true" : "false");
    b.tabIndex = on ? 0 : -1;
  });
}

// A view marks things worth keeping focus on with data-key. Every save redraws the
// view, so the focused one (and the caret in a text box) is put back afterwards.
function captureFocus() {
  var a = document.activeElement;
  if (!a || a === document.body || !Shell.main.contains(a)) return null;
  var key = a.getAttribute("data-key");
  if (!key) return null;
  var text = (a.tagName === "INPUT" && a.type === "text") || a.tagName === "TEXTAREA";
  return { key: key, start: text ? a.selectionStart : null, end: text ? a.selectionEnd : null };
}

// Returns true when the target was found and focused.
function focusByKey(key, keep) {
  var nodes = Shell.main.querySelectorAll("[data-key]");
  for (var i = 0; i < nodes.length; i++) {
    if (nodes[i].getAttribute("data-key") !== key) continue;
    nodes[i].focus(keep ? { preventScroll: true } : undefined);
    if (keep && keep.start !== null && nodes[i].setSelectionRange) {
      try { nodes[i].setSelectionRange(keep.start, keep.end); } catch (e) { /* not a text box */ }
    }
    return true;
  }
  return false;
}

// Focus without scrolling the page. Returns true when the target was found.
function focusQuiet(key) {
  return focusByKey(key, { start: null, end: null });
}

// Runs a change that redraws the view, then scrolls so the spot marked data-place stays where it was on
// screen: the part of the page under the pointer does not move. places is a name or a list of names, the
// first one found both before and after is used. Nothing found: the scroll is left alone.
function keepPlace(places, fn) {
  var list = [].concat(places || []);
  var tops = list.map(function (p) {
    var n = Shell.main.querySelector('[data-place="' + p + '"]');
    return n ? n.getBoundingClientRect().top : null;
  });
  fn();
  for (var i = 0; i < list.length; i++) {
    if (tops[i] === null) continue;
    var after = Shell.main.querySelector('[data-place="' + list[i] + '"]');
    if (!after) continue;
    var dy = after.getBoundingClientRect().top - tops[i];
    if (dy) window.scrollBy(0, dy);
    return;
  }
}

function updateView() {
  var v = currentView();
  var keep = captureFocus();
  // Only the Week view uses the wider page. The header keeps the same width in every view.
  Shell.root.classList.toggle("is-wide", v === "week");
  Shell.main.textContent = "";
  VIEWS.forEach(function (x) { if (x.id === v) x.render(Shell.main); });
  Shell.main.setAttribute("aria-labelledby", "tab-" + v);
  if (keep) focusByKey(keep.key, keep);
}

function selectView(id, focusTab) {
  App.view = id;
  if (id === "today") App.timeChartOpen = false;
  rememberTab(id);
  render();
  if (focusTab) {
    var b = Shell.tabs.querySelector("[data-view=" + id + "]");
    if (b) b.focus();
  }
}

function buildShell(app) {
  Shell.banners = el("div", { id: "banners" });
  Shell.recovery = el("div", { className: "recovery-wrap", role: "status" });
  Shell.reminder = el("div", { className: "reminder-wrap", role: "status" });
  Shell.main = el("main", { className: "view", id: "view", role: "tabpanel", tabindex: "-1" });
  Shell.tabs = el("div", { className: "tabs", role: "tablist", "aria-label": "Views" }, VIEWS.map(function (v) {
    return el("button", {
      type: "button",
      role: "tab",
      id: "tab-" + v.id,
      "data-view": v.id,
      "aria-controls": "view",
      onclick: function () { selectView(v.id, false); }
    }, v.label);
  }));
  Shell.tabs.addEventListener("keydown", function (e) {
    var i = VIEWS.map(function (v) { return v.id; }).indexOf(App.view);
    var next = null;
    if (e.key === "ArrowRight") next = (i + 1) % VIEWS.length;
    else if (e.key === "ArrowLeft") next = (i - 1 + VIEWS.length) % VIEWS.length;
    else if (e.key === "Home") next = 0;
    else if (e.key === "End") next = VIEWS.length - 1;
    if (next === null) return;
    e.preventDefault();
    selectView(VIEWS[next].id, true);
  });

  var skip = el("a", {
    className: "skip-link",
    href: "#view",
    onclick: function (e) { e.preventDefault(); Shell.main.focus(); }
  }, "Skip to content");

  app.textContent = "";
  app.appendChild(skip);
  Shell.root = el("div", { className: "shell" }, [
    el("header", { className: "topbar" }, [
      el("h1", { className: "app-name" }, APP_NAME),
      el("button", { type: "button", className: "primary", onclick: openQuickAdd }, "+ Quick add"),
      el("button", { type: "button", onclick: openSettings }, "Settings")
    ]),
    Shell.banners,
    Shell.recovery,
    Shell.reminder,
    Shell.tabs,
    Shell.main
  ]);
  app.appendChild(Shell.root);
}

function render() {
  if (!Shell.root) return; // the welcome screen has no shell yet
  // While a card is held or dragged the page must not be rebuilt under the pointer.
  // The redraw runs as soon as the pointer is released (see Drag).
  if (Drag.busy()) {
    App.renderPending = true;
    return;
  }
  App.renderPending = false;
  NotePreview.hide();
  App.shownDay = Core.todayISO();
  applySettings();
  updateBanners();
  updateTabs();
  updateView();
}

// "n" opens Quick add, but never while typing, holding a modifier, inside a dialog,
// or with a list or the color picker open or focused (the rules live in Core.quickAddShortcutAllowed).
function onGlobalKey(e) {
  if (App.firstRun) return;
  var t = e.target;
  var ok = Core.quickAddShortcutAllowed({
    key: e.key,
    ctrl: e.ctrlKey,
    alt: e.altKey,
    meta: e.metaKey,
    repeat: e.repeat,
    defaultPrevented: e.defaultPrevented,
    dialogOpen: Dialog.isOpen(),
    popupOpen: Popup.isOpen(),
    inPopup: !!(t && t.closest && t.closest("[data-popup]")),
    dragging: Drag.isActive(),
    tag: t && t.tagName,
    editable: !!(t && t.isContentEditable)
  });
  if (!ok) return;
  e.preventDefault();
  openQuickAdd();
}

document.addEventListener("DOMContentLoaded", function () {
  App.store = Core.createStore(getStorage());
  App.loadInfo = App.store.load();
  App.state = App.loadInfo.state;
  Recovery.refresh();
  // A planner that was never saved starts on the welcome screen (Phase 8c).
  App.firstRun = Core.isFirstRun(App.loadInfo);
  App.undo = Core.createUndoStack(Core.LIMITS.undo);
  App.saver = Core.createDebouncedSaver(saveNow, 400);

  window.addEventListener("pagehide", function () { App.saver.flush(); });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") App.saver.flush();
    // Back after midnight: the view shows the new date and the Fresh day question may come.
    else checkNewDay();
  });
  window.addEventListener("focus", checkNewDay);
  setInterval(checkNewDay, 60000);
  window.addEventListener("storage", function (e) {
    if (e.key === Core.KEYS.state || e.key === null) {
      App.otherTab = true;
      refreshStatus();
    }
    // Another tab kept, downloaded or removed a copy of old data: only the list is read again.
    if (e.key === null || e.key.indexOf(Core.KEYS.recovered) === 0) {
      Recovery.refresh();
      updateRecovery();
    }
  });

  document.addEventListener("keydown", onGlobalKey);
  bindPrintEvents();

  // The remembered tab. The welcome screen (App.firstRun) always wins.
  App.view = Core.pickStartView({ saved: savedTab(), firstRun: App.firstRun });

  if (App.firstRun) {
    openFirstRun();
    return;
  }
  buildShell(document.getElementById("app"));
  render();
  checkNewDay();
});

// Demo build only (Phase 11). The paid build never reads this folder. build.mjs --demo adds this file after
// ui.js and calls it through a few hooks (hooks.mjs). The pure rules at the top run in Node tests too.

// The one place for the link. Fill it in before you publish the demo. Until then the build warns loudly.
const DEMO_BUY_PLACEHOLDER = "https://www.etsy.com/";
const DEMO_BUY_URL = DEMO_BUY_PLACEHOLDER;
const DEMO_LIMIT = 12;

var Demo = (function () {
  var CoreRef = typeof Core !== "undefined" ? Core : require("../core.js");

  var text = {
    banner: "Demo version. Your plans stay in this browser.",
    bannerButton: "Get the full Elite Planner.",
    limitTitle: "This is the demo",
    limit: "The demo holds " + DEMO_LIMIT + " cards of your own. The full version has no card limit.",
    ok: "OK",
    buy: "Get the full version",
    importOff: "Import is off in the demo. The full version can bring a backup back."
  };

  // ---------- The rules (pure) ----------

  // Cards the person made. Sample cards (demo- ids) never count. An archived card is not counted either: the
  // person cannot open or delete it, only Bring back, which the commit net covers.
  function ownCardCount(state) {
    return state.tasks.filter(function (t) { return !CoreRef.isSampleTask(t) && !CoreRef.isArchived(t); }).length;
  }

  function roomLeft(state) {
    return Math.max(0, DEMO_LIMIT - ownCardCount(state));
  }

  // True when adding n more cards would pass the limit.
  function blocksAdd(state, n) {
    return n > 0 && ownCardCount(state) + n > DEMO_LIMIT;
  }

  // The commit net: a change that raises the count above the limit. Older data already over the limit may
  // still be edited or shrink, it just cannot grow.
  function wouldExceed(prev, next) {
    var after = ownCardCount(next);
    return after > DEMO_LIMIT && after > ownCardCount(prev);
  }

  function undoWouldExceed(state, entry) {
    return wouldExceed(state, CoreRef.applyUndo(state, entry));
  }

  function roomText(room) {
    if (room < 1) return "";
    return "There is room for " + room + " more " + (room === 1 ? "card" : "cards") + " right now.";
  }

  function buyUrlIsPlaceholder(url) {
    return !url || url === DEMO_BUY_PLACEHOLDER;
  }

  // ---------- The screen parts (browser only) ----------

  function openBuy() {
    window.open(DEMO_BUY_URL, "_blank", "noopener,noreferrer");
  }

  // The Energy Battery dialog shape: a title, kind words, the way out last.
  function openLimitDialog(room) {
    var kids = [el("p", null, text.limit)];
    var more = roomText(room);
    if (more) kids.push(el("p", { className: "hint" }, more));
    Dialog.open({
      title: text.limitTitle,
      body: el("div", null, kids),
      buttons: [
        { label: text.ok },
        { label: text.buy, primary: true, onclick: openBuy }
      ]
    });
  }

  // Hook for every place a card is added. Returns true when it is blocked (the dialog is open).
  function blocksAddAsk(state, n) {
    if (!blocksAdd(state, n)) return false;
    openLimitDialog(roomLeft(state));
    return true;
  }

  // Hook at the top of commit. A refused change leaves the state exactly as it was.
  function commitBlocked(next) {
    if (!wouldExceed(App.state, next)) return false;
    openLimitDialog(roomLeft(App.state));
    return true;
  }

  // Hook before an Undo takes its entry off the stack, so a refused Undo is not lost.
  function undoBlocked(entry) {
    if (!undoWouldExceed(App.state, entry)) return false;
    openLimitDialog(roomLeft(App.state));
    return true;
  }

  // Hook for every way into the planner from a file. Always blocks.
  function importOff() {
    Toast.show(text.importOff);
    return true;
  }

  // The Import button stays where it is, dimmed, and says why. A plain disabled button would say nothing.
  function offButton(node) {
    node.className = (node.className ? node.className + " " : "") + "demo-off";
    node.setAttribute("aria-disabled", "true");
    node.setAttribute("aria-describedby", "demo-import-hint");
    node.onclick = function () { importOff(); };
    return node;
  }

  function importHint() {
    return el("p", { className: "hint gentle", id: "demo-import-hint" }, text.importOff);
  }

  // In the page flow above the app, so it scrolls away and can never cover a button, a toast or a dialog.
  function showBanner() {
    var app = document.getElementById("app");
    if (!app || document.querySelector(".demo-banner")) return;
    var banner = el("div", { className: "demo-banner", role: "region", "aria-label": "Demo version" }, [
      el("p", null, text.banner),
      el("a", {
        className: "demo-buy",
        href: DEMO_BUY_URL,
        target: "_blank",
        rel: "noopener noreferrer"
      }, text.bannerButton)
    ]);
    app.parentNode.insertBefore(banner, app);
  }

  if (typeof document !== "undefined") {
    document.addEventListener("DOMContentLoaded", showBanner);
  }

  return {
    LIMIT: DEMO_LIMIT,
    DEMO_BUY_URL: DEMO_BUY_URL,
    DEMO_BUY_PLACEHOLDER: DEMO_BUY_PLACEHOLDER,
    text: text,
    ownCardCount: ownCardCount,
    roomLeft: roomLeft,
    blocksAdd: typeof document !== "undefined" ? blocksAddAsk : blocksAdd,
    wouldExceed: wouldExceed,
    undoWouldExceed: undoWouldExceed,
    roomText: roomText,
    buyUrlIsPlaceholder: buyUrlIsPlaceholder,
    commitBlocked: commitBlocked,
    undoBlocked: undoBlocked,
    importOff: importOff,
    offButton: offButton,
    importHint: importHint,
    showBanner: showBanner
  };
})();

if (typeof module !== "undefined" && module.exports) {
  module.exports = Demo;
}

</script>
</body>
</html>
