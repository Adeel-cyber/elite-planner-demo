function jumpKeys(e) {
  if (e.key === "Escape") {
    if (Drag.busy()) return;
    // Only the panel closes: nothing else sees this Esc.
    e.preventDefault();
    e.stopPropagation();
    closeJump();
    return;
  }
  var key = e.target && e.target.getAttribute ? e.target.getAttribute("data-key") : null;
  if (!key || key.indexOf("jm-") !== 0) return;
  var i = +key.slice(3);
  var grid = e.currentTarget.querySelector(".mo-months");
  var cols = grid ? getComputedStyle(grid).gridTemplateColumns.split(" ").length : 4;
  var to = null;
  if (e.key === "ArrowLeft") to = i - 1;
  else if (e.key === "ArrowRight") to = i + 1;
  else if (e.key === "ArrowUp") to = i - cols;
  else if (e.key === "ArrowDown") to = i + cols;
  else if (e.key === "Home") to = 1;
  else if (e.key === "End") to = 12;
  if (to === null) return;
  e.preventDefault();
  if (to >= 1 && to <= 12) focusByKey("jm-" + to);
}

function monthJumpPanel(cur, today) {
  var t = Core.monthOf(today);
  var year = moJumpYear === null ? cur.year : moJumpYear;
  var note = el("p", { className: "hint gentle mo-jump-note", role: "status", hidden: true });

  var yearBox = el("input", {
    type: "text",
    className: "mo-year",
    inputmode: "numeric",
    autocomplete: "off",
    maxLength: 4,
    "aria-label": "Year",
    "data-key": "jump-year"
  });
  yearBox.value = String(year);

  function apply(render_) {
    var r = Core.parseYearInput(yearBox.value);
    if (!r.ok) {
      note.textContent = r.message;
      note.hidden = false;
      return;
    }
    note.hidden = true;
    if (r.year !== moJumpYear) {
      moJumpYear = r.year;
      if (render_) render();
    }
  }
  yearBox.addEventListener("input", function () {
    yearBox.value = yearBox.value.replace(/\D/g, "");
    note.hidden = true;
    // A whole valid year applies as it is typed. A part of one waits for Enter or leaving the box.
    if (yearBox.value.length === 4 && Core.parseYearInput(yearBox.value).ok) apply(true);
  });
  yearBox.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); apply(true); }
  });
  // Leaving the box never redraws (that could swallow the click on a month button), it only keeps the year.
  yearBox.addEventListener("blur", function () {
    if (yearBox.value.trim()) apply(false);
  });

  function yearStep(n, key, text) {
    var next = Core.clampYear(year + n);
    return el("button", {
      type: "button",
      "data-key": key,
      disabled: next === year,
      onclick: function () { moJumpYear = next; render(); }
    }, text);
  }

  var months = [];
  for (var m = 1; m <= 12; m++) {
    (function (mm) {
      var shown = year === cur.year && mm === cur.month;
      var thisMonth = year === t.year && mm === t.month;
      months.push(el("button", {
        type: "button",
        className: "mo-jm" + (thisMonth ? " is-today" : ""),
        "data-key": "jm-" + mm,
        "aria-pressed": shown ? "true" : "false",
        "aria-label": Core.monthTitle(year, mm) + (thisMonth ? ", this month" : ""),
        onclick: function () { pickMonth(mm); }
      }, Core.shortMonthName(mm)));
    })(m);
  }

  var panel = el("div", { className: "mo-jump", id: "mo-jump", role: "group", "aria-label": "Choose month and year" }, [
    el("div", { className: "mo-yearrow" }, [
      yearStep(-1, "year-prev", "Previous year"),
      yearBox,
      yearStep(1, "year-next", "Next year")
    ]),
    note,
    el("div", { className: "mo-months" }, months)
  ]);
  panel.addEventListener("keydown", jumpKeys);
  return panel;
}

// Old data (Phase 9c, REVIEW.md H2): a saved planner that could not be read, or needed a repair, is kept as a
// copy (Core createStore.keepRecovered). This banner gets it back to the person as a .txt file, one copy at a
// time, oldest first. A copy is removed only from the person's own confirm, never by itself.
// States: A "Download my old data" or "Not now", B just downloaded (Remove or Keep it for now), C the remove
// question. Settings (backup.js) lists every copy too.

var Recovery = {
  list: [], // store.listRecovered(), read again only after a change: a copy may be megabytes
  marks: Object.create(null), // slot: downloadedAt, in case the info key had no room (this session only)
  memoryDone: false, // the copy held only in memory (no room to keep it) was downloaded
  snoozed: false, // "Not now", until the next open
  step: null, // null (A), "done" (B) or "confirm" (C)
  slot: null, // the copy the step is about, 0 for the one in memory
  filename: "",
  focusKey: null, // the banner button to focus after the next draw

  refresh: function () {
    var list = App.store && App.store.persistent ? App.store.listRecovered() : [];
    list.forEach(function (c) { if (!c.downloadedAt && Recovery.marks[c.slot]) c.downloadedAt = Recovery.marks[c.slot]; });
    Recovery.list = list;
  }
};

// The copy held only in memory: the load could not keep it (no room), so saving is locked and the planner
// key still holds it untouched. It comes first, it is the most urgent.
function recoveryMemoryCopy() {
  var info = App.loadInfo;
  if (!info || info.status !== "locked" || typeof info.raw !== "string") return null;
  return { slot: 0, chars: info.raw.length, keptAt: null, kind: info.kind || null, downloadedAt: Recovery.memoryDone ? "memory" : null };
}

function recoveryAll() {
  var mem = recoveryMemoryCopy();
  return (mem ? [mem] : []).concat(Recovery.list);
}

// The copy the banner is about, or null for no banner. A downloaded copy does not bring it back on a later open.
function recoveryCurrent() {
  var all = recoveryAll();
  if (Recovery.step) {
    for (var i = 0; i < all.length; i++) if (all[i].slot === Recovery.slot) return all[i];
    Recovery.step = null; // removed in another tab or from Settings
  }
  if (Recovery.snoozed) return null;
  for (var j = 0; j < all.length; j++) if (!all[j].downloadedAt) return all[j];
  return null;
}

// Saves one copy as a .txt file, read fresh at the click. Returns the file name, or null when the copy is gone.
function recoveryDownload(copy) {
  var text = copy.slot ? App.store.readRecoveredSlot(copy.slot) : App.loadInfo.raw;
  if (typeof text !== "string") {
    Recovery.refresh();
    return null;
  }
  var name = Core.recoveredFileName(copy);
  downloadText(text, name, "text/plain;charset=utf-8");
  if (copy.slot) {
    // When the info key has no room the mark lives in memory; the next open may ask again (the safe side).
    Recovery.marks[copy.slot] = Core.nowStamp();
    App.store.markRecoveredDownloaded(copy.slot);
  } else {
    Recovery.memoryDone = true;
  }
  Recovery.refresh();
  return name;
}

// The one remove path for the banner and Settings. Returns true when the copy is gone.
function recoveryRemove(slot) {
  var ok = App.store.removeRecovered(slot).ok;
  delete Recovery.marks[slot];
  if (Recovery.slot === slot) Recovery.step = null;
  Recovery.refresh();
  return ok;
}

function recoveryGo(step, slot, focusKey) {
  Recovery.step = step;
  Recovery.slot = slot;
  Recovery.focusKey = focusKey;
  updateRecovery();
}

function recoveryButton(text, key, onclick, opts) {
  opts = opts || {};
  return el("button", {
    type: "button",
    className: opts.primary ? "primary" : "",
    "data-rk": key,
    disabled: !!opts.disabled,
    onclick: onclick
  }, text);
}

function recoveryBanner(copy) {
  var kids = [];
  var buttons = [];
  var otherTab = !!App.otherTab;
  if (Recovery.step === "confirm") {
    kids.push(el("p", null, Core.recoveredRemoveText(!!copy.downloadedAt)));
    buttons.push(recoveryButton("Keep it", "no", function () { recoveryGo("done", copy.slot, "remove"); }, { primary: true }));
    buttons.push(recoveryButton("Yes, remove it", "yes", function () {
      var ok = recoveryRemove(copy.slot);
      Toast.show(ok ? Core.MSG.recoveredRemoved : "Nothing was removed. Please try again.");
      recoveryGo(null, null, "download");
    }, { disabled: otherTab }));
  } else if (Recovery.step === "done") {
    kids.push(el("p", null, Core.recoveredDoneText(Recovery.filename)));
    if (copy.slot) {
      if (otherTab) kids.push(el("p", { className: "hint" }, "This planner was changed in another tab. Reload first, then remove."));
      buttons.push(recoveryButton("Remove it from this browser", "remove", function () { recoveryGo("confirm", copy.slot, "no"); }, { disabled: otherTab }));
      buttons.push(recoveryButton("Keep it for now", "keep", function () { recoveryGo(null, null, "download"); }));
    } else {
      buttons.push(recoveryButton("Done", "keep", function () { recoveryGo(null, null, "download"); }));
    }
  } else {
    var waiting = recoveryAll().filter(function (c) { return !c.downloadedAt; }).length;
    // The words about what happened apply only to the copy this open just kept.
    var now = copy.slot && copy.slot === App.loadInfo.slot ? App.loadInfo.kind : null;
    kids.push(el("p", null, Core.recoveredBannerText({ kind: now, chars: copy.chars, count: waiting })));
    buttons.push(recoveryButton("Download my old data", "download", function () {
      var name = recoveryDownload(copy);
      if (!name) {
        Toast.show(Core.MSG.recoveredGone);
        return recoveryGo(null, null, "download");
      }
      Recovery.filename = name;
      recoveryGo("done", copy.slot, "keep");
    }, { primary: true }));
    buttons.push(recoveryButton("Not now", "later", function () {
      Recovery.snoozed = true;
      recoveryGo(null, null, null);
    }));
  }
  kids.push(el("div", { className: "recovery-actions" }, buttons));
  return el("div", { className: "banner recovery-bar" }, kids);
}

// Drawn again only when what it shows changes, so a redraw never takes a button away. Called by updateBanners.
function updateRecovery() {
  var node = Shell.recovery;
  if (!node) return; // the welcome screen has no shell yet
  var copy = recoveryCurrent();
  var key = copy ? JSON.stringify([Recovery.step, copy.slot, copy.chars, copy.downloadedAt, Recovery.filename,
    recoveryAll().length, !!App.otherTab]) : "";
  var want = Recovery.focusKey;
  Recovery.focusKey = null;
  if (key === Shell.recoveryKey) return;
  Shell.recoveryKey = key;
  var hadFocus = node.contains(document.activeElement);
  node.textContent = "";
  if (copy) node.appendChild(recoveryBanner(copy));
  var target = want ? node.querySelector('[data-rk="' + want + '"]') : null;
  if (target && !target.disabled) target.focus({ preventScroll: true });
  else if (hadFocus) Shell.main.focus({ preventScroll: true });
}

function swatchNode(t, current) {

    checked: t.id === current,
    onchange: function () { setSetting("theme", t.id); }

  ]);

// Numbers pick the nearest option (an imported 1.1 shows as Medium). Strings must match exactly.
// exact: numbers must match too, so an unusual value (backupReminderDays 3 from a file) checks nothing.
function segmentedGroup(name, legend, options, currentValue, key, exact) {
  var nearest = exact ? null : options[0].value;
  options.forEach(function (o) {
    if (typeof o.value === "string" || exact) { if (o.value === currentValue) nearest = o.value; }
    else if (Math.abs(o.value - currentValue) < Math.abs(nearest - currentValue)) nearest = o.value;
  });
  return el("fieldset", { className: "settings-block" }, [
    el("legend", null, legend),
    el("div", { className: "segmented" }, options.map(function (o) {
      return el("label", null, [
        el("input", {
          type: "radio",
          name: name,
          value: String(o.value),
          checked: o.value === nearest,
          onchange: function () { setSetting(key, o.value); }
        }),
        el("span", null, o.label)
      ]);
    }))
  ]);
}

// Labels: rename, recolor, add, delete (with Undo). Text is always the theme color,
// the label color is only a circle and the chip border, so contrast never depends on the label.

// What the color list shows for a stored color: a preset name, or "custom" for any other hex.
function colorChoice(color) {
  var preset = Core.paletteMatch(color);
  if (preset) return preset.name;
  return Core.normalizeLabelColor(color).charAt(0) === "#" ? "custom" : Core.normalizeLabelColor(color);
}

function colorItems(color) {
  var items = Core.LABEL_PALETTE.map(function (p) { return { value: p.name, label: p.name, color: p.name }; });
  var custom = colorChoice(color) === "custom";
  items.push({
    value: "custom",
    label: custom ? "Custom " + Core.labelHex(color) : "Custom color",
    color: custom ? color : "rainbow"
  });
  return items;
}
function labelEditor() {
  var list = el("div", { className: "label-list" });
  var undoBar = el("div", { className: "undo-bar", hidden: true });

  function clearUndoBar() {
    undoBar.hidden = true;
    undoBar.textContent = "";
  }

  function remove(id) {
    var r = Core.deleteLabel(App.state, id);
    if (!r.undo) return;
    var entry = r.undo;
    // If the board was filtered by this label, fall back to All areas first.
    App.boardFilter = Core.validFilter(r.state, App.boardFilter);
    commit(r.state, entry);
    draw();
    function undo() {
      if (App.undo.peek() === entry) App.undo.pop();
      commit(Core.applyUndo(App.state, entry));
      clearUndoBar();
      Toast.hide();
      draw();
    }
    // The toast is outside the drawer, so keyboard users get the same Undo inside it.
    undoBar.textContent = "";
    undoBar.hidden = false;
    undoBar.appendChild(el("span", { dir: "auto" }, entry.label));
    undoBar.appendChild(el("button", { type: "button", onclick: undo }, "Undo"));
    Toast.show(entry.label, { undo: undo });
  }

  function row(l) {
    var name = el("input", {
      type: "text",
      maxLength: Core.LIMITS.labelName,
      autocomplete: "off",
      dir: "auto",
      "aria-label": "Label name"
    });
    name.value = l.name;
    name.onchange = function () {
      clearUndoBar();
      commit(Core.updateLabel(App.state, l.id, { name: name.value }));
      // A blank name goes back to the old one.
      var saved = findLabel(l.id);
      if (saved) name.value = saved.name;
    };
    function save(picked) {
      clearUndoBar();
      commit(Core.updateLabel(App.state, l.id, { color: picked }));
      var saved = findLabel(l.id);
      color.setItems(colorItems(saved.color));
      color.value = colorChoice(saved.color);
    }
    var color = Menu.select({
      ariaLabel: "Label color",
      items: colorItems(l.color),
      value: colorChoice(l.color),
      className: "color-select",
      onchange: function (value) {
        if (value !== "custom") { save(value); return; }
        var saved = findLabel(l.id);
        ColorPicker.open({ wrap: color, trigger: color.trigger, color: saved ? saved.color : l.color, onDone: save });
        return false;
      }
    });
    return el("div", { className: "label-row" }, [
      color,
      name,
      el("button", { type: "button", "aria-label": "Delete label " + l.name, onclick: function () { remove(l.id); } }, "Delete")
    ]);
  }

  function draw() {
    list.textContent = "";
    App.state.labels.forEach(function (l) { list.appendChild(row(l)); });
    if (!App.state.labels.length) list.appendChild(el("p", { className: "hint" }, "No labels yet."));
  }
  draw();

  return el("fieldset", { className: "settings-block" }, [
    el("legend", null, "Labels"),
    list,
    undoBar,
    el("button", {
      type: "button",
      onclick: function () {
        clearUndoBar();
        var color = Core.LABEL_PALETTE[App.state.labels.length % Core.LABEL_PALETTE.length].name;
        commit(Core.addLabel(App.state, { name: "New label", color: color }).state);
        draw();
        var inputs = list.querySelectorAll("input[type=text]");
        var last = inputs[inputs.length - 1];
        if (last) { last.focus(); last.select(); }
      }
    }, "Add label")
  ]);
}

// Time learning: how many time records there are, and a Reset with a clear confirm inside the drawer
// (a second dialog would close the drawer) and an Undo here and in a toast. Cards keep their times.
function timeLearningBlock() {
  var box = el("fieldset", { className: "settings-block" });
  var undoEntry = null;

  function reset() {
    var r = Core.resetTimeLog(App.state);
    if (!r.undo) return draw();
    undoEntry = r.undo;
    commit(r.state);
    Toast.show("Time learning was reset.", { undo: undo });
    draw("undo");
  }

  function undo() {
    if (!undoEntry) return;
    commit(Core.applyTimeLogUndo(App.state, undoEntry));
    undoEntry = null;
    Toast.hide();
    draw();
  }

  function draw(mode) {
    box.textContent = "";
    var n = App.state.timeLog.length;
    box.appendChild(el("legend", null, "Time learning"));
    box.appendChild(el("p", { className: "hint" }, n
      ? (n === 1 ? "1 time record." : n + " time records.") + " The planner uses them to learn how long things take you."
      : "Nothing learned yet. Finish a Focus session on a card with a guess, or type the time it took."));
    var focusKey = "reset";
    if (mode === "confirm") {
      box.appendChild(el("div", { className: "undo-bar is-wrap", role: "group", "aria-label": "Reset time learning" }, [
        el("span", null, "Start learning again? Your cards keep their times. Only the learning record is cleared."),
        el("button", { type: "button", "data-tl": "yes", onclick: reset }, "Yes, reset"),
        el("button", { type: "button", "data-tl": "keep", onclick: function () { draw(); } }, "Keep it")
      ]));
      focusKey = "keep";
    } else if (mode === "undo") {
      box.appendChild(el("div", { className: "undo-bar" }, [
        el("span", null, "Time learning was reset."),
        el("button", { type: "button", "data-tl": "undo", onclick: undo }, "Undo")
      ]));
      focusKey = "undo";
    } else {
      box.appendChild(el("button", {
        type: "button",
        "data-tl": "reset",
        disabled: !n,
        onclick: function () { draw("confirm"); }
      }, "Reset time learning"));
    }
    if (mode) {
      var target = box.querySelector('[data-tl="' + focusKey + '"]');
      if (target) target.focus();
    }
  }
  draw();
  return box;
}

// My waking hours: two typed times (like the Week start box). The Week "Full day" note compares a day's
// real time with them. Saved on blur or Enter when both are fine, otherwise a kind line and nothing changes.
function wakingHoursBlock() {
  var hours = Core.awakeHours(App.state.settings);
  function box(value, label) {
    var input = el("input", {
      type: "text",
      className: "time-input",
      inputmode: "numeric",
      autocomplete: "off",
      maxLength: 5,
      "aria-label": label,
      title: "Type a time like 08:00"
    });
    input.value = value;
    return input;
  }
  var from = box(hours.start, "Waking hours start");
  var to = box(hours.end, "Waking hours end");
  var note = el("p", { className: "hint gentle", role: "status", hidden: true });

  function save() {
    var r = Core.checkAwake(from.value, to.value);
    note.textContent = r.ok ? "" : r.message;
    note.hidden = r.ok;
    if (!r.ok) return;
    from.value = r.start;
    to.value = r.end;
    var s = App.state.settings;
    if (s.awakeStart === r.start && s.awakeEnd === r.end) return;
    commit(Object.assign({}, App.state, { settings: Object.assign({}, s, { awakeStart: r.start, awakeEnd: r.end }) }));
  }
  [from, to].forEach(function (input) {
    input.addEventListener("change", save);
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); save(); }
    });
  });

  return el("fieldset", { className: "settings-block" }, [
    el("legend", null, "My waking hours"),
    el("div", { className: "awake-row" }, [
      el("label", { className: "field" }, [el("span", null, "From"), from]),
      el("label", { className: "field" }, [el("span", null, "To"), to])
    ]),
    note,
    el("p", { className: "hint" }, "The Week shows a gentle Full day note when a day's real time is longer than this.")
  ]);
}

// Tidy the shelf (Later shelf cleanup, Phase 7c). Opened only from the Later shelf buttons. Lists Later cards
// that rested there over 30 days with Archive or Keep, and the Archived list with Bring back.
// Nothing is deleted. Every change has an Undo inside the dialog (keyboard users reach it) and in a toast.
// opts: { archivedOpen } opens with the Archived list unfolded.

function openTidyShelf(opts) {
  var today = Core.todayISO();
  // The rows keep the order they had when the dialog opened, so an archived row turns into its Undo in place.
  var order = Core.laterCleanupList(App.state, today).map(function (it) { return it.task.id; });
  var kept = Object.create(null);
  var records = []; // { kind: "archive" or "back", ids, undo, text, used, toast }
  var archivedOpen = !!(opts && opts.archivedOpen);
  var body = el("div", { className: "tidy" });

  function find(id) {
    for (var i = 0; i < App.state.tasks.length; i++) if (App.state.tasks[i].id === id) return App.state.tasks[i];
    return null;
  }

  function liveRecord(id, kind) {
    for (var i = 0; i < records.length; i++) {
      var r = records[i];
      if (!r.used && r.kind === kind && r.ids.indexOf(id) >= 0) return r;
    }
    return null;
  }

  // Runs once, from the dialog or the toast, whichever is pressed first.
  function undo(rec) {
    if (rec.used) return;
    rec.used = true;
    if (rec.toast) Toast.remove(rec.toast);
    var res = Core.applyArchiveUndo(App.state, rec.undo);
    if (res.count) commit(res.state);
    else Toast.show("That card was changed again, so Undo left it alone.", { ms: 4000, tapDismiss: true, coexist: true });
    if (handle && Dialog.current === handle) draw(rec.kind === "archive" ? "row-" + rec.ids[0] : "archived-toggle");
  }

  function remember(kind, r, text) {
    var rec = { kind: kind, ids: r.changed, undo: r.undo, text: text, used: false, toast: null };
    records.push(rec);
    commit(r.state);
    rec.toast = Toast.show(text, { undo: function () { undo(rec); }, coexist: true });
    return rec;
  }

  function archive(ids, focusAfter) {
    var r = Core.archiveTasks(App.state, ids, today);
    if (!r.changed.length) return draw(focusAfter);
    var t = r.changed.length === 1 ? find(r.changed[0]) : null;
    remember("archive", r, t ? "“" + Core.safeTruncate(t.title, 60) + "” archived." : Core.archivedText(r.changed.length));
    draw(focusAfter);
  }

  function bringBack(id) {
    var r = Core.bringBackTasks(App.state, [id]);
    if (!r.changed.length) return draw("archived-toggle");
    remember("back", r, Core.broughtBackText(1));
    draw("back-undo");
  }

  // What is shown in the tidy list right now: a card row, or the Undo bar of a change made here.
  function tidyItems() {
    var listed = Object.create(null);
    Core.laterCleanupList(App.state, today).forEach(function (it) { listed[it.task.id] = it; });
    var shown = [];
    var items = [];
    order.forEach(function (id) {
      var rec = liveRecord(id, "archive");
      if (rec) {
        // One Undo bar per change, where its first card was (Archive all is one change).
        if (shown.indexOf(rec) < 0) items.push({ rec: rec, id: id });
        shown.push(rec);
      } else if (!kept[id] && listed[id]) {
        items.push({ it: listed[id], id: id });
      }
    });
    return items;
  }

  function undoBar(rec, key) {
    return el("div", { className: "undo-bar is-wrap", role: "group", "aria-label": rec.text }, [
      el("span", { dir: "auto" }, rec.text),
      el("button", { type: "button", "data-tidy": key, onclick: function () { undo(rec); } }, "Undo")
    ]);
  }

  function tidyRowEl(item) {
    if (item.rec) return el("li", { className: "tidy-item" }, undoBar(item.rec, "undo-" + item.id));
    var t = item.it.task;
    return el("li", { className: "tidy-item" }, [
      el("span", { className: "tidy-title", dir: "auto" }, t.title),
      el("span", { className: "tidy-note" }, Core.laterSinceText(t.laterAt)),
      el("div", { className: "tidy-actions" }, [
        el("button", {
          type: "button",
          "data-tidy": "row-" + t.id,
          "aria-label": "Archive " + t.title,
          onclick: function () { archive([t.id], nextKey(t.id)); }
        }, "Archive"),
        el("button", {
          type: "button",
          "aria-label": "Keep " + t.title,
          onclick: function () { kept[t.id] = true; draw(nextKey(t.id)); }
        }, "Keep")
      ])
    ]);
  }

  // Where focus goes once a row is handled: the next row's Archive button, else the list's first button.
  function nextKey(id) {
    var rows = tidyItems().filter(function (i) { return i.it; });
    for (var n = 0; n < rows.length; n++) {
      if (rows[n].id === id) return rows[n + 1] ? "row-" + rows[n + 1].id : n ? "row-" + rows[0].id : "first";
    }
    return "first";
  }

  function archivedSection() {
    var list = Core.archivedList(App.state);
    var backs = records.filter(function (r) { return r.kind === "back" && !r.used; });
    var kids = [el("button", {
      type: "button",
      className: "col-toggle",
      "data-tidy": "archived-toggle",
      "aria-expanded": archivedOpen ? "true" : "false",
      "aria-controls": "tidy-archived",
      onclick: function () { archivedOpen = !archivedOpen; draw("archived-toggle"); }
    }, "Archived (" + list.length + ")")];
    if (archivedOpen) {
      kids.push(el("div", { id: "tidy-archived" }, [
        backs.length ? undoBar(backs[backs.length - 1], "back-undo") : null,
        list.length ? el("ul", { className: "tidy-list" }, list.map(function (t) {
          return el("li", { className: "tidy-item" }, [
            el("span", { className: "tidy-title", dir: "auto" }, t.title),
            el("span", { className: "tidy-note" }, Core.archivedOnText(t.archivedAt)),
            el("div", { className: "tidy-actions" }, el("button", {
              type: "button",
              "aria-label": "Bring back " + t.title,
              onclick: function () { bringBack(t.id); }
            }, "Bring back"))
          ]);
        })) : el("p", { className: "hint" }, "Nothing is archived.")
      ]));
    }
    return el("section", { className: "tidy-archived", "aria-label": "Archived cards" }, kids);
  }

  function draw(focusKey) {
    body.textContent = "";
    var items = tidyItems();
    var rows = items.filter(function (i) { return i.it; });
    if (order.length) {
      body.appendChild(el("p", null,
        "These have rested on Later for over 30 days. Archive tucks a card away. It stays safe and is kept in your backups."));
      if (items.length) body.appendChild(el("ul", { className: "tidy-list" }, items.map(tidyRowEl)));
      if (!rows.length) body.appendChild(el("p", { className: "hint", "data-tidy-done": "" }, "All tidy."));
      if (rows.length > 1) {
        body.appendChild(el("button", {
          type: "button",
          className: "tidy-all",
          "data-tidy": "all",
          onclick: function () { archive(rows.map(function (i) { return i.id; }), "first"); }
        }, "Archive all (" + rows.length + ")"));
      }
      if (rows.length) body.appendChild(el("p", { className: "hint" }, "Keep leaves a card here. It may show up again next time."));
    } else {
      body.appendChild(el("p", null, "Nothing on Later has rested there for over 30 days."));
    }
    body.appendChild(archivedSection());
    if (!focusKey) return;
    var target = focusKey === "first" ? body.querySelector("button") : body.querySelector('[data-tidy="' + focusKey + '"]');
    (target || body.querySelector("button")).focus();
  }

  draw();
  var handle = Dialog.open({
    title: "Tidy the shelf",
    className: "tidy-dialog",
    body: body,
    buttons: [{ label: "Done", primary: true }],
    // The shelf button that opened this may have been redrawn. Focus goes to it again, else the shelf toggle.
    fallbackFocus: function () {
      if (!focusByKey("tidy-open") && !focusByKey("archived-open") && !focusByKey("later-toggle")) {
        Shell.main.focus({ preventScroll: true });
      }
    }
  });
  if (archivedOpen) draw("archived-toggle");
}

// Today view: the day's energy battery, three focus slots, a small Done today strip, a list to pick from,
// and a Brain Dump box.
// Only open cards count toward the 3. Finished ones step aside into the strip and free their slot.

// The Brain Dump text, kept here so a redraw never loses it.
var brainDraft = "";

var PICK_SHOWN = 8;

function slotNumber(n) {
  return el("span", { className: "slot-num", "aria-hidden": "true" }, String(n));
}

// The slot list (data-place "slots") is kept still on screen when a card leaves it (keepPlace in ui.js).
// The list, not the slot: an empty slot is drawn centered in its row, so its own box sits lower.
// Each slot is marked "slot-N" so focus can find the spot. An empty slot can take focus, so focus never
// falls to the page after a card leaves.
function emptySlot(n) {
  return el("li", { className: "slot empty", "data-place": "slot-" + n, "data-key": "slot-empty-" + n, tabindex: "-1" }, [
    slotNumber(n),
    el("p", null, "Room for one more. Pick something from your board below.")
  ]);
}

function filledSlot(t, n, date) {
  var label = t.labelId ? findLabel(t.labelId) : null;
  var prog = Core.stepProgress(t);
  var running = !!FocusRun && FocusRun.taskId === t.id;
  var meta = [];
  if (label) meta.push(labelChip(label));
  if (t.due) meta.push(el("time", { className: "due", datetime: t.due }, "Due " + Core.formatShortDate(t.due)));
  meta.push(el("span", { className: "size-word" }, Core.sizeText(t.cost)));
  if (prog.total) {
    meta.push(el("span", {
      className: "steps",
      "aria-label": prog.done + " of " + prog.total + " steps done"
    }, prog.done + "/" + prog.total));
  }
  if (t.status === "later") meta.push(el("span", null, "Parked in Later"));
  meta.push(NotePreview.button(t, ".slot"));
  var titleBtn = el("button", {
    type: "button",
    className: "slot-title",
    "data-key": "slot-" + t.id,
    "aria-haspopup": "dialog",
    onclick: function () { openCardEdit(t.id); }
  }, el("span", { className: "card-title", dir: "auto" }, t.title));
  var slot = el("li", { className: "slot", "data-place": "slot-" + n }, [
    slotNumber(n),
    titleBtn,
    el("div", { className: "card-meta" }, meta),
    el("div", { className: "slot-actions" }, [
      el("button", {
        type: "button",
        className: "primary big",
        "data-key": "start-" + t.id,
        onclick: function () { startFocus(t.id); }
      }, running ? "Resume focus" : "Start"),
      el("button", {
        type: "button",
        "data-key": "small-" + t.id,
        onclick: function () { openCardEdit(t.id, { makeSmaller: true }); }
      }, "Make it smaller"),
      el("button", {
        type: "button",
        onclick: function () {
          keepPlace("slots", function () { commit(Core.removeFocus(App.state, date, t.id)); });
          Toast.show("Back on your board, safe and sound.");
          focusSlotSpot(n);
        }
      }, "Not today")
    ])
  ]);
  NotePreview.attach(slot, titleBtn, t);
  return slot;
}

// After a card leaves slot n: focus the Start button of the card that fills that spot now, or the empty
// slot. Never scrolls.
function focusSlotSpot(n) {
  var spot = Shell.main.querySelector('[data-place="slot-' + n + '"]');
  var start = spot && spot.querySelector("[data-key^='start-']");
  if (start) return focusQuiet(start.getAttribute("data-key"));
  if (spot) return focusQuiet("slot-empty-" + n);
  return false;
}

function doneStrip(done) {
  if (!done.length) return null;
  return el("section", { className: "done-strip", "aria-labelledby": "done-today-h" }, [
    el("h3", { id: "done-today-h" }, "Done today"),
    el("ul", null, done.map(function (t) {
      var li = el("li", null, [
        el("span", { "aria-hidden": "true" }, "✓ "),
        el("span", { dir: "auto" }, t.title),
        NotePreview.button(t, "li")
      ]);
      NotePreview.attach(li, null, t);
      return li;
    }))
  ]);
}

// Time Reality Check: a friendly card once the planner has learned (5 records or more). The last 10, as
// guess and real time, are folded under "See my last 10" (App.timeChartOpen, memory only, folded each time
// Today opens). The numbers are always text, the bars only repeat them. No open animation.
function timeChartList() {
  var rows = Core.timeChart(App.state);
  var max = 1;
  rows.forEach(function (r) { max = Math.max(max, r.estimate, r.actual); });
  function bar(kind, mins) {
    return el("span", { className: "tc-bar " + kind, style: "--w:" + Math.max(2, Math.round(mins / max * 100)) + "%" });
  }
  return el("div", { className: "tc-open", id: "time-chart" }, [
    el("p", { className: "tc-legend", "aria-hidden": "true" }, [

function brainDumpSection() {

    "aria-label": "Brain Dump",
    "data-key": "brain"

  box.value = brainDraft;

  box.addEventListener("input", function () {
    brainDraft = box.value;

  });
  return el("form", {
    className: "today-block brain",
    "aria-labelledby": "brain-h",
    onsubmit: function (e) {
      e.preventDefault();
      var parsed = Core.parseBrainDump(box.value);

        {
          undo: function () {
            // The typed text comes back with the removed cards (brainDraft is read when Today is drawn).

            commit(Object.assign({}, App.state, {
              tasks: App.state.tasks.filter(function (t) { return ids.indexOf(t.id) < 0; })
            }));
            focusQuiet("brain");
          }
        }
      );

    el("h3", { id: "brain-h" }, "Brain Dump"),

// The one place the sheet is made. Print today calls it, and so does the browser's own print (Ctrl+P or its
// menu) through beforeprint, so both give the same page. body.printing-today is what lets style.css hide
// the app: without a sheet the normal page prints. Safe to call twice.
function ensurePrintSheet() {
  if (document.getElementById("print-sheet")) return;
  NotePreview.hide();
  document.body.appendChild(buildPrintSheet(Core.todayISO()));
  document.body.classList.add("printing-today");
}

function removePrintSheet() {
  var old = document.getElementById("print-sheet");
  if (old) old.remove();
  document.body.classList.remove("printing-today");
}

// Registered once at boot (ui.js). Only Today has a sheet, other views print as they are.
function bindPrintEvents() {
  window.addEventListener("beforeprint", function () {
    if (App.view === "today" && !App.firstRun) ensurePrintSheet();
  });
  window.addEventListener("afterprint", removePrintSheet);
}

function printTodaySheet() {
  removePrintSheet();
  ensurePrintSheet();
  try {
    window.print();
  } catch (e) {
    removePrintSheet();
    Toast.show("Printing did not start. Try Ctrl+P or the Print option in your browser's menu.");
  }
}

// Week view: seven day columns with time rows, a rail of cards with no time yet, and editable blocks.
// Dragging uses the shared Drag helper (drag.js). Every drag also has a button path: a block opens a
// dialog (day, start, length), and every card has a Schedule button.

var WK_NARROW_PX = 96; // a block narrower than this shows its title on one line with "..."
var weekTopMins = null; // the time at the top of the grid, so a redraw or a new row size keeps the same hour
var weekAutoScroll = true; // the first open and This week (or Today) put "now" in view
var weekClock = null;
var weekMult = 1; // the learned multiplier for this draw (Core.planMultiplier), 1 until it is shown

function weekPm() {

}

// Week toasts are short and close with a tap. coexist keeps a delete Undo toast reachable.
function weekToast(text, undo) {
  Toast.show(text, { undo: undo, ms: undo ? 7000 : 4000, tapDismiss: true, coexist: true });
}

// The one-step Undo for a drop (Core.applyScheduleUndo) or for the Edit time block dialog
// (Core.applyBlockEditUndo, which also brings back the title and status). It leaves the card alone if it
// was deleted or changed since.
function undoScheduleChange(undo, apply) {
  var r = apply ? apply(App.state, undo) : Core.applyScheduleUndo(App.state, undo);
  if (r.ok) {
    commit(r.state);
    weekToast("Back where it was.");
  } else {
    weekToast(r.reason === "changed" ? "That block was changed again, so Undo left it alone."
      : "That card is gone, so there is nothing to undo.");
  }
}

function goToThisWeek() {
  App.weekDate = Core.todayISO();
  weekAutoScroll = true;
  render();
}

function weekDates() {
  return Core.weekDays(App.weekDate, App.state.settings.weekStart);
}

function shiftWeek(n) {
  App.weekDate = Core.addDays(App.weekDate, 7 * n);
  render();

function shiftDay(n) {
