<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elite Planner Demo</title>
<style>
/* Themes: tokens only. Every theme must define every token (tests check this). */
:root,
[data-theme="cream"] {
  --bg: #f6f0e4;
  --surface: #fffaf0;
  --surface2: #ebe2cf;
  --text: #2b2418;
  --muted: #5e5240;
  --past: #6b6355;
  --head: #7a4a1e;
  --accent: #7a4a1e;
  --accent-text: #ffffff;
  --border: #7d6e55;
  --focus: #7a4a1e;
}

[data-theme="midnight"] {
  --bg: #0f1830;
  --surface: #182544;
  --surface2: #22335c;
  --text: #e8ecf8;
  --muted: #b4bfdc;
  --past: #a3aed0;
  --head: #b9d0ff;
  --accent: #8fb4ff;
  --accent-text: #0f1830;
  --border: #6f84b8;
  --focus: #ffd166;
}

[data-theme="sage"] {
  --bg: #e8f0e4;
  --surface: #f5faf2;
  --surface2: #d8e5d2;
  --text: #1f2d22;
  --muted: #3f5444;
  --past: #4a5d4e;
  --head: #25563a;
  --accent: #2f6b3f;
  --accent-text: #ffffff;
  --border: #5f7a64;
  --focus: #2f6b3f;
}

[data-theme="lavender"] {
  --bg: #efe9f8;
  --surface: #f9f6fd;
  --surface2: #e1d8f1;
  --text: #2a2140;
  --muted: #52456f;
  --past: #5c5078;
  --head: #4b318a;
  --accent: #5b3fa0;
  --accent-text: #ffffff;
  --border: #7a6aa0;
  --focus: #5b3fa0;
}

[data-theme="sunny"] {
  --bg: #ffffff;
  --surface: #ffffff;
  --surface2: #fff7c2;
  --text: #000000;
  --muted: #333333;
  --past: #404040;
  --head: #000000;
  --accent: #ffd400;
  --accent-text: #000000;
  --border: #000000;
  --focus: #000000;
}

:root {
  --scale: 1;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-head: Georgia, "Times New Roman", serif;
  --radius: 12px;
  --speed: 180ms;
  --wk-lh: 1.45; /* Week block text line height. week.js reads it, so emoji and flags fit the line */
  --wk-h: 72vh;  /* Week grid and rail height */
}

* { box-sizing: border-box; }

html { font-size: calc(16px * var(--scale)); }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  line-height: 1.45;
}

/* Reduced motion: the OS setting or the in-app switch. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}
[data-motion="reduce"] *, [data-motion="reduce"] *::before, [data-motion="reduce"] *::after {
  transition: none !important;
  animation: none !important;
  scroll-behavior: auto !important;
}

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

button, input, select, textarea { font: inherit; color: inherit; }

button {
  min-height: 44px;
  min-width: 44px;
  padding: 8px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  cursor: pointer;
}

button:hover { background: var(--surface2); }

button.primary {
  background: var(--accent);
  color: var(--accent-text);
  border-color: var(--accent);
  font-weight: 600;
}

button.primary:hover { filter: brightness(1.08); }
[data-theme="sunny"] button.primary { border-color: #000; border-width: 2px; }
[data-theme="sunny"] button.primary:hover { filter: none; background: #ffe566; }

.skip-link {
  position: absolute;
  left: 8px;
  top: -80px;
  z-index: 100;
  background: var(--accent);
  color: var(--accent-text);
  padding: 10px 16px;
  border-radius: var(--radius);
}

.skip-link:focus { top: 8px; }

/* Shell */
.shell { max-width: 980px; margin: 0 auto; padding: 0 16px 48px; }

.topbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  padding: 16px 0 8px;
}

.app-name {
  margin: 0;
  margin-right: auto;
  font-family: var(--font-head);
  font-size: 1.6rem;
  color: var(--head);
}

.tabs {
  display: flex;
  gap: 4px;
  padding: 4px;
  margin: 8px 0 16px;
  background: var(--surface2);
  border-radius: var(--radius);
  overflow-x: auto;
}

.tabs button {
  flex: 1 1 0;
  border-color: transparent;
  background: transparent;
}

.tabs button[aria-selected="true"] {
  background: var(--surface);
  border-color: var(--border);
  font-weight: 700;
}

.banner {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
  margin: 8px 0;
  padding: 10px 14px;
  background: var(--surface2);
  border: 2px solid var(--border);
  border-radius: var(--radius);
}

.banner p { margin: 0; flex: 1 1 220px; }

.view { min-height: 40vh; }

/* Empty state */
.empty {
  max-width: 420px;
  margin: 48px auto;
  padding: 24px;
  text-align: center;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.empty h2 { margin: 0 0 8px; font-family: var(--font-head); color: var(--head); }
.empty p { margin: 0 0 16px; color: var(--muted); }

/* Dialog and drawer */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: rgba(0, 0, 0, 0.45);
}

.overlay.drawer-wrap { justify-content: flex-end; align-items: stretch; padding: 0; }

.dialog {
  width: 100%;
  max-width: 460px;
  max-height: 100%;
  overflow: auto;
  padding: 20px;
  background: var(--surface);
  color: var(--text);
  border: 2px solid var(--border);
  border-radius: var(--radius);
}

.dialog.drawer {
  max-width: 400px;
  border-radius: 0;
  border-width: 0 0 0 2px;
  animation: slide-in var(--speed) ease-out;
}

@keyframes slide-in { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }

.dialog h2 { margin: 0 0 12px; font-family: var(--font-head); color: var(--head); font-size: 1.3rem; }
.dialog-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 16px; }
/* Fresh day: three choices, one under the other at the same width, the main one first. */
.dialog.fresh .dialog-actions { flex-direction: column; align-items: stretch; flex-wrap: nowrap; }
.dialog.fresh .dialog-actions button { width: 100%; }
/* Esc with unsaved typing (Dialog hasChanges): a calm question above the buttons. */
.discard-ask { margin-top: 16px; padding: 10px 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; }
.discard-ask p { margin: 0 0 8px; font-weight: 600; }
.discard-actions { display: flex; flex-wrap: wrap; gap: 8px; }

/* Form bits */
.field { display: block; margin: 12px 0; }
.field > span { display: block; margin-bottom: 4px; font-weight: 600; }

.field input[type="text"], .field input[type="date"], .field select, .field textarea {
  width: 100%;
  min-height: 44px;
  padding: 8px 12px;
  background: var(--bg);
  border: 2px solid var(--border);
  border-radius: var(--radius);
}

.hint { margin: 4px 0 0; color: var(--muted); }
.hint.gentle { color: var(--text); font-weight: 600; }

/* Fresh day dialog (Soft Reset): one row per card, neutral note lines under the title. */
.fresh-list { list-style: none; margin: 8px 0 0; padding: 0; }
.fresh-list li { padding: 8px 0; border-top: 1px solid var(--border); overflow-wrap: anywhere; }
.fresh-list li:first-child { border-top: 0; }
.fresh-title { display: block; }
.fresh-note { display: block; color: var(--muted); font-size: 0.9rem; }

/* Later shelf cleanup (Phase 7c): the shelf buttons and the Tidy the shelf dialog. Neutral tokens only. */
.tidy-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.tidy-list { list-style: none; margin: 8px 0 0; padding: 0; }
.tidy-item { padding: 8px 0; border-top: 1px solid var(--border); overflow-wrap: anywhere; }
.tidy-item:first-child { border-top: 0; }
.tidy-item .undo-bar { margin: 0; }
.tidy-title { display: block; }
.tidy-note { display: block; color: var(--muted); font-size: 0.9rem; }
.tidy-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.tidy-all { margin-top: 8px; }
.tidy-archived { margin-top: 16px; padding-top: 8px; border-top: 1px solid var(--border); }
.tidy-archived .col-toggle { margin-bottom: 0; }

/* Settings */
.settings-block { margin: 0 0 20px; padding: 0; border: 0; min-width: 0; }
.settings-block legend { padding: 0; margin-bottom: 8px; font-weight: 700; }

.swatches { display: flex; flex-wrap: wrap; gap: 12px; }

.swatch { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; cursor: pointer; }
.swatch input { position: absolute; opacity: 0; width: 1px; height: 1px; }

.swatch .dot {
  display: block;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 2px solid var(--border);
}

.swatch input:checked + .dot { outline: 3px solid var(--focus); outline-offset: 2px; }
.swatch input:focus-visible + .dot { outline: 3px solid var(--focus); outline-offset: 4px; box-shadow: 0 0 0 2px var(--bg); }

/* The options share the row. When the longest word no longer fits (320 wide, Large text) an option wraps under the others. */
.segmented { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--surface2); border-radius: var(--radius); }
.segmented label { flex: 1 1 0; min-width: min-content; position: relative; }
.segmented input { position: absolute; opacity: 0; width: 1px; height: 1px; }

.segmented span {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 4px 8px;
  border: 1px solid transparent;
  border-radius: var(--radius);
  cursor: pointer;
  text-align: center;
}

.segmented input:checked + span { background: var(--surface); border-color: var(--border); font-weight: 700; }
.segmented input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }

.switch-row { display: flex; align-items: center; gap: 12px; min-height: 44px; cursor: pointer; }
.switch-row input { width: 24px; height: 24px; accent-color: var(--accent); }

.status-lines p { margin: 4px 0; color: var(--muted); }
.status-lines .version-line { font-size: 0.85rem; }

/* Backup (Settings block and the reminder bar). Calm colors only, the bar is never an alert. */
.backup-block .hint { margin: 0 0 4px; }
.backup-block > .hint.gentle:empty { display: none; }
.backup-block .settings-block { margin: 16px 0 0; }
.backup-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.backup-panel { margin: 8px 0; padding: 10px 12px; background: var(--surface2); border-radius: var(--radius); }
.backup-panel p { margin: 0 0 8px; overflow-wrap: anywhere; }
.backup-warnings { margin: 0 0 8px; padding-left: 20px; }
.backup-warnings li { overflow-wrap: anywhere; }
.reminder-bar { border-width: 1px; }
/* Old data (Phase 9c): the neutral banner colors, no alarm colors. The file name may be long, so text wraps anywhere. */
.recovery-bar p { overflow-wrap: anywhere; }
.recovery-bar .hint { flex-basis: 100%; }
.recovery-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.recovered-part { margin: 12px 0 0; }
.recovered-head { margin: 0 0 4px; font-weight: 700; }
@media (max-width: 480px) {
  .recovery-actions { flex-basis: 100%; }
  .recovery-actions button { flex: 1 1 auto; }
}

/* Toast */
.toast-wrap {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 16px;
  z-index: 80;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 0 16px;
  pointer-events: none;
}

.toast {
  display: flex;
  align-items: center;
  gap: 8px 12px;
  max-width: min(92vw, 30em);
  padding: 8px 8px 8px 16px;
  background: var(--text);
  color: var(--bg);
  border-radius: var(--radius);
  pointer-events: auto;
  animation: slide-up var(--speed) ease-out;
}

.toast button { background: var(--bg); color: var(--text); border-color: var(--bg); }
/* One row: the message is as wide as its words and wraps beside the buttons. The buttons never shrink, so Undo
   always fits its label and stays centered. When the message needs more than 2 lines there, Toast.fit adds
   is-stacked: the message takes the first row and Undo and close sit on their own row on the right. */
.toast-text { flex: 1 1 auto; min-width: 0; }
.toast.is-stacked { flex-wrap: wrap; }
.toast.is-stacked .toast-text { flex-basis: 100%; }
.toast-actions { display: flex; align-items: center; gap: 12px; flex: none; margin-left: auto; }
.toast-actions button { flex: none; white-space: nowrap; }
/* Close is the last thing in the toast, a gap away from Undo, in the toast's own text color. */
.toast .toast-close { flex: none; min-width: 44px; min-height: 44px; margin-left: 8px; padding: 0; background: transparent; color: inherit; border-color: transparent; font-size: 1.4rem; line-height: 1; }
.toast .toast-close:focus-visible { outline: 3px solid currentColor; outline-offset: -3px; }

@keyframes slide-up { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }

/* Menu */
.menu-wrap { position: relative; display: inline-block; }

.menu {
  position: absolute;
  z-index: 60;
  top: 100%;
  left: 0;
  min-width: 180px;
  margin-top: 4px;
  padding: 4px;
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: var(--radius);
}

/* Only menu rows get the flat look. Buttons inside a popover (the color picker) keep the normal button styles. */
.menu button[role="menuitem"] { display: block; width: 100%; text-align: left; border-color: transparent; background: transparent; }
.menu button[role="menuitem"]:hover, .menu button[role="menuitem"]:focus-visible { background: var(--surface2); }
.menu { max-width: calc(100vw - 32px); overflow: auto; }
.menu button[role="menuitem"]:disabled { color: var(--muted); cursor: default; }
.menu button[role="menuitem"]:disabled:hover { background: transparent; }
.menu.above { top: auto; bottom: 100%; margin: 0 0 4px; }
.menu.end { left: auto; right: 0; }

/* Select list: replaces a native select. Circle and name when closed, circle, name and tick in the list. */
.select-wrap { display: inline-block; max-width: 100%; }
.field .select-wrap { display: block; }
.select-trigger {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  max-width: 100%;
  min-height: 44px;
  padding: 8px 12px;
  background: var(--bg);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  text-align: start;
}
.field .select-trigger { width: 100%; }
.select-name { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.select-caret { flex: none; color: var(--muted); }
.select-list { min-width: 200px; max-height: 280px; }
.select-row {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
}
.select-row:hover, .select-row:focus { background: var(--surface2); }
.select-row:focus { outline: 3px solid var(--focus); outline-offset: -3px; }
.select-row[aria-selected="true"] { font-weight: 700; }
.select-tick { flex: none; width: 1.2em; text-align: center; }
.select-trigger .dot, .select-row .dot { width: 18px; height: 18px; }
/* A row with a remove x (saved custom lengths), and rows that run an action */
.select-item { display: flex; align-items: stretch; }
.select-item .select-row { flex: 1 1 auto; min-width: 0; }
.select-item.has-divider { border-bottom: 1px solid var(--border); margin-bottom: 4px; padding-bottom: 4px; }
.select-row.is-action { font-weight: 600; }
.select-x {
  flex: none;
  min-width: 44px;
  min-height: 44px;
  padding: 0;
  background: transparent;
  color: var(--text);
  border-color: transparent;
  border-radius: 8px;
  font-size: 1.3rem;
  line-height: 1;
}
.select-x:hover { background: var(--surface2); }
.select-x:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }

/* Block dialog: the custom length box and the start time box */
.len-custom { margin-top: 8px; padding: 12px; background: var(--surface2); border: 2px solid var(--border); border-radius: var(--radius); }
.len-custom[hidden] { display: none; }
.len-custom .field { margin: 0 0 8px; }
.len-custom .hint { margin: 4px 0 8px; }
.len-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.time-box { display: flex; align-items: stretch; gap: 8px; }
.time-box .time-input { flex: 1 1 auto; min-width: 0; text-align: center; font-variant-numeric: tabular-nums; }
.time-step { flex: none; min-width: 44px; min-height: 44px; padding: 0; font-size: 1.4rem; line-height: 1; }
.time-note[hidden] { display: none; }
.color-select .select-trigger { max-width: 170px; }
.dot-none { background: transparent; }
.dot-rainbow { background: conic-gradient(hsl(0 90% 70%), hsl(60 90% 70%), hsl(120 90% 70%), hsl(180 90% 70%), hsl(240 90% 70%), hsl(300 90% 70%), hsl(0 90% 70%)); }

/* Color picker popover */
.picker { width: min(280px, calc(100vw - 32px)); padding: 12px; }
.cp-square, .cp-hue {
  position: relative;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  touch-action: none;
  cursor: pointer;
}
.cp-square { height: 180px; }
.cp-hue-wrap { margin: 12px 0; }
.cp-hue {
  height: 44px;
  background: linear-gradient(to right, hsl(0 100% 50%), hsl(60 100% 50%), hsl(120 100% 50%), hsl(180 100% 50%), hsl(240 100% 50%), hsl(300 100% 50%), hsl(0 100% 50%));
}
.cp-square:focus, .cp-hue:focus { outline: 3px solid var(--focus); outline-offset: 2px; }
/* The thumb has a light and a dark ring so it shows on any color. */
.cp-thumb {
  position: absolute;
  width: 24px;
  height: 24px;
  margin: -12px 0 0 -12px;
  border: 3px solid #fff;
  border-radius: 50%;
  box-shadow: 0 0 0 2px #000;
  pointer-events: none;
}
.cp-hue .cp-thumb { top: 50%; }
.cp-row { display: flex; align-items: center; gap: 12px; }
.cp-preview.dot { width: 44px; height: 44px; }
.cp-hex {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 44px;
  padding: 8px 12px;
  background: var(--bg);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  font-family: ui-monospace, Consolas, monospace;
}
.cp-actions { display: grid; gap: 8px; margin-top: 12px; }
.cp-actions button { width: 100%; }

/* Board */
.board-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 0 0 16px; }

.label-row input[type="text"], .add-row input[type="text"], .add-row input[type="date"], .step-row input[type="text"] {
  min-height: 44px;
  padding: 8px 12px;
  background: var(--bg);
  border: 2px solid var(--border);
  border-radius: var(--radius);
}

.pill {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  padding: 4px 16px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 999px;
  font-weight: 600;
}

.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }

.col, .shelf {
  min-width: 0;
  padding: 12px;
  background: var(--surface2);
  border-radius: var(--radius);
}

.col h2, .shelf h2 { margin: 0 0 8px; font-family: var(--font-head); font-size: 1.15rem; color: var(--head); }
.shelf { margin-top: 16px; }
.shelf h2 { margin: 0; }
.shelf-toggle { width: 100%; text-align: left; border-color: transparent; background: transparent; font: inherit; font-weight: 700; color: var(--head); }

.count {
  display: inline-block;
  min-width: 1.6em;
  padding: 0 8px;
  margin-left: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 0.9rem;
  text-align: center;
}

.cards { list-style: none; margin: 0 0 8px; padding: 0; display: grid; gap: 8px; }
.shelf .cards { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }

.card {
  position: relative;
  min-width: 0;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.card.is-done .card-title { color: var(--muted); }

/* Focus on a card: a clear ring inside the card edge (never clipped), and no text caret ever. */
.card, .card button { caret-color: transparent; }
.card-open:focus-visible, .move-btn:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }

.card-open {
  display: block;
  width: 100%;
  min-height: 44px;
  padding: 8px 52px 8px 12px;
  border-color: transparent;
  background: transparent;
  text-align: start;
}

/* The Move button: a small icon at the top right, 44px to tap, no row of its own. */
.card-move { position: absolute; top: 0; right: 0; }
.move-btn { padding: 0; border-color: transparent; background: transparent; font-size: 1.4rem; font-weight: 700; line-height: 1; }

.card-title {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  line-clamp: 3;
  overflow: hidden;
  overflow-wrap: anywhere;
  font-weight: 600;
}

.card-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 0 12px 10px; color: var(--muted); font-size: 0.9rem; }
.card-meta .due { color: var(--past); }
.chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 1px 10px 1px 8px; color: var(--text); border: 1px solid var(--border); border-radius: 999px; overflow-wrap: anywhere; }
.dot { display: inline-block; flex: none; width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--border); }
.card-meta .dot { width: 12px; height: 12px; }

/* Dragging */
body.is-dragging, body.is-dragging * { cursor: grabbing !important; -webkit-user-select: none; user-select: none; }
.drag-source { opacity: 0.4; outline: 2px dashed var(--border); outline-offset: -2px; }
.drag-ghost { position: fixed; left: 0; top: 0; z-index: 90; margin: 0; list-style: none; pointer-events: none; opacity: 0.96; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.28); }
.drop-placeholder { list-style: none; min-height: 44px; border: 2px dashed var(--focus); border-radius: var(--radius); }
.col.drop-over, .shelf.drop-over { box-shadow: inset 0 0 0 2px var(--focus); }

.col-empty { margin: 4px 0 12px; padding: 12px; color: var(--muted); text-align: center; border: 1px dashed var(--border); border-radius: var(--radius); }
.col-toggle { width: 100%; margin-bottom: 8px; }

.add-box { margin-top: 8px; }
.add-row { display: flex; gap: 8px; }
.add-row input { flex: 1 1 auto; min-width: 0; }

/* Card dialog */
.dialog textarea { font: inherit; resize: vertical; }
.step-list { display: grid; gap: 8px; margin-bottom: 8px; }
.step-row { display: flex; align-items: center; gap: 8px; }
.step-row input[type="text"] { flex: 1 1 auto; min-width: 0; }
.step-check { display: flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; cursor: pointer; }
.step-check input { width: 24px; height: 24px; accent-color: var(--accent); }

/* Label editor */
.label-list { display: grid; gap: 8px; margin-bottom: 8px; }
.label-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.label-row input[type="text"] { flex: 1 1 90px; min-width: 0; }
.label-row button { padding-inline: 10px; }
.undo-bar { display: flex; align-items: center; gap: 12px; margin: 8px 0; padding: 4px 4px 4px 12px; background: var(--surface2); border-radius: var(--radius); }
.undo-bar[hidden] { display: none; }
.undo-bar span { flex: 1 1 auto; overflow-wrap: anywhere; }

/* Today */
.today { display: grid; gap: 20px; }
.today-head h2 { margin: 0; font-family: var(--font-head); font-size: 1.6rem; color: var(--head); }
.today-head .hint { margin: 4px 0 0; }
.slots { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.slot { display: flex; flex-direction: column; gap: 8px; min-height: 180px; padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.slot.empty { justify-content: center; align-items: center; text-align: center; background: transparent; border-style: dashed; color: var(--muted); }
.slot.empty p { margin: 0; }
.slot.empty:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.slot-num { font-family: var(--font-head); font-size: 1.2rem; font-weight: 700; color: var(--head); }
.slot-title { display: block; width: 100%; min-height: 44px; padding: 4px 0; border-color: transparent; background: transparent; text-align: start; font-size: 1.15rem; }
.slot .card-meta { padding: 0; }
.slot-actions { display: grid; gap: 8px; margin-top: auto; }
button.big { min-height: 56px; font-size: 1.2rem; }

.done-strip { padding: 8px 16px; background: var(--surface2); border-radius: var(--radius); }
.done-strip h3 { margin: 0 0 4px; font-size: 1rem; color: var(--head); }
.done-strip ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); }

.today-block { padding: 12px; background: var(--surface2); border-radius: var(--radius); }
.today-block h3 { margin: 0 0 8px; font-family: var(--font-head); font-size: 1.15rem; color: var(--head); }
.pick-list { list-style: none; margin: 0 0 8px; padding: 0; display: grid; gap: 8px; }
.pick-row { display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.pick-main { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
.pick-title { overflow-wrap: anywhere; font-weight: 600; }
.pick-col { color: var(--muted); font-size: 0.9rem; }
.brain textarea { display: block; width: 100%; margin-bottom: 8px; padding: 8px 12px; background: var(--bg); border: 2px solid var(--border); border-radius: var(--radius); font: inherit; resize: vertical; }

/* Focus screen */
.dialog.focus-screen { max-width: 520px; text-align: center; }
.focus-body { position: relative; display: grid; gap: 12px; justify-items: center; }
.focus-task { margin: 0; font-family: var(--font-head); font-size: 1.3rem; color: var(--head); overflow-wrap: anywhere; }
.focus-ask { margin: 0; font-weight: 600; }
.ring-wrap { position: relative; width: 220px; height: 220px; }
.ring { width: 100%; height: 100%; }
.ring-track { stroke: var(--surface2); stroke-width: 10; }
.ring-arc { stroke: var(--head); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 500ms linear; }
.clock { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 2.4rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.presets, .focus-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.custom-row { justify-content: center; align-items: center; }
.custom-label { display: flex; align-items: center; gap: 8px; }
.custom-label input { width: 90px; min-height: 44px; padding: 8px 12px; background: var(--bg); border: 2px solid var(--border); border-radius: var(--radius); }
.next-step { margin: 0; padding: 8px 12px; background: var(--surface2); border-radius: var(--radius); display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; max-width: 100%; }
.next-step p { margin: 0; overflow-wrap: anywhere; }
.focus-end { margin: 0; font-size: 1.3rem; font-weight: 700; }
.win { margin: 8px 0; font-family: var(--font-head); font-size: 1.6rem; color: var(--head); }
.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.confetti-bit { position: absolute; top: -14px; width: 8px; height: 14px; border-radius: 2px; opacity: 0.85; animation: confetti-fall 2s ease-in forwards; }
@keyframes confetti-fall { to { transform: translateY(440px) rotate(300deg); opacity: 0; } }

/* Week */
/* Only the Week view uses a wider page. The header, banners and tabs keep the normal width. */
.shell.is-wide { max-width: 1500px; }
.is-wide .topbar, .is-wide #banners, .is-wide .tabs { width: 100%; max-width: 948px; margin-left: auto; margin-right: auto; }
.week { display: grid; gap: 12px; }
.wk-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.wk-range { margin: 0 auto 0 0; font-family: var(--font-head); font-size: 1.4rem; color: var(--head); }
.wk-weeknav { display: flex; flex-wrap: wrap; gap: 8px; }
.wk-daynav, .wk-daystrip, .rail-toggle, .wk-daylabel, .nav-short { display: none; }

.wk-layout { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 12px; align-items: stretch; }

.wk-rail { display: flex; flex-direction: column; min-width: 0; min-height: 0; max-height: var(--wk-h); padding: 8px; background: var(--surface2); border-radius: var(--radius); }
.wk-rail h3 { margin: 0 0 8px; font-family: var(--font-head); font-size: 1.1rem; color: var(--head); }
.rail-list { flex: 1 1 auto; min-height: 0; list-style: none; margin: 0; padding: 0; display: grid; align-content: start; gap: 8px; overflow: auto; }
.rail-card { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.rail-open { display: block; width: 100%; min-height: 44px; padding: 6px 8px; font-size: 0.9rem; border-color: transparent; background: transparent; text-align: start; }
.rail-open:focus-visible, .wk-open:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
.rail-schedule { display: block; width: calc(100% - 12px); margin: 0 6px 6px; padding: 6px 4px; }

.wk-scroll { position: relative; max-height: var(--wk-h); overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.wk-head, .wk-body { display: grid; grid-template-columns: 44px repeat(7, minmax(0, 1fr)); }
.wk-head { position: sticky; top: 0; z-index: 4; background: var(--surface2); border-bottom: 1px solid var(--border); }
.wk-dayhead { padding: 8px 4px; text-align: center; font-weight: 600; color: var(--text); border-left: 1px solid var(--border); }
.wk-dayhead.is-today { color: var(--head); font-weight: 800; box-shadow: inset 0 -4px 0 var(--head); }
.wk-gutter { position: relative; }
.wk-gutter span { position: absolute; right: 6px; font-size: 0.8rem; color: var(--muted); transform: translateY(-0.55em); }
.wk-gutter span:first-child { transform: none; }

.wk-day { position: relative; isolation: isolate; touch-action: pan-y; border-left: 1px solid var(--border); background-color: var(--surface); background-image: linear-gradient(var(--surface2) 0 1px, transparent 1px); background-size: 100% var(--wk-row, 45px); }
.wk-day.is-past { background-color: var(--surface2); background-image: linear-gradient(var(--bg) 0 1px, transparent 1px); }
.wk-day.is-today { box-shadow: inset 0 0 0 2px var(--head); }

.wk-block { position: absolute; min-height: var(--wk-min, 44px); overflow: hidden; background: var(--surface2); color: var(--text); border: 2px solid var(--border); border-radius: 8px; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; z-index: var(--lane-z, 1); }
.wk-block:hover, .wk-block:focus-within { z-index: 20; }
.wk-day.is-past .wk-block { background: var(--surface); }
.wk-block.drag-ghost { position: fixed; z-index: 90; min-height: 0; } /* its height is copied from the block */
/* A button centers its content, so the block lays its own lines out from the top and clips what is left.
   Core.blockLayout only asks for lines that fit, so a line is hidden, never cut. */
.wk-open { display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; width: 100%; height: 100%; min-height: 0; min-width: 0; padding: 4px 6px 8px; border-color: transparent; background: transparent; color: var(--text); text-align: start; font-size: 0.85rem; line-height: var(--wk-lh); overflow: hidden; }
.wk-line { display: flex; align-items: flex-start; gap: 4px; min-width: 0; }
.wk-line .dot { flex: none; width: 10px; height: 10px; margin-top: 0.3em; }
/* week.js shortens the title to fit (whole characters, then "..."). Words never break unless one word is wider than a whole line. */
.wk-title { display: block; flex: 1 1 auto; min-width: 0; max-height: calc(var(--lines, 1) * var(--wk-lh) * 1em); overflow: hidden; overflow-wrap: break-word; font-weight: 600; color: var(--text); }
.wk-title[data-lines="1"], .wk-block.is-narrow .wk-title { white-space: nowrap; text-overflow: ellipsis; }
/* A block drawn taller than its time shows its real length as a thin strip from the top. The 2px is the
   block's top border, so the strip ends where the time ends on the grid. */
.wk-strip { position: absolute; top: 0; left: 0; z-index: 0; width: 4px; height: calc(var(--real) - 2px); background: var(--muted); border-radius: 0 0 2px 0; pointer-events: none; }
.has-strip .wk-open { padding-left: 9px; }
/* Small row size draws blocks 30px tall: less top space so one title line fits, also at Large text. */
.wk-block.is-compact .wk-open { border-width: 0; padding-top: 1px; padding-bottom: 0; }
.wk-sub { display: block; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--text); }
/* 24px grab strip (12px at Small), on top of the title button. The block floor is only for drawing, never a resize limit. */
.wk-resize { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; height: var(--wk-grab, 24px); cursor: ns-resize; }
.wk-resize::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 24px; height: 3px; margin-left: -12px; border-radius: 2px; background: var(--muted); }
.wk-drop { position: absolute; left: 2px; right: 2px; z-index: 30; padding: 2px 6px; border: 2px dashed var(--focus); border-radius: 8px; font-size: 0.8rem; color: var(--text); pointer-events: none; }
.wk-now { position: absolute; left: 0; right: 0; z-index: 30; height: 0; border-top: 2px solid var(--head); pointer-events: none; }
.wk-now::before { content: ""; position: absolute; left: -5px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--head); }
.wk-now[hidden] { display: none; }

/* Under 340px seven chips would be under 40px each: round arrows and a day name instead. */
@media (max-width: 339px) {
  .week .wk-daystrip { display: none; }
  .week .wk-daynav .nav-arrow { flex: 0 0 44px; width: 44px; padding: 0; border-radius: 50%; }
  .week .nav-long { display: none; }
  .week .nav-short { display: inline; font-size: 1.6rem; line-height: 1; }
  .week .wk-daylabel { display: block; margin: 0; text-align: center; font-weight: 700; color: var(--head); }
}

@media (max-width: 760px) {
  .wk-layout { grid-template-columns: minmax(0, 1fr); }
  .wk-weeknav { display: none; }
  .wk-daynav { display: flex; flex-wrap: nowrap; gap: 8px; width: 100%; }
  .wk-daynav button { flex: 1 1 0; min-width: 0; padding-left: 4px; padding-right: 4px; white-space: nowrap; font-size: 0.9rem; }
  /* Seven equal chips, weekday above the date, no scrolling. Nothing touches them. */
  .wk-daystrip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin: 4px 0 8px; padding: 2px; }
  .wk-daystrip button { min-width: 0; padding: 4px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; }
  .chip-dow { font-size: 0.75rem; }
  .chip-date { font-size: 1rem; font-weight: 700; }
  .wk-daystrip .is-on { background: var(--surface2); border-color: var(--head); box-shadow: inset 0 0 0 2px var(--head); }
  .rail-toggle { display: block; width: 100%; }
  .wk-rail .rail-list, .wk-rail .col-empty { display: none; margin-top: 8px; }
  .wk-rail.is-open .rail-list, .wk-rail.is-open .col-empty { display: grid; }
  .wk-head, .wk-body { grid-template-columns: 44px minmax(0, 1fr); }
  .wk-dayhead:not(.is-selected), .wk-day:not(.is-selected) { display: none; }
  .board { grid-template-columns: minmax(0, 1fr); }
}

/* Month */
.month { display: grid; gap: 12px; }
.mo-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.mo-title-month { margin: 0 auto 0 0; font-family: var(--font-head); font-size: 1.4rem; color: var(--head); }
.mo-nav { display: flex; gap: 8px; }
.mo-layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 12px; align-items: start; }
.mo-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; padding: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.mo-dow { padding: 6px 0; text-align: center; font-size: 0.8rem; font-weight: 600; color: var(--text); }
/* A day is one button: number on top, dots below. min-width 0 so seven columns always fit, never a sideways scroll. */
.mo-day { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 2px; min-width: 0; min-height: 52px; padding: 4px 0; border-color: transparent; background: transparent; color: var(--text); line-height: 1.2; }
.mo-day:hover { background: var(--surface2); }
.mo-day:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
.mo-num { padding: 0 6px; border: 2px solid transparent; border-radius: 999px; font-weight: 600; }
.mo-day.is-past .mo-num { color: var(--past); }
.mo-day.is-out .mo-num, .mo-day.is-out .mo-more { color: var(--muted); font-weight: 400; }
.mo-day.is-today .mo-num { border-color: var(--head); font-weight: 800; color: var(--head); }
.mo-day.is-sel { background: var(--surface2); box-shadow: inset 0 0 0 2px var(--head); }
.mo-dots { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 3px; min-height: 10px; }
.mo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--head); }
.mo-more { font-size: 0.7rem; font-weight: 700; color: var(--text); }
.mo-day.is-out .mo-dot { opacity: 0.55; }

.mo-panel { min-width: 0; padding: 12px; background: var(--surface2); border-radius: var(--radius); display: grid; gap: 10px; }
.mo-panel-head { margin: 0; font-family: var(--font-head); font-size: 1.1rem; color: var(--head); scroll-margin: 12px; }
.mo-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.mo-add { flex: 1 1 100%; min-width: 0; }
/* A double tap on a day must not zoom the page. */
.mo-day { touch-action: manipulation; }
.mo-titlebtn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 4px 10px; border-color: transparent; background: transparent; font: inherit; color: var(--head); text-align: start; }
.mo-titlebtn:hover { background: var(--surface2); }
.mo-titlebtn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.mo-titlebtn[aria-expanded="true"] { background: var(--surface2); border-color: var(--head); }
.mo-caret { font-size: 0.8em; }
.mo-jump { display: grid; gap: 8px; padding: 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); }
.mo-yearrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.mo-year { width: 5.5em; min-height: 44px; padding: 6px 10px; text-align: center; font-size: 1.1rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.mo-months { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.mo-jm { min-width: 0; padding: 6px 4px; background: var(--surface); }
.mo-jm[aria-pressed="true"] { background: var(--surface2); border-color: var(--head); box-shadow: inset 0 0 0 2px var(--head); font-weight: 700; }
.mo-jm.is-today { border-radius: 999px; border: 2px solid var(--head); }
.mo-jm:focus-visible, .mo-year:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.mo-search { width: 100%; min-height: 44px; padding: 6px 10px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.mo-pick { margin-top: 8px; max-height: 50vh; overflow: auto; }
.mo-nothing { margin: 0; padding: 12px; text-align: center; color: var(--text); }
.mo-panel .empty { margin: 0; padding: 12px; max-width: none; }
.mo-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.mo-item { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; min-height: 44px; text-align: start; background: var(--surface); }
.mo-when { font-size: 0.8rem; color: var(--muted); }
.mo-title { display: flex; align-items: flex-start; gap: 6px; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.mo-title .dot { flex: none; width: 10px; height: 10px; margin-top: 0.4em; }
.mo-item.is-done .mo-title { color: var(--muted); font-weight: 400; }
.mo-status { font-size: 0.8rem; font-weight: 700; color: var(--text); }

@media (max-width: 760px) {
  .mo-layout { grid-template-columns: minmax(0, 1fr); }
}

/* Seven days of 44px do not fit in 288px, so the grid steps 10px into the page gutter at 320 wide and has no gaps. */
@media (max-width: 339px) {
  .mo-grid { margin: 0 -10px; gap: 0; padding: 0; }
  .month .mo-nav .nav-arrow { flex: 0 0 44px; width: 44px; padding: 0; border-radius: 50%; }
  .month .nav-long { display: none; }
  .month .nav-short { display: inline; font-size: 1.6rem; line-height: 1; }
  .mo-months { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

@media (max-width: 480px) {
  .topbar { gap: 8px; }
  .app-name { flex-basis: 100%; }
  /* Four equal tabs with small side padding, so all four labels fit at every text size. */
  .tabs { gap: 2px; padding: 3px; }
  .tabs button { min-width: 0; padding-left: 4px; padding-right: 4px; white-space: nowrap; }
}

/* Large text on a narrow phone: the four tabs do not fit in one row, so they go 2 by 2. */
@media (max-width: 379px) {
  [data-textsize="large"] .tabs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* ---------- Time Reality Check (Phase 6a) ---------- */
.undo-bar.is-wrap { flex-wrap: wrap; }
.undo-bar.is-wrap span { flex-basis: 100%; }
.time-fields .field { margin: 8px 0; }
.time-fields .field input[type="text"] { max-width: 10em; }
.plan-for { display: inline-flex; align-items: center; min-height: 44px; margin: 0 0 8px; }
.plan-for[hidden] { display: none; }
.time-card h3 { margin-bottom: 4px; }
.time-card .time-line { margin: 0 0 4px; font-size: 1.05rem; font-weight: 600; line-height: 1.3; color: var(--text); }
.time-card .hint { margin: 0 0 8px; line-height: 1.3; }
.time-card .tc-toggle { margin-bottom: 0; }
.tc-open { margin-top: 12px; }
.tc-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin: 0 0 8px; font-size: 0.9rem; color: var(--muted); }
.tc-key { display: inline-block; width: 18px; height: 10px; border: 1px solid var(--border); border-radius: 3px; }
.tc-key.real, .tc-bar.real { background: var(--accent); }
.tc-key.guess, .tc-bar.guess { background: transparent; }
.tc-chart { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.tc-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: baseline; }
.tc-name { overflow-wrap: anywhere; color: var(--text); }
.tc-nums { font-size: 0.9rem; color: var(--muted); white-space: nowrap; }
.tc-bars { grid-column: 1 / -1; display: grid; gap: 2px; }
.tc-bar { display: block; width: var(--w); height: 8px; border: 1px solid var(--border); border-radius: 3px; }
@media (max-width: 420px) {
  .tc-row { grid-template-columns: minmax(0, 1fr); }
  .tc-nums { white-space: normal; }
}

/* ---------- Real time in the Week, waking hours (Phase 6b) ---------- */
.visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.wk-dayname { display: block; }
.wk-full { display: block; margin-top: 2px; font-size: 0.8rem; font-weight: 600; color: var(--muted); }
.wk-dayhead.is-today .wk-full { color: var(--muted); }
.awake-row { display: flex; flex-wrap: wrap; gap: 0 12px; }
.awake-row .field { flex: 1 1 7em; margin: 4px 0; }
.awake-row .field input[type="text"] { max-width: 8em; text-align: center; font-variant-numeric: tabular-nums; }

/* ---------- Energy Battery (Phase 7a) ---------- */
.battery .hint { margin: 0 0 8px; }
.battery-btns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.bt { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; min-height: 52px; padding: 4px; background: var(--surface); line-height: 1.2; }
.bt[aria-pressed="true"] { border-color: var(--head); box-shadow: inset 0 0 0 2px var(--head); font-weight: 700; }
.bt-pts { font-size: 0.85rem; font-weight: 400; color: var(--muted); }
/* Large text on a narrow phone: "Energized" does not fit a third of the row, so the buttons stack as rows. */
@media (max-width: 379px) {
  [data-textsize="large"] .battery-btns { grid-template-columns: minmax(0, 1fr); }
  [data-textsize="large"] .bt { flex-direction: row; justify-content: space-between; gap: 12px; min-height: 44px; padding: 4px 12px; }
}
.meter-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 12px; }
.meter { flex: 1 1 10em; display: flex; gap: 3px; min-width: 0; }
.meter .seg { flex: 1 1 0; height: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 3px; }
.meter .seg.on { background: var(--accent); }
.meter-text { font-weight: 600; color: var(--text); white-space: nowrap; font-variant-numeric: tabular-nums; }
.battery .meter-row + .hint { margin: 8px 0 0; }
.size-word { color: var(--muted); font-size: 0.9rem; }

/* ---------- Note preview (Phase 8d) ---------- */
/* The box never takes the pointer or focus, so it cannot get in the way of a card or a drag. */
.note-tip {
  position: fixed;
  z-index: 95;
  box-sizing: border-box;
  max-width: min(22em, calc(100vw - 16px));
  max-height: calc(100vh - 16px);
  overflow: hidden;
  padding: 8px 12px;
  background: var(--surface);
  color: var(--text);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.22);
  font-size: 0.9rem;
  line-height: 1.4;
  overflow-wrap: anywhere;
  pointer-events: none;
}
/* The small note icon: 44px to tap, drawn with CSS so it follows the theme colors. It hangs into the
   padding of the row so a card with a note is not taller. */
.note-btn { position: relative; display: inline-flex; align-items: center; justify-content: center; flex: none; margin-block: -10px; padding: 0; border-color: transparent; background: transparent; color: var(--muted); }
.card-meta .note-btn { margin-inline-start: auto; }
.note-ico { display: block; box-sizing: border-box; width: 14px; height: 18px; border: 2px solid currentColor; border-radius: 3px; background: linear-gradient(currentColor, currentColor) 2px 3px / 6px 2px no-repeat, linear-gradient(currentColor, currentColor) 2px 7px / 6px 2px no-repeat; }
.note-btn[aria-expanded="true"] { background: var(--surface2); border-color: var(--head); color: var(--text); }
.done-strip li { display: flex; align-items: center; gap: 4px; }
.mo-row.has-note { display: flex; align-items: stretch; gap: 4px; }
.mo-row.has-note .mo-item { flex: 1 1 auto; min-width: 0; width: auto; }
.mo-row .note-btn { margin: 0; }
.today-tools { margin-top: 8px; }

/* ---------- Print Today (Phase 8d) ---------- */
.print-sheet { display: none; }
@media print {
  /* Black on white in every theme, so Midnight never prints pale text on paper. */
  :root, :root[data-theme] {
    --bg: #fff; --surface: #fff; --surface2: #fff; --text: #000; --muted: #333; --past: #333;
    --head: #000; --accent: #000; --accent-text: #fff; --border: #555; --focus: #000;
  }
  body { background: #fff !important; color: #000 !important; }
  /* Any page: leave out what makes no sense on paper. */
  .toast-wrap, .skip-link, .overlay, .tabs, #banners, .reminder-bar, .recovery-wrap, .topbar button { display: none !important; }
  /* Only while a sheet exists (Today: the Print today button or Ctrl+P): the sheet alone prints.
     Without a sheet the normal page prints, never a blank one. */
  body.printing-today > *:not(#print-sheet) { display: none !important; }
  html { font-size: 12pt !important; }
  .print-sheet { display: block; max-width: 40em; margin: 0 auto; padding: 0; font-family: var(--font-body); color: #000; background: #fff; }
  .print-app { margin: 0 0 4px; font-size: 0.85rem; letter-spacing: 0.04em; color: #000; }
  .print-title { margin: 0 0 8px; font-family: var(--font-head); font-size: 1.6rem; }
  .print-battery { margin: 0 0 12px; }
  .print-list, .print-steps, .print-done { list-style: none; margin: 0; padding: 0; }
  .print-item { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid #000; break-inside: avoid; page-break-inside: avoid; }
  .print-box { flex: none; display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; width: 22px; height: 22px; margin-top: 2px; border: 2px solid #000; border-radius: 3px; font-weight: 700; line-height: 1; }
  .print-box.small { width: 16px; height: 16px; margin-top: 3px; border-width: 1.5px; font-size: 0.8rem; }
  .print-body { flex: 1 1 auto; min-width: 0; }
  .print-task { margin: 0; font-size: 1.15rem; font-weight: 700; overflow-wrap: anywhere; }
  .print-meta { margin: 2px 0 0; font-size: 0.9rem; }
  .print-steps { margin-top: 6px; }
  .print-steps li { display: flex; gap: 8px; align-items: flex-start; padding: 2px 0; overflow-wrap: anywhere; }
  .print-sub { margin: 16px 0 6px; font-family: var(--font-head); font-size: 1.1rem; }
  .print-done li { padding: 2px 0; overflow-wrap: anywhere; }
  .print-empty { margin: 16px 0; font-size: 1.1rem; }
}
/* Board card: the note icon sits left of the Move button (both 44px), so the card stays the same height. */
.card .note-btn { position: absolute; top: 0; right: 44px; margin: 0; }
.card.has-note .card-open { padding-right: 96px; }

/* First run (Phase 8c): the welcome screen and the tour sheet. Tokens only, so every theme works. */
.firstrun { max-width: 34rem; margin: 0 auto; padding: 32px 16px 48px; }
.firstrun h1 { margin: 0 0 8px; font-family: var(--font-head); color: var(--head); font-size: 2rem; overflow-wrap: anywhere; }
.firstrun h1:focus { outline: none; }
.fr-line { margin: 0 0 24px; color: var(--muted); font-size: 1.1rem; }
.fr-choice { margin: 0 0 20px; }
.fr-choice button { display: block; width: 100%; min-height: 56px; font-size: 1.15rem; }
.fr-choice .hint { margin: 6px 2px 0; }
.fr-more { margin: 0; }
.fr-link { background: none; border: 0; padding: 8px 4px; color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
.fr-link:hover { background: none; }
.fr-foot { margin: 32px 0 0; color: var(--muted); }

.overlay.tour-wrap { align-items: flex-end; padding: 0 8px 8px; background: transparent; }
.dialog.tour { max-width: 34rem; max-height: 60vh; box-shadow: 0 2px 18px rgba(0, 0, 0, 0.3); }
.dialog.tour h2 { font-size: 1.1rem; margin-bottom: 6px; }
.tour-text { margin: 0 0 12px; }
.tour-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.tour-actions .tour-skip { margin-left: auto; }

/* Demo build only (Phase 11). Tokens only, so all 5 themes work. */

/* In the page flow above the app: it scrolls away and never sits over a button. */
.demo-banner {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 4px 12px;
  padding: 6px 16px;

}

.demo-banner p { margin: 0; flex: 0 1 auto; }

.demo-buy {

button.demo-off {

  color: var(--muted);
  cursor: default;
}

  function updateTask(state, id, patch, now) {

  // The "n" shortcut. ev is a plain description of the key press, built by the page:

  // ---------- Moving cards (Phase 3b) ----------

      emptyText: open.length || sum.done.length ? "" : PRINT_EMPTY

  }

  // Would adding this card go over a limit? Each limit (3 tasks, the battery) has one kind override
  // per day, worked out from the numbers: a limit already over has used it.
  // status: "ok", "ask" (over, every limit that is over may still be overridden), "full" (an override is
  // used up), "duplicate", "done", "missing".
  function checkTodayAdd(state, date, taskId) {
    var i = findIndexById(state.tasks, taskId);
    var open = focusSummary(state, date).open.length;
    var bat = batteryOf(state, date);
    var used = batteryUsed(state, date);
    var cost = i >= 0 && COSTS.indexOf(state.tasks[i].cost) >= 0 ? state.tasks[i].cost : DEFAULT_COST;
    var res = {
      status: "ok",
      tasks: { open: open, over: open >= 3, overUsed: open >= LIMITS.focus },
      battery: {
        set: bat.set, value: bat.value, used: used, cost: cost, after: used + cost,
        over: bat.set && used + cost > bat.value,
        overUsed: bat.set && used > bat.value

    };
    var day = state.days[date];
    if (i < 0 || !isValidISODate(date) || isArchived(state.tasks[i])) res.status = "missing";
    else if (state.tasks[i].status === "done") res.status = "done";
    else if (day && day.focusIds.indexOf(taskId) >= 0) res.status = "duplicate";
    else if ((res.tasks.over && res.tasks.overUsed) || (res.battery.over && res.battery.overUsed)) res.status = "full";
    else if (res.tasks.over || res.battery.over) res.status = "ask";
    return res;
  }

  // The one way a card is added to a day: both limits, one override tap (opts.override) covers both.
  // Returns { state, status, open, check }. status: "added", "override", or the check status.
  function addToday(state, date, taskId, opts) {
    var check = checkTodayAdd(state, date, taskId);
    var open = check.tasks.open;
    function out(status, next) { return { state: next || state, status: status, open: open, check: check }; }
    if (check.status === "ask" && !(opts && opts.override)) return out("ask");
    if (check.status !== "ok" && check.status !== "ask") return out(check.status);
    var r = addFocus(state, date, taskId, { override: check.tasks.over });

  // tinyFirst says whether that happened, so the view can say so.
  function smartPickList(state, date) {
    var list = pickList(state, date);
    var bat = batteryOf(state, date);
    if (!bat.set || bat.value !== BATTERIES[0]) return { list: list, tinyFirst: false };
    var tiny = list.filter(function (t) { return t.cost === 1; });

    return { list: tiny.concat(list.filter(function (t) { return t.cost !== 1; })), tinyFirst: true };

  // ---------- Soft Reset (Phase 7b) ----------
  // A new day kindly asks about cards picked on earlier days and not finished. Nothing changes by itself:
  // focusIds are per day, so those cards already left Today, and their column stays as it was.
  // settings.lastResetDay is the day the check last ran. That day is looked at again next time, because
  // cards are picked on it after the check ran.

  var RESET_LOOKBACK = 14; // no lastResetDay yet (old data, first open)
  var RESET_CAP = 60;

  function resetNotes(task, today) {
    var notes = [];
    var s = task.scheduled;

    if (task.due === today) notes.push("Due today");

  }

  // { due, items: [{ task, from, notes }], fromEarlier, hasDoing }. due is false once today was checked.
  // Days looked at: lastResetDay to yesterday (at most 60). A clock that went back gives due with no items.
  // Each open card (To Do or Doing) is listed once, under its newest day, newest day first.
  // skipIds: cards to leave out (the one with a running Focus timer).
  function softResetPlan(state, today, skipIds) {
    var plan = { due: false, items: [], fromEarlier: false, hasDoing: false };
    var last = state.settings.lastResetDay;

    (todayDay ? todayDay.focusIds : []).forEach(function (id) { skip[id] = true; });

      var day = state.days[date];
      (day ? day.focusIds : []).forEach(function (id) {
        var i = findIndexById(state.tasks, id);
        if (skip[id] || i < 0) return;
        var t = state.tasks[i];
        if ((t.status !== "todo" && t.status !== "doing") || isArchived(t)) return;

        if (t.status === "doing") plan.hasDoing = true;

  }

  function freshDayOn(state) {
    return !state || !state.settings || state.settings.freshDay !== false;
  }

  }

  // choice "today": in list order, each card that fits both limits without an override (a later, smaller
  // one may still fit). Returns { state, undo, changed: [ids], waiting } where waiting is how many stayed put.
  function applySoftReset(state, ids, choice, today, now) {
    var next = state;
    var changed = [];
    (ids || []).forEach(function (id) {
      var r = choice === "later" ? moveTask(next, id, "later", null, now)

    if (changed.length && choice === "later") undo = { kind: "later", snapshot: moveSnapshot(state, next) };
    if (changed.length && choice === "today") undo = { kind: "today", date: today, ids: changed };

  }

    if (undo.kind !== "today") return state;
    var next = state;
    undo.ids.forEach(function (id) { next = removeFocus(next, undo.date, id); });
    return next;
  }

  function freshDayText(count, fromEarlier) {
    return count + (count === 1 ? " card from " : " cards from ") + (fromEarlier ? "earlier" : "yesterday") +
      (count === 1 ? " is" : " are") + " waiting, no guilt.";
  }

  // "and 3 more" when the list is longer than the titles shown, else "".
  function freshMoreText(count) {
    return count > FRESH_SHOWN ? "and " + (count - FRESH_SHOWN) + " more" : "";
  }

  function freshKeepLabel(hasDoing) {
    return hasDoing ? "Keep on my board" : "Keep in To Do";
  }

  // "1 card", "2 cards".
  function cardsText(n) {
    return n + (n === 1 ? " card" : " cards");
  }

  function bringTodayText(added, waiting) {
    var rest = cardsText(waiting) + (waiting === 1 ? " stays" : " stay") + " on your board.";
    if (!added) return "Today is full right now. " + rest;
    return "Added " + cardsText(added) + " to Today." + (waiting ? " " + rest : "");
  }

  function laterMovedText(n) {
    return "Moved " + cardsText(n) + " to Later.";
  }

  // ---------- Later shelf cleanup (Phase 7c) ----------
  // A calm helper, opened only by a button. It lists Later cards that rested there over 30 days and offers

  // ever deleted, nothing happens by itself.

  // A card the cleanup may offer: on Later, not archived, no Week block, no due date, not in today's list.

    var day = state.days[today];

  function laterCleanupList(state, today) {
    if (!isValidISODate(today)) return [];
    var out = [];
    state.tasks.forEach(function (t) {
      if (!tidyable(state, t, today) || !isValidStamp(t.laterAt)) return;
      var since = dateOfStamp(t.laterAt);

  // Returns { state, undo, changed: [ids] }.
  function bringBackTasks(state, ids, now) {

    var before = [];
    var after = [];

  // Undo for archiveTasks and bringBackTasks. A card is put back only when it is still there and still

      var t = i >= 0 ? next.tasks[i] : null;

  // "On Later since 12 Sep" and "Archived 23 Oct", in local dates.

  }

  function archivedOnText(stamp) {
    return isValidStamp(stamp) ? "Archived " + formatShortDate(dateOfStamp(stamp)) : "Archived";
  }

  function archivedText(n) {
    return cardsText(n) + " archived.";
  }

  function broughtBackText(n) {
    return n === 1 ? "Back on the Later shelf." : cardsText(n) + " are back on the Later shelf.";
  }

  // ---------- Today view (Phase 4) ----------

  var WEEKDAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  var MONTH_LONG = ["January", "February", "March", "April", "May", "June", "July", "August",
    "September", "October", "November", "December"];
  var BRAIN_MAX = 30;
  var TIMER_MAX = 180;
  var WIN_MESSAGES = [
    "Nice work. That one is done.",
    "You did it. Take a breath.",
    "One more thing off your mind.",
    "Well done. Small steps add up.",
    "Done. You showed up, and it shows.",
    "That counts. Be proud of it."
  ];

  // "Sunday, 18 October". Read from the text and a local date, never from UTC.

    if (!isValidISODate(iso)) return "";

    return WEEKDAY_NAMES[parseISODate(iso).getDay()] + ", " + (+m[3]) + " " + MONTH_LONG[+m[2] - 1];
  }

  // The kind line after finishing a card. n is how many cards are done, so it rotates by itself
  // and needs no stored counter.
  function winMessage(n) {
    var i = isFiniteNum(n) ? Math.floor(n) : 0;
    return WIN_MESSAGES[((i % WIN_MESSAGES.length) + WIN_MESSAGES.length) % WIN_MESSAGES.length];
  }

  function doneCount(state) {
    return state.tasks.filter(function (t) { return t.status === "done"; }).length;
  }

  // Brain Dump: one card per line. Blank lines are skipped, a leading dash or bullet is dropped,
  // long lines are cut like any title. Returns { lines, skipped, rest } where rest is what was over the cap.
  function parseBrainDump(text) {
    var all = String(text === undefined || text === null ? "" : text).split(/\r\n|\r|\n/)

      .filter(function (l) { return l; })

  function brainDumpUndoText(original, leftover, current) {
    var orig = String(original === undefined || original === null ? "" : original);

  }

  // ---------- Week time blocks (Phase 5a) ----------

  function parseTypedTime(text) {
    if (typeof text !== "string") return null;
    var t = text.trim();
    var m = /^(\d{1,2}):(\d{2})$/.exec(t) || /^(\d{1,2})(\d{2})$/.exec(t) || /^(\d{1,2})()$/.exec(t);

  }

  // 14:15), kept between lo and hi when those are given.
  function stepTime(mins, dir, step, lo, hi) {

  function checkStartTime(start, len, rs, re) {
    var latest = re - len;
    if (!isFiniteNum(start)) return { ok: false, code: "format", message: "Type a time like 14:25.", latestStart: latest };
    if (start < rs) {
      return { ok: false, code: "early", message: "The week starts at " + minsToTime(rs) + ". Try " + minsToTime(rs) + " or later.", latestStart: latest };
    }
    if (start + len > re) {
      var msg = latest < rs
        ? "That length is longer than the hours shown. Try a shorter length."
        : "That would run past " + minsToTime(re) + ". The latest start for " + formatMins(len) + " is " + minsToTime(latest) + ".";
      return { ok: false, code: "late", message: msg, latestStart: latest };

    var b = days[days.length - 1];

    var ya = a.slice(0, 4);
    var yb = b.slice(0, 4);
    if (ya !== yb) return formatShortDate(a) + " " + ya + " to " + formatShortDate(b) + " " + yb;
    if (a.slice(0, 7) === b.slice(0, 7)) return (+a.slice(8)) + " to " + formatShortDate(b);
    return formatShortDate(a) + " to " + formatShortDate(b);
  }

  // ---------- Month calendar (read only) ----------

  var MAX_DOTS = 3;

  // The month a date is in, and a month n steps away (n can be negative, any size). month is 1 to 12.
  function monthOf(iso) {
    return { year: +iso.slice(0, 4), month: +iso.slice(5, 7) };
  }

  // The years the Month view can show. The dates themselves allow 1000 to 9999, but a month grid also
  // draws days of the month before and after, so the first and last year are left out: no grid ever
  // needs a date outside 1000-01-01 to 9999-12-31.
  var YEAR_MIN = 1001;
  var YEAR_MAX = 9998;

  // A whole year inside the range, or null for anything else.
  function clampYear(n) {
    if (!isWholeNumber(n)) return null;
    return Math.max(YEAR_MIN, Math.min(YEAR_MAX, n));
  }

  // Stops at January 1001 and December 9998, so the grid never gets an invalid date.
  function shiftMonth(year, month, n) {
    var idx = year * 12 + (month - 1) + n;
    var y = Math.floor(idx / 12);
    if (y < YEAR_MIN) return { year: YEAR_MIN, month: 1 };
    if (y > YEAR_MAX) return { year: YEAR_MAX, month: 12 };
    return { year: y, month: (((idx % 12) + 12) % 12) + 1 };
  }

  // The year box: digits only. Returns { ok, year, message }. message is a kind line when not ok.
  function parseYearInput(text) {
    var s = typeof text === "string" ? text.replace(/\s+/g, "") : "";
    if (!s) return { ok: false, year: null, message: "Type a year, like 2027." };
    if (!/^\d+$/.test(s)) return { ok: false, year: null, message: "Use digits only, like 2027." };
    var n = +s;
    if (n < YEAR_MIN || n > YEAR_MAX) {
      return { ok: false, year: clampYear(n), message: "Pick a year from " + YEAR_MIN + " to " + YEAR_MAX + "." };
    }
    return { ok: true, year: n, message: "" };
  }

  // Switching to another month keeps the day number. A shorter month gets its last day (31 Jan to Feb gives
  // 28 or 29). The current month selects today. The year is held to YEAR_MIN to YEAR_MAX. today is
  // optional (default: now). Bad input returns selDate.
  function jumpToMonth(selDate, year, month, today) {
    var y = clampYear(year);
    var m = isWholeNumber(month) && month >= 1 && month <= 12 ? month : null;
    if (y === null || m === null) return selDate;
    var now = isValidISODate(today) ? today : todayISO();
    if (+now.slice(0, 4) === y && +now.slice(5, 7) === m) return now;
    var day = isValidISODate(selDate) ? +selDate.slice(8) : 1;
    return y + "-" + pad(m) + "-" + pad(Math.min(day, daysInMonth(y, m)));
  }

  // Previous or next month from the selected day, by the same rule. Returns { date, moved }. At the first
  // and last month the view can show, moved is false and date is selDate.
  function monthStep(selDate, n, today) {
    if (!isValidISODate(selDate)) return { date: selDate, moved: false };
    var cur = monthOf(selDate);
    var m = shiftMonth(cur.year, cur.month, n);
    if (m.year === cur.year && m.month === cur.month) return { date: selDate, moved: false };
    return { date: jumpToMonth(selDate, m.year, m.month, today), moved: true };
  }

  // Cards that can be given a day from the Month view: not done, no due date, no block. Board order
  // (To Do, Doing, Later, each by its order). query narrows by title (case blind, trimmed).
  // Returns { items: first max cards, total }.
  function eligibleForDay(state, query, max) {
    var cols = boardColumns(state, "");
    var q = typeof query === "string" ? query.trim().toLowerCase() : "";
    var limit = isWholeNumber(max) && max > 0 ? max : 50;
    var all = cols.todo.concat(cols.doing, cols.later).filter(function (t) {
      if (t.due || t.scheduled) return false;
      return !q || String(t.title).toLowerCase().indexOf(q) >= 0;
    });
    return { items: all.slice(0, limit), total: all.length };
  }

  // Gives a card a due date and changes nothing else. Refuses a card that is gone, done, already due or
  // scheduled (a stale list must not overwrite). Returns { state, task, changed, undo }.
  function setDueOnly(state, id, date) {
    var none = { state: state, task: null, changed: false, undo: null };
    var i = findIndexById(state.tasks, id);
    if (i < 0 || !isValidISODate(date)) return none;
    var t = state.tasks[i];
    if (t.status === "done" || t.due || t.scheduled) return none;
    var r = updateTask(state, id, { due: date });
    return { state: r.state, task: r.task, changed: true, undo: { taskId: id, date: date } };
  }

  // The one-step Undo for setDueOnly: due goes back to none. Leaves the card alone if it is gone or its
  // due date changed since. Returns { state, ok, reason } (reason "deleted" or "changed").
  function applyDueUndo(state, undo) {
    var fail = function (reason) { return { state: state, ok: false, reason: reason }; };
    if (!isObj(undo) || !isValidId(undo.taskId)) return fail("deleted");
    var i = findIndexById(state.tasks, undo.taskId);
    if (i < 0) return fail("deleted");
    if (state.tasks[i].due !== undo.date) return fail("changed");
    return { state: updateTask(state, undo.taskId, { due: null }).state, ok: true, reason: null };
  }

  // "February 2028".
  function monthTitle(year, month) {
    return MONTH_LONG[month - 1] + " " + year;
  }

  // The day numbers in column order for a week start: Mon first gives Mon..Sun.
  function weekdayOrder(startDay) {
    var s = WEEK_STARTS.indexOf(startDay) < 0 ? 1 : startDay;
    var out = [];
    for (var i = 0; i < 7; i++) out.push((s + i) % 7);
    return out;
  }

  function shortMonthName(month) {
    return MONTH_NAMES[month - 1] || "";
  }

  function weekdayName(dayIndex) {
    return WEEKDAY_NAMES[dayIndex];
  }

  function shortWeekdayName(dayIndex) {
    return SHORT_WEEKDAYS[dayIndex];
  }

  // "14:25 to 15:45". The real start and length, never rounded. The end is clamped to 24:00.
  function blockSpanText(task) {
    var s = task && task.scheduled;
    var start = s ? timeToMins(s.start) : null;
    if (start === null || !isFiniteNum(s.mins)) return "";
    var end = Math.min(1440, start + s.mins);
    var endText = end >= 1440 ? "24:00" : minsToTime(end);
    return minsToTime(start) + " to " + endText;
  }

  // Cards for one day: due on it or a block on it, each card once. Blocks first by exact start,
  // then due only cards by board order. Does not change the state.
  function dayItems(state, date) {
    var blocks = [];
    var dues = [];
    state.tasks.forEach(function (t) {
      if (isArchived(t)) return;
      var sched = t.scheduled && t.scheduled.date === date ? timeToMins(t.scheduled.start) : null;
      if (sched !== null) blocks.push({ task: t, kind: "block", start: sched });
      else if (t.due === date) dues.push({ task: t, kind: "due", start: null });
    });
    blocks.sort(function (a, b) { return a.start - b.start || a.task.order - b.task.order; });
    dues.sort(function (a, b) { return a.task.order - b.task.order; });

  }

  // How many cards a date has, for every date at once (one pass over the cards).
  function monthCounts(state) {

    return counts;
  }

  // Dots for a count: up to 3, then "+N".

    var n = isFiniteNum(count) && count > 0 ? Math.floor(count) : 0;
    return { shown: Math.min(n, MAX_DOTS), more: Math.max(0, n - MAX_DOTS), count: n };
  }

  // "no cards", "1 card", "3 cards".
  function taskCountText(n) {
    return n === 0 ? "no cards" : n === 1 ? "1 card" : n + " cards";
  }

  // ---------- Time Reality Check (Phase 6) ----------
  // The app learns how long things really take. A record { taskId, estimate, actual, at } is written only by
  // Done on the Focus screen or by typing the real minutes in the card dialog (recordTime). Setting a card
  // to Done anywhere else (card dialog, Move menu, drag, Edit time block) never writes one.

  var TIME_POOL = 20; // newest records the multiplier looks at
  var TIME_MIN_GUESS = 5; // shorter guesses are too rough to learn from
  var TIME_SHOW_AT = 5; // nothing is shown before this many records
  var TIME_CHART = 10;
  var MULT_MIN = 0.5;
  var MULT_MAX = 4;

  // The records the multiplier learns from: a guess of 5 minutes or more, the newest 20 of those.
  function timePool(log) {
    var list = (Array.isArray(log) ? log : []).filter(function (e) {
      return isObj(e) && isFiniteNum(e.estimate) && e.estimate >= TIME_MIN_GUESS && isFiniteNum(e.actual) && e.actual > 0;
    });
    return list.slice(Math.max(0, list.length - TIME_POOL));
  }

  function median(nums) {
    var s = nums.slice().sort(byNumber);
    var mid = s.length >> 1;
    return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
  }

  // Returns { shown, value, count }. Nothing is shown before 5 records. value is the median of real / guess,
  // kept between 0.5 and 4 and rounded to one decimal once: every place uses that same number, so the
  // card text, Plan for and the Week always agree.
  function timeMultiplier(log) {
    var pool = timePool(log);
    if (pool.length < TIME_SHOW_AT) return { shown: false, value: 1, count: pool.length };
    var m = clamp(median(pool.map(function (e) { return e.actual / e.estimate; })), MULT_MIN, MULT_MAX);
    return { shown: true, value: Math.round(m * 10 + 1e-9) / 10, count: pool.length };
  }

  // The friendly line on the Today card. 4 reads "4", never "4.0".
  function multiplierText(value) {
    if (value === 1) return "Your guesses are usually about right.";
    return "Your cards usually take about " + String(value) + " times your guess.";
  }

  // "Plan for 40 min": the guess times the multiplier, up to the next 5 minutes, at most 1440. null when there
  // is nothing to suggest: no guess, or a multiplier of 1 or less (it never suggests less than the guess).
  function planForMins(guess, m) {
    if (!isWholeNumber(guess) || guess < 1 || guess > LIMITS.mins || !isFiniteNum(m) || m <= 1) return null;
    // Rounded first, so 25 x 1.6 (40.00000000000001 in floating point) is 40, not 45.
    var raw = Math.round(guess * m * 1000) / 1000;

    return plan > guess ? plan : null;
  }

  // The "Plan for" button pads the guess once. original is the guess typed before padding (null while the box
  // holds a typed guess). A press with original null pads and remembers it; a press on "Back to my guess" puts
  // the original back and never pads. Returns { guess, original } (the box text and what to remember), or null
  // when there is nothing to do (bad box, or no suggestion).
  function planPress(guessText, original, m) {
    if (isWholeNumber(original)) return { guess: String(original), original: null };
    var r = checkMinutesBox(guessText);
    var plan = r.ok ? planForMins(r.mins, m) : null;
    if (plan === null) return null;
    return { guess: String(plan), original: r.mins };
  }

  // The button's words: { text, aria } or null when it stays hidden. After a press (original set) it offers
  // the way back; otherwise it shows the padded number once the planner has learned (shown).
  function planButtonText(guessText, original, shown, m) {
    if (isWholeNumber(original)) {
      return { text: "Back to my guess (" + original + " min)", aria: "Back to your guess of " + original + " minutes" };
    }
    if (!shown) return null;
    var r = checkMinutesBox(guessText);
    var plan = r.ok ? planForMins(r.mins, m) : null;
    if (plan === null) return null;
    return { text: "Plan for " + plan + " min", aria: "Plan for " + plan + " minutes, put it in your guess" };
  }

  // The guess and "Time it took" boxes. Returns { ok: true, mins } (null for empty or 0, which is no value)
  // or { ok: false, message }.
  function checkMinutesBox(text) {
    var r = parseMinutesInput(text);
    if (!r.ok && r.code === "empty") return { ok: true, mins: null };
    if (!r.ok) {
      return { ok: false, message: r.code === "notWhole" ? "Whole minutes only, like 25." : "Type a number of minutes, like 25." };
    }
    if (r.mins === 0) return { ok: true, mins: null };
    if (r.mins > LIMITS.mins) return { ok: false, message: "Up to " + LIMITS.mins + " minutes (24 hours)." };
    return { ok: true, mins: r.mins };
  }

  // Writes the record for one card: its guess now, the real minutes, the time now. One card, one record: an
  // older record of the same card is replaced, so a fixed typo or a second Done never counts twice. The
  // newest 50 are kept. Nothing is written without a guess over 0 or with under 1 real minute.
  // Returns { state, recorded }.
  function recordTime(state, taskId, actualMins, now) {
    var i = findIndexById(state.tasks, taskId);
    var t = i >= 0 ? state.tasks[i] : null;
    var actual = wholeMins(actualMins);
    if (!t || !(t.estimateMins > 0) || !(actual >= 1)) return { state: state, recorded: false };
    var log = state.timeLog.filter(function (e) { return e.taskId !== taskId; });
    log.push({ taskId: taskId, estimate: t.estimateMins, actual: actual, at: nowStamp(now) });
    if (log.length > LIMITS.timeLog) log = log.slice(log.length - LIMITS.timeLog);

  // Focus time bookkeeping. The countdown itself (totalMs, endsAt, remainingMs) is not touched: a run also keeps
  // spentMs (time already counted) and segFrom (the time left when the running stretch began, null while
  // paused or ended). Only running time counts, never time past the end of the countdown.
  function focusSpentMs(run, nowMs) {
    if (!isObj(run)) return 0;
    var spent = isFiniteNum(run.spentMs) ? run.spentMs : 0;
    if (run.running && isFiniteNum(run.segFrom) && isFiniteNum(run.endsAt) && isFiniteNum(nowMs)) {

  // Whole minutes for the card. Under one minute counts as nothing.
  function spentMins(ms) {
    return isFiniteNum(ms) && ms >= 60000 ? Math.round(ms / 60000) : 0;
  }

  // Adds focus minutes to the card's real time (at most 1440). No record is written here.
  function addFocusMinutes(state, taskId, mins) {
    var i = findIndexById(state.tasks, taskId);
    if (i < 0 || !isWholeNumber(mins) || mins < 1) return state;
    var old = state.tasks[i].actualMins;
    var total = Math.min(LIMITS.mins, (isFiniteNum(old) ? old : 0) + mins);
    return updateTask(state, taskId, { actualMins: total }).state;
  }

  // Done on the Focus screen: this run's minutes go on the card, the card moves to Done, and one record is
  // written with the card's total real time. A card that is already done changes nothing (so Done twice
  // never counts twice). Returns { state, changed, recorded }.
  function finishFocus(state, taskId, mins, now) {
    var i = findIndexById(state.tasks, taskId);
    if (i < 0 || state.tasks[i].status === "done") return { state: state, changed: false, recorded: false };
    var next = addFocusMinutes(state, taskId, mins);
    var moved = moveTask(next, taskId, "done", null, now);
    next = moved.state;
    var t = next.tasks[findIndexById(next.tasks, taskId)];

  // Reset time learning: the records go, the cards keep their guesses and real times.
  // Returns { state, undo } where undo is { log } for applyTimeLogUndo, or null when there was nothing.
  function resetTimeLog(state) {

    return { state: Object.assign({}, state, { timeLog: [] }), undo: { log: state.timeLog.slice() } };
  }

  // Puts the old records back next to any written since. One card, one record still holds (the newer one
  // wins), then the newest 50 are kept.
  function applyTimeLogUndo(state, undo) {
    if (!isObj(undo) || !Array.isArray(undo.log)) return state;
    var all = undo.log.concat(state.timeLog).slice().sort(byAt);
    var seen = Object.create(null);
    var keep = [];
    for (var i = all.length - 1; i >= 0; i--) {
      if (seen[all[i].taskId]) continue;
      seen[all[i].taskId] = true;
      keep.unshift(all[i]);

    if (keep.length > LIMITS.timeLog) keep = keep.slice(keep.length - LIMITS.timeLog);
    return Object.assign({}, state, { timeLog: keep });

  // ---------- Real time in the Week (Phase 6b) ----------

  // The multiplier the Week uses: the learned one once it is shown, otherwise 1 (nothing padded).
  function planMultiplier(state) {
    var m = timeMultiplier(state && state.timeLog);
    return m.shown ? m.value : 1;
  }

  // "Use my real time": the card's Plan for number as a block length, or null when there is none
  // (no guess, multiplier 1 or less, or outside the 15 minutes to 10 hours a block can be).
  function realTimeMins(task, m) {

  // A block planned with the real time: its length is the card's Plan for number. Worked out, never stored.
  function isRealTimeBlock(task, m) {

  function isAwakeTime(v) {

  function awakeHours(settings) {

    }
    return { start: AWAKE_START, end: AWAKE_END };
  }

  // How long the waking hours are, in minutes. A window that crosses midnight (22:00 to 06:00) counts across it.
  function awakeMins(settings) {

    return (timeToMins(h.end) - timeToMins(h.start) + 1440) % 1440;
  }

  // The two waking hours boxes in Settings. Returns { ok, start, end } ("HH:MM") or { ok: false, message }.
  function checkAwake(startText, endText) {

    if (a === null || b === null) return { ok: false, message: "Type a time like 08:00." };
    if (a === b) return { ok: false, message: "Pick two different times." };
    return { ok: true, start: minsToTime(a), end: minsToTime(b) };
  }

  // A day's planned time with the real time: each block is its length times the multiplier (never less than
  // its length), up to the next 5 minutes. A Real time block counts its own length. Overlapping blocks both
  // count. Returns { mins, awake, over }.
  function dayLoad(state, date, m) {
    var k = isFiniteNum(m) && m > 1 ? m : 1;

      var len = t.scheduled.mins;
