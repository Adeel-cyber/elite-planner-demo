      var text = input.value.trim();
      if (!text) {
        hint.className = "hint gentle";
        hint.textContent = "Give it a short name first.";
        input.focus();
        return;
      }
      if (Demo.blocksAdd(App.state, 1)) return;
      boardDrafts[status] = "";
      var r = Core.addTask(App.state, { title: text, status: status, labelId: App.boardFilter || null });
      commit(r.state);
    }
  }, [
    el("div", { className: "add-row" }, [input, el("button", { type: "submit" }, "Add")]),
    hint
  ]);
}

function cardList(list, emptyText) {
  if (!list.length) return el("p", { className: "col-empty" }, emptyText);
  return el("ul", { className: "cards" }, list.map(function (t, i) { return boardCard(t, { list: list, index: i }); }));
}

function boardColumn(status, cols) {
  var name = Core.COLUMN_NAMES[status];
  var list = cols[status];
  var count = list.length;
  var kids = [];
  var extra = null;

  if (status === "done") {
    var v = Core.recentDone(list);
    list = App.doneAll ? v.all : v.shown;
    if (v.hidden || (App.doneAll && v.all.length > Core.DONE_SHOWN)) {
      extra = el("button", {
        type: "button",
        className: "col-toggle",
        "data-key": "done-toggle",
        "aria-expanded": App.doneAll ? "true" : "false",
        onclick: function () { App.doneAll = !App.doneAll; render(); }
      }, App.doneAll ? "Show fewer" : "Show all " + v.all.length);
    }
  }

  if (status === "doing" && count > 3) {
    kids.push(el("p", { className: "hint" }, "A short Doing list is easier to finish."));
  }
  kids.push(cardList(list, EMPTY_COLUMN[status]));
  if (extra) kids.push(extra);
  if (status !== "done") kids.push(addBox(status));

  return el("section", { className: "col", "data-zone": status, "aria-labelledby": "col-" + status }, [
    el("h2", { id: "col-" + status }, [name + " ", el("span", { className: "count", "aria-label": count + (count === 1 ? " card" : " cards") }, String(count))]),
    el("div", { className: "col-body" }, kids)
  ]);
}

function laterShelf(cols) {
  var open = App.laterOpen;
  var count = cols.later.length;
  var kids = [
    el("h2", { className: "shelf-head" }, el("button", {
      type: "button",
      className: "shelf-toggle",
      "data-key": "later-toggle",
      "aria-expanded": open ? "true" : "false",
      "aria-controls": "later-body",
      onclick: function () { App.laterOpen = !App.laterOpen; render(); }
    }, [
      el("span", { "aria-hidden": "true" }, open ? "▾ " : "▸ "),
      "Later ",
      el("span", { className: "count", "aria-label": count + (count === 1 ? " card" : " cards") }, String(count))
    ]))
  ];
  if (open) {
    kids.push(el("div", { id: "later-body", className: "col-body" }, [
      el("p", { className: "hint" }, "Parked, not forgotten. No rush."),
      tidyRow(),
      cardList(cols.later, EMPTY_COLUMN.later),
      addBox("later")
    ]));
  }
  return el("section", { className: "shelf", "data-zone": "later" }, kids);
}

// "Tidy the shelf (N)" and "Archived (M)", each only when there is something. Counts are for every area,
// so the area filter never hides the way to archived cards. Nothing opens by itself.
function tidyRow() {
  var tidy = Core.laterCleanupList(App.state, Core.todayISO()).length;
  var archived = Core.archivedList(App.state).length;
  if (!tidy && !archived) return null;
  return el("div", { className: "tidy-row" }, [
    tidy ? el("button", {
      type: "button",
      "data-key": "tidy-open",
      onclick: function () { openTidyShelf({}); }
    }, "Tidy the shelf (" + tidy + ")") : null,
    archived ? el("button", {
      type: "button",
      "data-key": "archived-open",
      onclick: function () { openTidyShelf({ archivedOpen: true }); }
    }, "Archived (" + archived + ")") : null
  ]);
}

function boardBar(cols) {
  var select = Menu.select({
    ariaLabel: "Area",
    key: "filter",
    className: "filter-select",
    items: labelItems("All areas"),
    value: App.boardFilter,
    onchange: function (value) {
      App.boardFilter = value;
      render();
    }
  });
  return el("div", { className: "board-bar" }, [
    select,
    el("span", { className: "pill", role: "status" }, cols.open + " open")
  ]);
}

function renderBoard(root) {
  // A deleted label must never leave the board filtered by nothing.
  App.boardFilter = Core.validFilter(App.state, App.boardFilter);
  var cols = Core.boardColumns(App.state, App.boardFilter);
  // One wrapper per draw, so the drag listeners never pile up.
  var wrap = el("div", { className: "board-view" }, [
    boardBar(cols),
    el("div", { className: "board" }, [
      boardColumn("todo", cols),
      boardColumn("doing", cols),
      boardColumn("done", cols)
    ]),
    laterShelf(cols)
  ]);
  boardDrag(wrap);
  root.appendChild(wrap);
}

// ---------- Moving cards: Move menu, keys, drag ----------

function findTask(id) {
  for (var i = 0; i < App.state.tasks.length; i++) {
    if (App.state.tasks[i].id === id) return App.state.tasks[i];
  }
  return null;
}

// Moves a card and offers a one-step Undo. The Undo lives in the toast only, so it never
// takes a place in the delete Undo stack. Returns false when nothing changed.
function moveCard(id, status, beforeId, opts) {
  opts = opts || {};
  var task = findTask(id);
  if (!task) return false;
  var r = Core.moveTask(App.state, id, status, beforeId);
  if (!r.changed) return false;
  var entry = r.undo;
  var text = opts.text || (task.status === status ? "Moved in " : "Moved to ") + Core.COLUMN_NAMES[status];
  commit(r.state);
  Toast.show(text, {
    coexist: true,
    undo: function () { commit(Core.undoMove(App.state, entry)); }
  });
  // A card sent to a closed Later shelf is out of sight, so focus goes to the shelf button.
  if (status === "later" && !App.laterOpen) focusByKey("later-toggle");
  else if (opts.focusKey) focusByKey(opts.focusKey);
  return true;
}

// The "Move to..." menu on every card. Up and Down follow the cards you can see (a label filter hides some).
function moveMenu(t, ctx) {
  var items = Core.COLUMN_ORDER.map(function (s) {
    var here = s === t.status;
    return {
      label: Core.COLUMN_NAMES[s] + (here ? " (here)" : ""),
      disabled: here,
      onclick: function () { moveCard(t.id, s, null, { focusKey: "move-" + t.id }); }
    };
  });
  if (t.status !== "done") {
    items.push({ label: "Today", onclick: function () { addToToday(t.id); } });
    items.push({ label: "Schedule...", onclick: function () { openBlockDialog(t.id); } });
  }
  var list = ctx.list;
  var i = ctx.index;
  var ordered = t.status !== "done";
  items.push({
    label: "Move up",
    disabled: !ordered || i <= 0,
    onclick: function () { moveCard(t.id, t.status, list[i - 1].id, { text: "Moved up", focusKey: "move-" + t.id }); }
  });
  items.push({
    label: "Move down",
    disabled: !ordered || i >= list.length - 1,
    onclick: function () {
      var after = list[i + 2];
      moveCard(t.id, t.status, after ? after.id : null, { text: "Moved down", focusKey: "move-" + t.id });
    }
  });
  return Menu.create({
    label: "⋯",
    title: "Move to...",
    ariaLabel: "Move " + t.title.slice(0, 60),
    className: "card-move",
    triggerClass: "move-btn",
    key: "move-" + t.id,
    items: items
  });
}

// [ and ] on a focused card. The rules for when it stays quiet live in Core.cardKeyAction.
document.addEventListener("keydown", function (e) {
  var t = e.target;
  var card = t && t.closest ? t.closest(".card") : null;
  var act = Core.cardKeyAction({
    key: e.key,
    ctrl: e.ctrlKey,
    alt: e.altKey,
    meta: e.metaKey,
    altGraph: !!(e.getModifierState && e.getModifierState("AltGraph")),
    repeat: e.repeat,
    defaultPrevented: e.defaultPrevented,
    dragging: Drag.isActive(),
    dialogOpen: Dialog.isOpen(),
    popupOpen: Popup.isOpen(),
    inPopup: !!(t && t.closest && t.closest("[data-popup]")),
    onCard: !!card,
    tag: t && t.tagName,
    editable: !!(t && t.isContentEditable)
  });
  if (!act) return;
  var id = card.getAttribute("data-id");
  var task = findTask(id);
  if (!task) return;
  e.preventDefault();
  var to = Core.shiftColumn(task.status, act === "prev" ? -1 : 1);
  if (!to) {
    Toast.show(act === "prev" ? "It is already in the first column." : "It is already in the last place.");
    return;
  }
  moveCard(id, to, null, { focusKey: "card-" + id });
});

// The column or shelf under the pointer. With columns side by side, a column also takes the empty
// space under its last card, up to the bottom of the tallest one.
function boardZoneAt(wrap, x, y) {
  var zones = [].slice.call(wrap.querySelectorAll("[data-zone]"));
  var rects = zones.map(function (z) { return z.getBoundingClientRect(); });
  var cols = zones.filter(function (z) { return z.classList.contains("col"); });
  var side = cols.length > 1 && Math.abs(cols[0].getBoundingClientRect().top - cols[1].getBoundingClientRect().top) < 4;
  var boardBottom = wrap.querySelector(".board").getBoundingClientRect().bottom;
  for (var i = 0; i < zones.length; i++) {
    var r = rects[i];
    var bottom = side && zones[i].classList.contains("col") ? boardBottom : r.bottom;
    if (x >= r.left - 8 && x <= r.right + 8 && y >= r.top - 8 && y <= bottom) return zones[i];
  }
  return null;
}

// The dashed drop spot is lifted out while the cards are measured, so it can never push the card
// under the pointer out of the way. It goes back in the same frame, so nothing flickers.
function detachDropSpot(ctx) {
  if (ctx.ph) ctx.ph.remove();
  if (ctx.tempList) {
    ctx.tempList.remove();
    ctx.tempList = null;
  }
}

function clearDropMarks(ctx) {
  detachDropSpot(ctx);
  if (ctx.zoneEl) ctx.zoneEl.classList.remove("drop-over");
  ctx.ph = null;
  ctx.zoneEl = null;
}

function showDropSpot(ctx, zone, beforeEl) {
  if (ctx.zoneEl !== zone) {
    if (ctx.zoneEl) ctx.zoneEl.classList.remove("drop-over");
    zone.classList.add("drop-over");
    ctx.zoneEl = zone;
  }
  var body = zone.querySelector(".col-body");
  if (!body) return; // a closed Later shelf: the whole shelf lights up instead
  var list = zone.querySelector("ul.cards");
  if (!list) {
    list = el("ul", { className: "cards" });
    body.insertBefore(list, body.firstChild);
    ctx.tempList = list;
  }
  if (!ctx.ph) {
    ctx.ph = el("li", { className: "drop-placeholder", "aria-hidden": "true" });
    ctx.ph.style.height = ctx.item.offsetHeight + "px";
  }
  list.insertBefore(ctx.ph, beforeEl || null);
}

function boardDrag(wrap) {
  Drag.bind(wrap, {
    itemSelector: ".card",
    ignoreSelector: ".card-move, .note-btn",
    begin: function (item) {
      var id = item.getAttribute("data-id");
      var task = findTask(id);
      return task ? { id: id, status: task.status, item: item, ph: null, tempList: null, zoneEl: null } : null;
    },
    // The page keeps its height while dragging, so lifting the drop spot out never shortens it
    // (a shorter page would nudge the scroll position at the very bottom).
    start: function () { wrap.style.minHeight = wrap.offsetHeight + "px"; },
    over: function (ctx, x, y) {
      detachDropSpot(ctx);
      var zone = boardZoneAt(wrap, x, y);
      if (!zone) { clearDropMarks(ctx); return null; }
      var status = zone.getAttribute("data-zone");
      var cards = [].slice.call(zone.querySelectorAll(".card")).filter(function (c) { return c !== ctx.item; });
      var at;
      if (status === "done") at = 0; // Done is newest first
      else if (status === "later") {
        at = Core.insertIndexGrid(cards.map(function (c) { return c.getBoundingClientRect(); }), x, y);
      } else {
        at = Core.insertIndex(cards.map(function (c) {
          var r = c.getBoundingClientRect();
          return r.top + r.height / 2;
        }), y);
      }
      var before = cards[at] || null;
      var beforeId = status === "done" || !before ? null : before.getAttribute("data-id");
      // Nothing would change (same spot): no spot is drawn and a release glides the card home.
      if (!Core.moveTask(App.state, ctx.id, status, beforeId).changed) { clearDropMarks(ctx); return null; }
      showDropSpot(ctx, zone, before);
      return { status: status, beforeId: beforeId };
    },
    end: function (ctx) {
      clearDropMarks(ctx);
      wrap.style.minHeight = "";
    },
    drop: function (ctx, target) { moveCard(ctx.id, target.status, target.beforeId); }
  });
}

// Card dialog: edit every part of one card, or delete it (with Undo).

// Effort words live in Core.SIZE_NAMES, so the Today battery and pick list say the same thing.
var COST_CHOICES = [1, 2, 3].map(function (v) { return { label: Core.SIZE_NAMES[v], value: v }; });

// opts.makeSmaller (the Today "Make it smaller" helper) adds up to 5 empty step boxes and focuses the first.
function openCardEdit(taskId, opts) {
  var task = null;
  App.state.tasks.forEach(function (t) { if (t.id === taskId) task = t; });
  if (!task) return;

  var steps = task.steps.map(function (s) { return { id: s.id, text: s.text, done: s.done }; });

  var title = el("input", { type: "text", maxLength: Core.LIMITS.title, autocomplete: "off", dir: "auto" });
  title.value = task.title;
  var hint = el("p", { className: "hint", role: "status" });

  var statusField = StatusField.create(task.status);

  var notes = el("textarea", { rows: 4, maxLength: Core.NOTES_MAX, dir: "auto" });
  notes.value = task.notes;

  var label = Menu.select({ ariaLabel: "Label", items: labelItems("No label"), value: task.labelId || "" });

  var due = el("input", { type: "date" });
  due.value = task.due || "";
  var clearDue = el("button", { type: "button", onclick: function () { due.value = ""; due.focus(); } }, "Clear date");

  var stepList = el("div", { className: "step-list" });
  var stepNote = el("p", { className: "hint" });
  var addStep = el("button", { type: "button", onclick: function () {
    if (steps.length >= Core.LIMITS.steps) return;
    steps.push({ id: Core.newId("s"), text: "", done: false });
    drawSteps(stepList.querySelectorAll("input[type=text]").length);
  } }, "Add step");

  function drawSteps(focusIndex) {
    stepList.textContent = "";
    steps.forEach(function (s, i) {
      var text = el("input", {
        type: "text",
        maxLength: Core.LIMITS.stepText,
        autocomplete: "off",
        dir: "auto",
        "aria-label": "Step " + (i + 1)
      });
      text.value = s.text;
      text.addEventListener("input", function () { s.text = text.value; });
      var check = el("input", {
        type: "checkbox",
        checked: s.done,
        "aria-label": "Step " + (i + 1) + " done",
        onchange: function () { s.done = check.checked; }
      });
      stepList.appendChild(el("div", { className: "step-row" }, [
        el("label", { className: "step-check" }, check),
        text,
        el("button", {
          type: "button",
          "aria-label": "Remove step " + (i + 1),
          onclick: function () {
            steps.splice(i, 1);
            drawSteps();
            addStep.focus();
          }
        }, "Remove")
      ]));
    });
    var full = steps.length >= Core.LIMITS.steps;
    addStep.disabled = full;
    stepNote.textContent = full ? "8 steps is the most a card can hold." : "";
    if (typeof focusIndex === "number") {
      var boxes = stepList.querySelectorAll("input[type=text]");
      if (boxes[focusIndex]) boxes[focusIndex].focus();
    }
  }
  drawSteps();

  var cost = el("fieldset", { className: "settings-block" }, [
    el("legend", null, "Effort"),
    el("div", { className: "segmented" }, COST_CHOICES.map(function (c) {
      return el("label", null, [
        el("input", { type: "radio", name: "card-cost", value: String(c.value), checked: c.value === task.cost }),
        el("span", null, c.label)
      ]);
    }))
  ]);

  function costValue() {
    var picked = cost.querySelector("input:checked");
    return picked ? +picked.value : task.cost;
  }

  // Time Reality Check: the guess (with "Plan for N min" once the planner has learned) and the real time.
  // Only a changed "Time it took" box writes a time record (Core.recordTime). Status Done here never does.
  var mult = Core.timeMultiplier(App.state.timeLog);
  function minutesBox(value, label) {
    var input = el("input", { type: "text", inputmode: "numeric", maxLength: 4, autocomplete: "off", "aria-label": label });
    input.value = value ? String(value) : "";
    return input;
  }
  var guess = minutesBox(task.estimateMins, "Your guess in minutes");
  var guessNote = el("p", { className: "hint gentle", role: "status", hidden: true });
  // "Plan for N min" pads the guess once and remembers the typed guess; the button then reads
  // "Back to my guess" and never pads again. Typing in the box starts over (Core.planPress).
  var planned = null;
  var plan = el("button", { type: "button", className: "plan-for", hidden: true, onclick: function () {
    var r = Core.planPress(guess.value, planned, mult.value);
    if (!r) return;
    guess.value = r.guess;
    planned = r.original;
    showPlan();
    guess.focus();
  } });
  var real = minutesBox(task.actualMins, "Time it took in minutes");
  var realNote = el("p", { className: "hint gentle", role: "status", hidden: true });

  function say(note, r) {
    note.textContent = r.ok ? "" : r.message;
    note.hidden = r.ok;
  }

  function showPlan() {
    var r = Core.checkMinutesBox(guess.value);
    say(guessNote, r);
    var words = Core.planButtonText(guess.value, planned, mult.shown, mult.value);
    plan.hidden = words === null;
    if (words) {
      plan.textContent = words.text;
      plan.setAttribute("aria-label", words.aria);
    }
  }
  guess.addEventListener("input", function () {
    planned = null;
    showPlan();
  });
  real.addEventListener("input", function () { say(realNote, Core.checkMinutesBox(real.value)); });
  showPlan();

  var timeBlock = el("fieldset", { className: "settings-block time-fields" }, [
    el("legend", null, "Time"),
    el("label", { className: "field" }, [el("span", null, "Your guess (minutes)"), guess]),
    guessNote,
    plan,
    el("label", { className: "field" }, [el("span", null, "Time it took (minutes)"), real]),
    realNote
  ]);

  function snapshot() {
    return JSON.stringify([title.value, statusField.select.value, notes.value, label.value, due.value, steps, costValue(), guess.value, real.value]);
  }
  var initial = snapshot();

  function save() {
    var text = title.value.trim();
    if (!text) {
      // Never blank a card by accident: put the old name back and say so kindly.
      title.value = task.title;
      hint.className = "hint gentle";
      hint.textContent = "A card needs a name, so the old one is back. Press Save when you are ready.";
      title.focus();
      return false;
    }
    var g = Core.checkMinutesBox(guess.value);
    var a = Core.checkMinutesBox(real.value);
    if (!g.ok || !a.ok) {
      say(guessNote, g);
      say(realNote, a);
      (g.ok ? real : guess).focus();
      return false;
    }
    var patch = {
      title: text,
      status: statusField.select.value,
      notes: notes.value,
      labelId: label.value || null,
      due: due.value || null,
      steps: steps
        .map(function (s) { return { id: s.id, text: s.text.trim(), done: s.done }; })
        .filter(function (s) { return s.text; }),
      cost: costValue(),
      estimateMins: g.mins,
      actualMins: a.mins
    };
    var moved = patch.status !== task.status;
    var realChanged = a.mins !== task.actualMins;
    var r = Core.updateTask(App.state, task.id, patch);
    var next = r.state;
    var learned = false;
    if (realChanged && a.mins) {
      var rec = Core.recordTime(next, task.id, a.mins);
      next = rec.state;
      learned = rec.recorded;
    }
    commit(next);
    if (moved) Toast.show("Moved to " + Core.COLUMN_NAMES[patch.status]);
    else if (learned) Toast.show("Saved your real time. Thank you.");
    // The card was redrawn, so give focus back to its new button once the dialog is gone.
    setTimeout(function () { focusByKey("card-" + task.id) || focusByKey("slot-" + task.id); }, 0);
  }

  var body = el("div", null, [
    el("label", { className: "field" }, [el("span", null, "Title"), title]),
    hint,
    statusField.node,
    el("label", { className: "field" }, [el("span", null, "Notes"), notes]),
    el("div", { className: "field" }, [el("span", null, "Label"), label]),
    el("div", { className: "field" }, [
      el("span", null, "Due date"),
      el("div", { className: "add-row" }, [due, clearDue])
    ]),
    el("fieldset", { className: "settings-block" }, [
      el("legend", null, "Steps"),
      stepList,
      stepNote,
      addStep
    ]),
    cost,
    timeBlock
  ]);

  var dlg = Dialog.open({
    title: "Edit card",
    body: body,
    // Typed changes are never thrown away by a stray click outside or by Esc.
    hasChanges: function () { return snapshot() !== initial; },
    buttons: [
      { label: "Delete card", onclick: function () { removeTaskWithUndo(task.id); } },
      { label: "Cancel" },
      { label: "Save", primary: true, onclick: save }
    ]
  });

  title.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      if (save() !== false) dlg.close();
    }
  });

  if (opts && opts.makeSmaller) {
    var room = Core.LIMITS.steps - steps.length;
    if (room <= 0) {
      stepNote.textContent = "8 steps is the most a card can hold.";
    } else {
      var first = steps.length;
      for (var n = 0; n < Math.min(5, room); n++) steps.push({ id: Core.newId("s"), text: "", done: false });
      drawSteps(first);
      // Empty boxes are not a change to lose, so an outside click still closes the dialog.
      initial = snapshot();
    }
  }
}

// Custom color picker: a popover with a saturation and brightness square, a hue slider,
// a hex box and a preview circle. Pointer events, so mouse, touch and pen share one path.
// Color is applied only when Done is pressed. Esc, Cancel or a click outside applies nothing.

var ColorPicker = {
  // ColorPicker.open({ wrap, trigger, color, onDone(hex) }) wrap holds the popover, trigger gets focus back.
  open: function (opts) {
    var start = Core.hexToHsv(Core.labelHex(opts.color)) || { h: 0, s: 0, v: 1 };
    var hsv = { h: start.h, s: start.s, v: start.v };
    var popup = null;

    var square = el("div", {
      className: "cp-square",
      role: "slider",
      tabindex: "0",
      "aria-label": "Saturation and brightness"
    }, el("span", { className: "cp-thumb", "aria-hidden": "true" }));
    var hue = el("div", {
      className: "cp-hue",
      role: "slider",
      tabindex: "0",
      "aria-label": "Hue",
      "aria-valuemin": "0",
      "aria-valuemax": "360"
    }, el("span", { className: "cp-thumb", "aria-hidden": "true" }));
    var preview = el("span", { className: "cp-preview dot", "aria-hidden": "true" });
    var hex = el("input", {
      type: "text",
      className: "cp-hex",
      maxLength: 9,
      autocomplete: "off",
      spellcheck: "false",
      "aria-label": "Hex color"
    });
    var hint = el("p", { className: "hint", role: "status" });

    function current() { return Core.hsvToHex(hsv.h, hsv.s, hsv.v); }

    function paint(skipHex) {
      var h = current();
      square.style.background = "linear-gradient(to top, #000, rgba(0,0,0,0)), linear-gradient(to right, #FFF, rgba(255,255,255,0)), " +
        Core.hsvToHex(hsv.h, 1, 1);
      square.firstChild.style.left = hsv.s * 100 + "%";
      square.firstChild.style.top = (1 - hsv.v) * 100 + "%";
      hue.firstChild.style.left = hsv.h / 360 * 100 + "%";
      square.setAttribute("aria-valuetext", "Saturation " + Math.round(hsv.s * 100) + " percent, brightness " + Math.round(hsv.v * 100) + " percent");
      hue.setAttribute("aria-valuenow", String(Math.round(hsv.h)));
      hue.setAttribute("aria-valuetext", Math.round(hsv.h) + " degrees");
      preview.style.background = h;
      if (!skipHex) { hex.value = h; hint.textContent = ""; }
    }

    // Position inside a box from a pointer, as 0 to 1.
    function fraction(e, box) {
      var r = box.getBoundingClientRect();
      return {
        x: Math.min(1, Math.max(0, (e.clientX - r.left) / (r.width || 1))),
        y: Math.min(1, Math.max(0, (e.clientY - r.top) / (r.height || 1)))
      };
    }

    // One drag handler for both controls. onMove gets the 0 to 1 position.
    function drag(box, onMove) {
      var down = false;
      box.addEventListener("pointerdown", function (e) {
        if (e.button !== undefined && e.button > 0) return;
        down = true;
        box.focus();
        if (box.setPointerCapture) { try { box.setPointerCapture(e.pointerId); } catch (err) { /* not capturable */ } }
        e.preventDefault();
        onMove(fraction(e, box));
      });
      box.addEventListener("pointermove", function (e) { if (down) onMove(fraction(e, box)); });
      function up(e) {
        down = false;
        if (box.releasePointerCapture) { try { box.releasePointerCapture(e.pointerId); } catch (err) { /* already released */ } }
      }
      box.addEventListener("pointerup", up);
      box.addEventListener("pointercancel", up);
    }

    drag(square, function (p) { hsv.s = p.x; hsv.v = 1 - p.y; paint(); });
    drag(hue, function (p) { hsv.h = p.x * 360; paint(); });

    function clamp01(n) { return Math.min(1, Math.max(0, n)); }

    square.addEventListener("keydown", function (e) {
      var step = (e.shiftKey ? 10 : 1) / 100;
      var handled = true;
      if (e.key === "ArrowRight") hsv.s = clamp01(hsv.s + step);
      else if (e.key === "ArrowLeft") hsv.s = clamp01(hsv.s - step);
      else if (e.key === "ArrowUp") hsv.v = clamp01(hsv.v + step);
      else if (e.key === "ArrowDown") hsv.v = clamp01(hsv.v - step);
      else handled = false;
      if (handled) { e.preventDefault(); paint(); }
    });

    hue.addEventListener("keydown", function (e) {
      var step = e.shiftKey ? 15 : 1;
      var handled = true;
      if (e.key === "ArrowRight" || e.key === "ArrowUp") hsv.h = Math.min(360, hsv.h + step);
      else if (e.key === "ArrowLeft" || e.key === "ArrowDown") hsv.h = Math.max(0, hsv.h - step);
      else if (e.key === "Home") hsv.h = 0;
      else if (e.key === "End") hsv.h = 360;
      else handled = false;
      if (handled) { e.preventDefault(); paint(); }
    });

    // Typing a valid hex moves the picker. A gray or black keeps the old hue so the slider does not jump.
    hex.addEventListener("input", function () {
      var parsed = Core.parseHexInput(hex.value);
      if (!parsed) {
        hint.className = "hint gentle";
        hint.textContent = "Use six letters or numbers, like #7FA7D9.";
        return;
      }
      var next = Core.hexToHsv(parsed);
      hsv.s = next.s;
      hsv.v = next.v;
      if (next.s > 0 && next.v > 0) hsv.h = next.h;
      paint(true);
      hint.className = "hint";
      hint.textContent = "";
    });
    hex.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); done(); }
    });

    function done() {
      var picked = current();
      popup.close(true);
      opts.onDone(picked);
    }

    var panel = el("div", { className: "menu picker", role: "group", "aria-label": "Custom color" }, [
      square,
      el("div", { className: "cp-hue-wrap" }, hue),
      el("div", { className: "cp-row" }, [
        preview,
        hex
      ]),
      hint,
      el("div", { className: "cp-actions" }, [
        el("button", { type: "button", className: "primary", onclick: done }, "Done"),
        el("button", { type: "button", onclick: function () { popup.close(true); } }, "Cancel")
      ])
    ]);

    // Tab goes square, hue, hex, Done, Cancel (top to bottom) and round again.
    panel.addEventListener("keydown", function (e) {
      if (e.key !== "Tab") return;
      var stops = [].slice.call(panel.querySelectorAll("[tabindex='0'], input, button"));
      var i = stops.indexOf(document.activeElement);
      var next = e.shiftKey ? (i <= 0 ? stops.length - 1 : i - 1) : (i + 1) % stops.length;
      e.preventDefault();
      stops[next].focus();
    });

    popup = Popup.show({ wrap: opts.wrap, panel: panel, trigger: opts.trigger, refocusOnOutside: true });
    paint();
    square.focus();
    return popup;
  }
};

// One pointer drag helper for the whole app (the board now, the Week view later).
// It handles mouse, touch and pen with pointer events, the ghost that follows the pointer,
// auto-scroll near the edge, Esc and snap back. The view only supplies the geometry.
//
// Drag.bind(root, {
//   itemSelector, ignoreSelector, handleSelector,   // what can be grabbed, and what cannot
//   ghost: true,                                    // false, or a function(ctx) giving true or false (a resize has no ghost)
//   begin(item, info) -> ctx | null                 // at pointer down. info.handle says a handle was grabbed
//   start(ctx)                                      // the drag really began
//   over(ctx, x, y) -> target | null                // pointer is here. Draws its own placeholder
//   drop(ctx, target)                               // released over a target
//   cancel(ctx)                                     // snapped back (Esc, outside, lost pointer)
//   end(ctx)                                        // always first, before drop or cancel. Remove placeholders
//   scrollTargets(ctx) -> [window or element]       // what to auto-scroll. Default is the window
// })
//
// Touch starts a drag after a short hold, so a quick swipe still scrolls the page.
// Mouse and pen start after a few pixels. Only one drag at a time, one pointer at a time.
// Only Esc, pointercancel, a lost window and a real right click end a drag early. While a drag runs,
// app keys (Enter, Space, Tab, arrows, letters, Alt, F10, Menu) are held back so they cannot click
// or open anything (Core.dragKeyAction). Browser keys (F5, F12, Ctrl shortcuts) always pass.
// Safety net: a mouse or pen moving with no button pressed (a lost pointerup) ends the session.

var Drag = (function () {
  var HOLD_MS = 350;
  var HOLD_SLOP = 8;
  var MOVE_SLOP = 5;
  var EDGE = 60;
  var MAX_SPEED = 22;

  var KEY_EVENTS = ["keydown", "keyup", "keypress"];

  var session = null; // set from pointer down until the pointer is released
  var swallowTimer = null;
  var swallowEat = null; // the one click listener that is waiting, so a second drop replaces it, never adds one

  function place(s) {
    if (s.ghost) s.ghost.style.transform = "translate(" + Math.round(s.x - s.offX) + "px," + Math.round(s.y - s.offY) + "px)";
  }

  function autoScroll(s) {
    var targets = s.cfg.scrollTargets ? s.cfg.scrollTargets(s.ctx) : [window];
    var moved = false;
    targets.forEach(function (t) {
      if (t === window) {
        var speed = Core.edgeScrollSpeed(s.y, window.innerHeight, EDGE, MAX_SPEED);
        if (!speed) return;
        var before = window.pageYOffset;
        window.scrollBy({ top: speed, left: 0, behavior: "instant" });
        if (window.pageYOffset !== before) moved = true;
      } else {
        var r = t.getBoundingClientRect();
        if (s.x < r.left || s.x > r.right) return;
        var sp = Core.edgeScrollSpeed(s.y - r.top, r.height, EDGE, MAX_SPEED);
        if (!sp) return;
        var was = t.scrollTop;
        t.scrollTop += sp;
        if (t.scrollTop !== was) moved = true;
      }
    });
    return moved;
  }

  function frame() {
    var s = session;
    if (!s || !s.started) return;
    var scrolled = autoScroll(s);
    if (s.dirty || scrolled) {
      s.dirty = false;
      place(s);
      s.target = s.cfg.over(s.ctx, s.x, s.y) || null;
    }
    s.raf = requestAnimationFrame(frame);
  }

  function startDrag(s) {
    if (s.started) return;
    if (!s.item.isConnected) { cleanup(); return; }
    clearTimeout(s.timer);
    s.started = true;
    s.dirty = true;
    document.body.classList.add("is-dragging");
    s.item.classList.add("drag-source");
    var wantGhost = typeof s.cfg.ghost === "function" ? s.cfg.ghost(s.ctx) : s.cfg.ghost !== false;
    if (wantGhost) {
      var rect = s.item.getBoundingClientRect();
      s.offX = s.startX - rect.left;
      s.offY = s.startY - rect.top;
      var ghost = s.item.cloneNode(true);
      ghost.removeAttribute("data-key");
      ghost.removeAttribute("data-id");
      [].forEach.call(ghost.querySelectorAll("[data-key]"), function (n) { n.removeAttribute("data-key"); });
      ghost.classList.remove("drag-source");
      ghost.classList.add("drag-ghost");
      ghost.setAttribute("aria-hidden", "true");
      ghost.setAttribute("inert", "");
      // A clone of an absolutely placed item (a week block) must not keep its own position.
      ghost.style.left = "0px";
      ghost.style.top = "0px";
      ghost.style.right = "auto";
      ghost.style.bottom = "auto";
      ghost.style.width = rect.width + "px";
      ghost.style.height = rect.height + "px";
      document.body.appendChild(ghost);
      s.ghost = ghost;
      place(s);
    }
    if (s.cfg.start) s.cfg.start(s.ctx);
    s.raf = requestAnimationFrame(frame);
  }

  // Takes the listeners off and clears the look. snapBack lets the ghost glide home first.
  function cleanup(snapBack) {
    var s = session;
    if (!s) return;
    session = null;
    clearTimeout(s.timer);
    cancelAnimationFrame(s.raf);
    document.removeEventListener("pointermove", onMove, true);
    document.removeEventListener("pointerup", onUp, true);
    document.removeEventListener("pointercancel", onCancel, true);
    KEY_EVENTS.forEach(function (type) { window.removeEventListener(type, onKey, true); });
    document.removeEventListener("contextmenu", onContext, true);
    document.removeEventListener("touchmove", onTouchMove, { capture: true });
    window.removeEventListener("blur", onBlur);
    document.removeEventListener("visibilitychange", onHidden);
    document.body.classList.remove("is-dragging");
    s.item.classList.remove("drag-source");
    var ghost = s.ghost;
    if (ghost) {
      var home = s.item.isConnected ? s.item.getBoundingClientRect() : null;
      if (snapBack && home && !motionReduced()) {
        ghost.style.transition = "transform 160ms ease";
        ghost.style.transform = "translate(" + Math.round(home.left) + "px," + Math.round(home.top) + "px)";
        setTimeout(function () { ghost.remove(); }, 180);
      } else {
        ghost.remove();
      }
    }
    return s;
  }

  // A click that ends a drag must not also open the card. Only one listener ever waits: an older one left
  // behind would later eat a click that has nothing to do with a drag.
  function stopSwallow() {
    if (swallowEat) document.removeEventListener("click", swallowEat, true);
    swallowEat = null;
    clearTimeout(swallowTimer);
  }
  function swallowClick() {
    stopSwallow();
    swallowEat = function (e) {
      e.stopPropagation();
      e.preventDefault();
      stopSwallow();
    };
    document.addEventListener("click", swallowEat, true);
    swallowTimer = setTimeout(stopSwallow, 120);
  }

  function finish(drop) {
    var s = session;
    if (!s) return;
    var wasStarted = s.started;
    var target = drop && wasStarted ? (s.cfg.over(s.ctx, s.x, s.y) || null) : null;
    cleanup(wasStarted && !target);
    if (wasStarted) {
      if (s.cfg.end) s.cfg.end(s.ctx);
      swallowClick();
      if (target) s.cfg.drop(s.ctx, target);
      else if (s.cfg.cancel) s.cfg.cancel(s.ctx);
    }
    // A save or another tab may have asked for a redraw while the pointer was down.
    if (App.renderPending) render();
  }

  function mine(e) { return session && e.pointerId === session.pointerId; }

  function onMove(e) {
    if (!mine(e)) return;
    // The button was let go where we could not see it (the pointerup was lost): snap back.
    if (e.pointerType !== "touch" && Core.pointerReleased({ buttons: e.buttons })) { finish(false); return; }
    var s = session;
    s.x = e.clientX;
    s.y = e.clientY;
    if (s.started) { s.dirty = true; return; }
    var dist = Math.sqrt(Math.pow(s.x - s.startX, 2) + Math.pow(s.y - s.startY, 2));
    if (s.type === "touch") {
      if (dist > HOLD_SLOP) finish(false); // the finger is scrolling the page
    } else if (dist >= MOVE_SLOP) {
      startDrag(s);
    }
  }

  function onUp(e) {
    if (mine(e)) finish(true);
  }

  function onCancel(e) {
    if (mine(e)) finish(false);
  }

  // Listens on window in the capture phase, so a drag sees Esc before a popup or a dialog does.
  function onKey(e) {
    if (!session) return;
    // Pointer down but not dragging yet: Esc just lets go and still reaches popups and dialogs.
    if (!session.started) {
      if (e.type === "keydown" && (e.key === "Escape" || e.key === "Esc")) finish(false);
      return;
    }
    var act = Core.dragKeyAction({
      key: e.key, type: e.type, started: true, ctrl: e.ctrlKey, alt: e.altKey, meta: e.metaKey
    });
    if (act === "pass") return;
    e.preventDefault();
    e.stopImmediatePropagation();
    if (act === "cancel") finish(false);
  }

  function onContext(e) {
    if (!session) return;
    e.preventDefault();
    // A real right click ends a mouse drag. A keyboard menu (Shift+F10, the Menu key) never does,
    // and a long press on touch is how the drag began, so it stays.
    if (session.started && session.type !== "touch" && e.button === 2) finish(false);
  }

  function onTouchMove(e) {
    if (session && session.started && e.cancelable) e.preventDefault();
  }

  // The window lost focus or the tab was hidden: let go, nothing moves.
  function onBlur() { finish(false); }
  function onHidden() { if (document.visibilityState === "hidden") finish(false); }

  function bind(root, cfg) {
    root.addEventListener("pointerdown", function (e) {
      if (session || !e.isPrimary) return;
      if (e.pointerType === "mouse" && e.button !== 0) return;
      var t = e.target;
      if (!t || !t.closest) return;
      if (cfg.ignoreSelector && t.closest(cfg.ignoreSelector)) return;
      var item = t.closest(cfg.itemSelector);
      if (!item || !root.contains(item)) return;
      var ctx = cfg.begin(item, { handle: !!(cfg.handleSelector && t.closest(cfg.handleSelector)), event: e });
      if (!ctx) return;
      var s = {
        cfg: cfg, ctx: ctx, item: item, pointerId: e.pointerId,
        type: e.pointerType === "touch" ? "touch" : "mouse",
        startX: e.clientX, startY: e.clientY, x: e.clientX, y: e.clientY,
        offX: 0, offY: 0, started: false, dirty: false, target: null, ghost: null, timer: null, raf: 0
      };
      session = s;
      document.addEventListener("pointermove", onMove, true);
      document.addEventListener("pointerup", onUp, true);
      document.addEventListener("pointercancel", onCancel, true);
      KEY_EVENTS.forEach(function (type) { window.addEventListener(type, onKey, true); });
      document.addEventListener("contextmenu", onContext, true);
      document.addEventListener("touchmove", onTouchMove, { capture: true, passive: false });
      window.addEventListener("blur", onBlur);
      document.addEventListener("visibilitychange", onHidden);
      if (s.type === "touch") s.timer = setTimeout(function () { if (session === s) startDrag(s); }, HOLD_MS);
    });
  }

  return {
    bind: bind,
    // A drag is really happening (the shortcuts stay quiet).
    isActive: function () { return !!(session && session.started); },
    // The pointer is down on something draggable (redraws wait until it is up).
    busy: function () { return !!session; }
  };
})();

// First run (Phase 8c): the welcome screen, the 4 step tour and the Settings blocks for the sample data and
// the tour. The welcome screen is drawn instead of the shell, so no banner, tab, reminder bar or Fresh day
// question can show over it (App.firstRun is true until a choice is made).

// Leaves the welcome screen: builds the shell and saves the planner at once, so a reload straight after does
// not show the welcome again. kind: "empty", "sample" or "backup".
function chooseFirstRun(kind) {
  var now = new Date();
  var next = kind === "sample" ? Core.sampleState(App.state, now) : App.state;
  App.firstRun = false;
  App.view = "board";
  rememberTab("board");
  buildShell(document.getElementById("app"));
  commit(Core.markResetDone(next, Core.todayISO(now)));
  App.saver.flush();
  if (kind === "backup") openSettings({ scrollTo: "backup" });
  else startTour(kind === "sample");
}

function openFirstRun() {
  var app = document.getElementById("app");
  var W = Core.WELCOME;
  applySettings();

  function choice(label, hint, id, primary, kind) {
    return el("div", { className: "fr-choice" }, [
      el("button", {
        type: "button",
        className: primary ? "primary" : "",
        "aria-describedby": id,
        onclick: function () { chooseFirstRun(kind); }
      }, label),
      el("p", { className: "hint", id: id }, hint)
    ]);
  }

  var title = el("h1", { id: "welcome-title", tabindex: "-1" }, APP_NAME);
  var page = el("main", { className: "firstrun", "aria-labelledby": "welcome-title" }, [
    title,
    el("p", { className: "fr-line" }, W.line),
    App.store.persistent ? null : el("p", { className: "hint gentle", role: "status" }, Core.MSG.blocked),
    choice("Start empty", W.startHint, "fr-empty", true, "empty"),
    choice("Load sample data", W.sampleHint, "fr-sample", false, "sample"),
    el("p", { className: "fr-foot" }, W.footer)
  ]);
  app.textContent = "";
  app.appendChild(page);
  title.focus({ preventScroll: true });
}

// ---------- The tour ----------
// One Dialog for all four steps (focus trap, Esc, focus return), styled as a bottom sheet with a clear
// backdrop so the view behind stays in sight. Esc or Skip tour ends it. Nothing is stored.

function startTour(sample) {
  var steps = Core.tourSteps(sample);
  var last = steps.length - 1;
  var at = 0;
  var handle = null;

  var text = el("p", { className: "tour-text", "aria-live": "polite" });
  var back = el("button", { type: "button", onclick: function () { go(at - 1); } }, "Back");
  var next = el("button", {
    type: "button",
    className: "primary",
    onclick: function () { if (at === last) handle.close(); else go(at + 1); }
  }, "Next");
  var extra = el("button", {
    type: "button",
    hidden: true,
    onclick: function () {
      handle.close();
      openSettings({ scrollTo: "backup" });
    }
  }, "");
  var skip = el("button", { type: "button", className: "tour-skip", onclick: function () { handle.close(); } }, "Skip tour");

  function go(n) {
    at = Math.max(0, Math.min(last, n));
    var s = steps[at];
    handle.el.querySelector("h2").textContent = (at + 1) + " of " + steps.length + ": " + s.title;
    text.textContent = s.text;
    back.disabled = at === 0;
    next.textContent = at === last ? "Finish" : "Next";
    extra.hidden = !s.extra;
    extra.textContent = s.extra || "";
    if (App.view !== s.view) selectView(s.view, false);
  }

  handle = Dialog.open({
    title: "Quick tour",
    className: "tour",
    overlayClass: "tour-wrap",
    canDismissOutside: function () { return false; },
    body: el("div", null, [text, el("div", { className: "tour-actions" }, [back, next, extra, skip])]),
    // Focus goes to the open tab. Dialog gives it back to the button that opened the tour afterwards, when
    // there is one (after the welcome screen the opener is gone, so the tab keeps it).
    onClose: function () {
      if (App.view !== "board") selectView("board", false);
      var tab = Shell.tabs && Shell.tabs.querySelector('[aria-selected="true"]');
      if (tab) tab.focus({ preventScroll: true });
    }
  });
  handle.el.querySelector("h2").setAttribute("aria-live", "polite");
  go(0);
  next.focus({ preventScroll: true });
}

// ---------- Settings blocks ----------

// "Sample data": shown only while sample cards exist. Clear asks inline (a second dialog would close the
// drawer), then Undo is here and in a toast. Cards the person added stay (Core.clearSample).
function sampleBlock() {
  if (!Core.sampleCount(App.state)) return null;
  var box = el("fieldset", { className: "settings-block" });
  var undoEntry = null;

  function clear() {
    if (FocusRun && Core.isSampleTask({ id: FocusRun.taskId })) endFocusQuietly();
    var r = Core.clearSample(App.state);
    if (!r.undo) return draw();
    undoEntry = r.undo;
    commit(r.state);
    Toast.show("Sample data cleared.", { undo: undo });
    draw("undo");
  }

  function undo() {
    if (!undoEntry) return;
    commit(Core.applySampleUndo(App.state, undoEntry));
    undoEntry = null;
    Toast.hide();
    draw();
  }

  function draw(mode) {
    box.textContent = "";
    var n = Core.sampleCount(App.state);
    box.appendChild(el("legend", null, "Sample data"));
    var focusKey = "clear";
    if (mode === "undo") {
      box.appendChild(el("div", { className: "undo-bar" }, [
        el("span", null, "Sample data cleared."),
        el("button", { type: "button", "data-sd": "undo", onclick: undo }, "Undo")
      ]));
      focusKey = "undo";
    } else if (mode === "confirm") {
      box.appendChild(el("div", { className: "undo-bar is-wrap", role: "group", "aria-label": "Clear sample data" }, [
        el("span", null, Core.sampleClearText(n)),
        el("button", { type: "button", "data-sd": "yes", onclick: clear }, "Yes, clear them"),
        el("button", { type: "button", "data-sd": "keep", onclick: function () { draw(); } }, "Keep them")
      ]));
      focusKey = "keep";
    } else {
      box.appendChild(el("p", { className: "hint" }, Core.sampleStatusText(n)));
      box.appendChild(el("button", {
        type: "button",
        "data-sd": "clear",
        onclick: function () { draw("confirm"); }
      }, "Clear sample data and start fresh"));
      focusKey = "clear";
    }
    if (mode) {
      var target = box.querySelector('[data-sd="' + focusKey + '"]');
      if (target) target.focus();
    }
  }
  draw();
  return box;
}

// "Quick tour": the tour again, any time. The drawer closes first (the tour is its own Dialog).
function tourBlock() {
  return el("fieldset", { className: "settings-block" }, [
    el("legend", null, "Quick tour"),
    el("p", { className: "hint" }, "Four short steps: Board, Today, Week and Backup."),
    el("button", {
      type: "button",
      "data-tour": "again",
      onclick: function () {
        if (Dialog.current) Dialog.current.close();
        startTour(Core.onlySample(App.state));
      }
    }, "Show the tour again")
  ]);
}

// Focus screen: a ring timer, the next tiny step, Pause, Done and a short win moment.
// No sound. The timer keeps an end time (endsAt), not a counter, so a sleeping laptop or a
// background tab never makes it drift. The run lives in memory only, so a reload ends it.

// { taskId, totalMs, endsAt (null while paused), remainingMs, running, ended, spentMs, segFrom } or null.
// spentMs and segFrom only count the real running time for the card (Core.focusSpentMs). The countdown
// never reads them.
var FocusRun = null;

// The open screen: { dlg, body, taskId, win, ring, clock }.
var FocusUI = null;

var focusTicker = null;
var RING_R = 52;
var RING_LEN = 2 * Math.PI * RING_R;

function focusTask() {
  return FocusUI ? findTask(FocusUI.taskId) : null;
}

function runFor(taskId) {
  return FocusRun && FocusRun.taskId === taskId ? FocusRun : null;
}

function remainingMs(run) {
  return run.running ? Math.max(0, run.endsAt - Date.now()) : run.remainingMs;
}

function clockText(ms) {
  var total = Math.ceil(ms / 1000);
  var m = Math.floor(total / 60);
  var s = total % 60;
  return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}

function stopTicker() {
  clearInterval(focusTicker);
  focusTicker = null;
}

function ensureTicker() {
  if (focusTicker) return;
  focusTicker = setInterval(focusTick, 500);
}

// Counts the running stretch so far into spentMs. Call it while the run still says it is running.
function bankSpent(run) {
  run.spentMs = Core.focusSpentMs(run, Date.now());
  run.segFrom = null;
}

// The real minutes of this run go on the card (no time record). Under one minute adds nothing.
function creditRun(run) {
  var mins = Core.spentMins(Core.focusSpentMs(run, Date.now()));
  if (!mins || !findTask(run.taskId)) return;
  commit(Core.addFocusMinutes(App.state, run.taskId, mins));
}

function endRun(run) {
  bankSpent(run);
  run.running = false;
  run.ended = true;
  run.endsAt = null;
  run.remainingMs = 0;
  stopTicker();
}

function focusTick() {
  var run = FocusRun;
  if (!run || !run.running) { stopTicker(); return; }
  var task = findTask(run.taskId);
  // The card was deleted or finished somewhere else: the timer has nothing left to time.
  if (!task || task.status === "done") {
    if (task) creditRun(run);
    FocusRun = null;
    stopTicker();
    if (FocusUI && FocusUI.taskId === run.taskId) FocusUI.dlg.close();
    return;
  }
  var left = remainingMs(run);
  if (left <= 0) {
    endRun(run);
    if (FocusUI && FocusUI.taskId === run.taskId) drawFocus();
    else Toast.show("Focus time is up. Nice focus.");
    return;
  }
  if (FocusUI && FocusUI.clock) paintClock(run);
}

function paintClock(run) {
  var left = remainingMs(run);
  FocusUI.clock.textContent = clockText(left);
  FocusUI.ring.setAttribute("stroke-dashoffset", String(RING_LEN * (1 - left / run.totalMs)));
}

function ringSvg(run) {
  var ns = "http://www.w3.org/2000/svg";
  function circle(cls) {
    var c = document.createElementNS(ns, "circle");
    c.setAttribute("cx", "60");
    c.setAttribute("cy", "60");
    c.setAttribute("r", String(RING_R));
    c.setAttribute("fill", "none");
    c.setAttribute("class", cls);
    return c;
  }
  var svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 120 120");
  svg.setAttribute("class", "ring");
  svg.setAttribute("aria-hidden", "true");
  var arc = circle("ring-arc");
  arc.setAttribute("stroke-dasharray", String(RING_LEN));
  arc.setAttribute("transform", "rotate(-90 60 60)");
  svg.appendChild(circle("ring-track"));
  svg.appendChild(arc);
  FocusUI.ring = arc;
  return svg;
}

// ---------- Starting, pausing, finishing ----------

function startFocus(taskId) {
  var task = findTask(taskId);
  if (!task) return;
  if (FocusRun && FocusRun.taskId !== taskId) {
    var other = findTask(FocusRun.taskId);
    var otherId = FocusRun.taskId;
    Dialog.open({
      title: "A timer is already going",
      body: el("p", null, "\"" + (other ? other.title.slice(0, 60) : "Another card") + "\" has a timer running. Switch to this one?"),
      buttons: [
        { label: "Switch", primary: true, onclick: function () { creditRun(FocusRun); FocusRun = null; stopTicker(); showFocus(taskId); } },
        { label: "Keep the other", onclick: function () { showFocus(otherId); } }
      ]
    });
    return;
  }
  showFocus(taskId);
}

function beginRun(taskId, mins) {
  var ms = mins * 60000;
  FocusRun = { taskId: taskId, totalMs: ms, endsAt: Date.now() + ms, remainingMs: ms, running: true, ended: false, spentMs: 0, segFrom: ms };
  ensureTicker();
  drawFocus("pause");
}

function pauseRun() {
  var run = FocusRun;
  if (!run || !run.running) return;
  bankSpent(run);
  run.remainingMs = remainingMs(run);
  run.running = false;
  run.endsAt = null;
  stopTicker();
  drawFocus("pause");
}

function resumeRun() {
  var run = FocusRun;
  if (!run || run.running || run.ended) return;
  run.endsAt = Date.now() + run.remainingMs;
  run.running = true;
  run.segFrom = run.remainingMs;
  ensureTicker();
  drawFocus("pause");
}

function moreTime() {
  var run = FocusRun;
  if (!run) return;
  // The minutes before the reset are kept.
  if (run.running) bankSpent(run);
  run.totalMs = 5 * 60000;
  run.remainingMs = run.totalMs;
  run.endsAt = Date.now() + run.totalMs;
  run.running = true;
  run.ended = false;
  run.segFrom = run.totalMs;
  ensureTicker();
  drawFocus("pause");
}

// Replace or Restore swaps the whole planner, so a running timer belongs to a planner that is gone.
// It just stops: no minutes on a card, no time record, no commit. Returns true when one was stopped.
function endFocusQuietly() {
  if (!FocusRun) return false;
  FocusRun = null;
  stopTicker();
  if (FocusUI && FocusUI.dlg) FocusUI.dlg.close();
  return true;
}

function stopRun() {
  if (FocusRun) creditRun(FocusRun);
  FocusRun = null;
  stopTicker();
  drawFocus("preset-25");
}

function finishFocusTask() {
  var task = focusTask();
  if (!task) return;
  // This run's minutes go on the card, then one time record with the card's total (Core.finishFocus).
  var run = runFor(task.id);
  var mins = run ? Core.spentMins(Core.focusSpentMs(run, Date.now())) : 0;
  var r = Core.finishFocus(App.state, task.id, mins);
  FocusRun = null;
  stopTicker();
  if (r.changed) keepPlace(FocusUI.place, function () { commit(r.state); });
  FocusUI.win = { message: Core.winMessage(Core.doneCount(App.state)) };
  drawFocus("back");
  confetti();
}

// Soft paper bits that drift down once. Skipped completely when less motion is asked for.
function confetti() {
  if (motionReduced() || !FocusUI) return;
  var tokens = ["var(--head)", "var(--accent)", "var(--muted)", "var(--border)"];
  var wrap = el("div", { className: "confetti", "aria-hidden": "true" });
  for (var i = 0; i < 26; i++) {
    var bit = el("span", { className: "confetti-bit" });
    bit.style.left = Math.round(Math.random() * 100) + "%";
    bit.style.background = tokens[i % tokens.length];
    bit.style.animationDelay = Math.round(Math.random() * 500) + "ms";
    bit.style.animationDuration = 1400 + Math.round(Math.random() * 900) + "ms";
    wrap.appendChild(bit);
  }
  FocusUI.body.appendChild(wrap);
  setTimeout(function () { wrap.remove(); }, 2600);
}

// ---------- Drawing ----------

function nextStepLine(task) {
  if (!task.steps.length) return el("p", { className: "next-step" }, "No steps yet. Begin with the smallest bit.");
  var step = Core.firstOpenStep(task);
  if (!step) return el("p", { className: "next-step" }, "Every step is ticked.");
  return el("div", { className: "next-step" }, [
    el("p", null, ["Next tiny step: ", el("strong", { dir: "auto" }, step.text)]),
    el("button", {
      type: "button",
      "data-fkey": "tick",
      onclick: function () {
        commit(Core.tickFirstStep(App.state, task.id));
        drawFocus("tick");
      }
    }, "Tick it off")
  ]);
}

function setupView(task) {
  var hint = el("p", { className: "hint", role: "status" });
  var custom = el("input", {
    type: "number",
    min: "1",
    max: String(Core.TIMER_MAX),
    step: "1",
    inputMode: "numeric",
    "aria-label": "Custom minutes",
    "data-fkey": "custom"
  });
  function startCustom() {
    var raw = custom.value;
    var mins = Core.clampTimerMins(raw);
    if (mins === null) {
      hint.className = "hint gentle";
      hint.textContent = "Pick a whole number of minutes, from 1 to " + Core.TIMER_MAX + ".";
      custom.focus();
      return;
    }
    beginRun(task.id, mins);
    if (Number(raw) > Core.TIMER_MAX) Toast.show("Set to " + Core.TIMER_MAX + " minutes, the longest focus.");
  }
  custom.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); startCustom(); }
  });
  return [
    el("p", { className: "focus-ask" }, "How long do you want to focus?"),
    el("div", { className: "presets" }, [10, 25, 45].map(function (m) {
      return el("button", {
        type: "button",
        className: m === 25 ? "primary" : "",
        "data-fkey": "preset-" + m,
        onclick: function () { beginRun(task.id, m); }
      }, m + " min");
    })),
    el("div", { className: "add-row custom-row" }, [
      el("label", { className: "custom-label" }, ["Custom ", custom, " min"]),
      el("button", { type: "button", onclick: startCustom }, "Start")
    ]),
    hint
  ];
}

function timerView(task, run) {
  var clock = el("span", { className: "clock", role: "timer" }, clockText(remainingMs(run)));
  FocusUI.clock = clock;
  var ring = el("div", { className: "ring-wrap" }, [ringSvg(run), clock]);
  paintClock(run);
  return [
    ring,
    run.running
      ? el("p", { className: "hint" }, "Gently does it. One thing at a time.")
      : el("p", { className: "hint", role: "status" }, "Paused. Your time is waiting."),
    el("div", { className: "focus-actions" }, [
      run.running
        ? el("button", { type: "button", "data-fkey": "pause", onclick: pauseRun }, "Pause")
        : el("button", { type: "button", "data-fkey": "pause", onclick: resumeRun }, "Resume"),
      el("button", { type: "button", className: "primary", "data-fkey": "done", onclick: finishFocusTask }, "Done"),
      el("button", { type: "button", "data-fkey": "stop", onclick: stopRun }, "Stop timer")
    ])
  ];
}

function endedView() {
  return [
    el("p", { className: "focus-end", role: "status" }, "Time is up. Nice focus."),
    el("div", { className: "focus-actions" }, [
      el("button", { type: "button", "data-fkey": "more", onclick: moreTime }, "Keep going 5 more minutes"),
      el("button", { type: "button", className: "primary", "data-fkey": "done", onclick: finishFocusTask }, "Done"),
      el("button", { type: "button", "data-fkey": "stop", onclick: stopRun }, "Stop")
    ])
  ];
}

function winView(task) {
  return [
    el("p", { className: "win", role: "status" }, FocusUI.win.message),
    el("p", { className: "hint", dir: "auto" }, "\"" + task.title.slice(0, 80) + "\" is done."),
    el("div", { className: "focus-actions" }, [
      el("button", { type: "button", className: "primary", "data-fkey": "back", onclick: function () { FocusUI.dlg.close(); } }, "Back to Today")
    ])
  ];
}

// Redraws the screen from the current state. focusKey names the control to focus afterwards
// (the one that had focus is used when it is still there).
function drawFocus(focusKey) {
  if (!FocusUI) return;
  var task = focusTask();
  if (!task) {
    FocusRun = null;
    stopTicker();
    FocusUI.dlg.close();
    return;
  }
  var had = document.activeElement && document.activeElement.getAttribute
    ? document.activeElement.getAttribute("data-fkey") : null;
  var body = FocusUI.body;
  body.textContent = "";
  FocusUI.clock = null;
  FocusUI.ring = null;
  var run = runFor(task.id);
  var parts;
  if (FocusUI.win) parts = winView(task);
  else if (!run) parts = setupView(task);
  else if (run.ended) parts = endedView();
  else parts = timerView(task, run);
  body.appendChild(el("p", { className: "focus-task", dir: "auto" }, task.title));
  parts.forEach(function (p) { body.appendChild(p); });
  if (!FocusUI.win) body.appendChild(nextStepLine(task));
  if (!FocusUI.win) {
    body.appendChild(el("div", { className: "focus-close" }, [
      el("button", { type: "button", "data-fkey": "close", onclick: function () { FocusUI.dlg.close(); } },
        run && !run.ended ? "Close, keep the timer going" : "Close")
    ]));
  }
  var want = body.querySelector('[data-fkey="' + (focusKey || had) + '"]');
  var target = want || body.querySelector("[data-fkey]");
  if (target) target.focus();
}

function showFocus(taskId) {
  var task = findTask(taskId);
  if (!task) return;
  var body = el("div", { className: "focus-body" });
  // The Today slot this card sits in. It stays still on screen when the card is finished, and gets the
  // focus back if the Start button is gone by then.
  var at = Core.focusSummary(App.state, Core.todayISO()).open.map(function (t) { return t.id; }).indexOf(taskId);
  var spot = at >= 0 ? at + 1 : 0;
  FocusUI = { dlg: null, body: body, taskId: taskId, win: null, ring: null, clock: null, place: spot ? "slots" : null };
  var ui = FocusUI;
  drawFocus();
  ui.dlg = Dialog.open({
    title: "Focus",
    className: "focus-screen",
    body: body,
    canDismissOutside: function () { return false; },
    onClose: function () {
      if (FocusUI === ui) FocusUI = null;
      // The timer keeps going when the screen is closed. Today shows Resume focus.
      if (App.view === "today") keepPlace(ui.place, render);
    },
    fallbackFocus: function () {
      return App.view === "today" && spot ? focusSlotSpot(spot) : false;
    }
  });
  // The dialog focuses the first field, which would be the custom box. Start on a calm choice instead.
  var calm = body.querySelector('[data-fkey="preset-25"]') || body.querySelector('[data-fkey="pause"]');
  if (calm) calm.focus();
}

// The Fresh day dialog (Soft Reset, Phase 7b). Asked once a day about cards picked on earlier days that are
// not finished. Nothing changes until a button says so. Esc, a click outside or a reload keep things as they are.

function openFreshDay(plan, today) {
  var ids = plan.items.map(function (it) { return it.task.id; });
  var rows = plan.items.slice(0, Core.FRESH_SHOWN).map(function (it) {
    return el("li", null, [el("span", { className: "fresh-title", dir: "auto" }, it.task.title)].concat(
      it.notes.map(function (n) { return el("span", { className: "fresh-note" }, n); })
    ));
  });
  var more = Core.freshMoreText(plan.items.length);
  Dialog.open({
    title: "Fresh day",
    className: "fresh",
    body: el("div", null, [
      el("p", null, Core.freshDayText(plan.items.length, plan.fromEarlier)),
      el("ul", { className: "fresh-list" }, rows),
      more ? el("p", { className: "hint" }, more) : null
    ]),
    buttons: [
      { label: Core.freshKeepLabel(plan.hasDoing), primary: true },
      { label: "Move to Later", onclick: function () { freshChoice(ids, "later", today); } },
      { label: "Bring to today", onclick: function () { freshChoice(ids, "today", today); } }
    ],
    // The button that had focus may be gone after the change. Focus then goes to the page, without scrolling.
    fallbackFocus: function () { Shell.main.focus({ preventScroll: true }); }
  });
}

// Runs a choice on the current state, so a card changed meanwhile is read as it is now.
function freshChoice(ids, choice, today) {
  var r = Core.applySoftReset(App.state, ids, choice, today);
  if (r.changed.length) commit(r.state);
  if (choice === "later" && !r.changed.length) return;
  var text = choice === "later" ? Core.laterMovedText(r.changed.length) : Core.bringTodayText(r.changed.length, r.waiting);
  Toast.show(text, r.undo ? { undo: function () { commit(Core.applySoftResetUndo(App.state, r.undo)); } } : {});
}

// The Length chooser of the Week block dialog (Edit a block and Schedule). One list built with Menu.select:
// "Custom..." first, then the extras slot, then every length from 15 minutes to 10 hours. Saved custom
// lengths (settings.customLengths) sit in order among them with a small x. The x removes the length from
// the list only: blocks that already have it are never touched, they show "Custom (N min)".
// "Custom..." opens a small box under the list (not a second dialog) with a live line such as
// "80 = 1 h 20 min" and an "Add to list" button. All the rules live in Core (checkCustomLength).
//
// LengthChooser.create({ minutes, getStart, getLimit, extras, onChange }) returns a node with
//   .mins (the chosen length, a number), .trigger (the button), .refresh() (check the box again)
// getStart() is the start time in minutes or null, getLimit() the latest end in minutes (22:00).
// extras: [{ label, onclick }] are rows that run onclick instead of choosing a length. Phase 6 puts
// "Use my real time" here, and its onclick calls .choose(mins).

var LengthChooser = {
  create: function (opts) {
    var extras = opts.extras || [];
    var box = null;
    var select = null;

    function saved() {
      return Core.cleanCustomLengths(App.state.settings.customLengths);
    }

    function removeSaved(mins) {
      setSetting("customLengths", Core.removeCustomLength(saved(), mins));
      select.setItems(lengthItems());
      weekToast("Removed " + mins + " min from your list.", function () {
        var r = Core.restoreCustomLength(App.state.settings.customLengths, mins);
        if (!r.ok) {
          weekToast(r.message);
          return;
        }
        setSetting("customLengths", r.list);
        select.setItems(lengthItems());
        weekToast(mins + " min is back in your list.");
      });
    }

    function lengthItems() {
      var mine = saved();
      var current = select ? +select.value : opts.minutes;
      var all = Core.PRESET_LENGTHS.concat(mine);
      var odd = all.indexOf(current) < 0;
      if (odd) all.push(current);
      all.sort(function (a, b) { return a - b; });
      var items = [{ label: "Custom...", action: openBox, divider: !extras.length }];
      extras.forEach(function (x, i) {
        items.push({ label: x.label, action: x.onclick, divider: i === extras.length - 1 });
      });
      all.forEach(function (n) {
        var item = { value: String(n), label: Core.lengthLabel(n, !odd || n !== current) };
        if (mine.indexOf(n) >= 0) {
          item.remove = { ariaLabel: "Remove " + n + " min", onremove: function () { removeSaved(n); } };
        }
        items.push(item);
      });
      return items;
    }

    // ---------- The Custom... box ----------

    var input = el("input", {
      type: "text",
      maxLength: 4,
      inputmode: "numeric",
      autocomplete: "off",
      "aria-describedby": "len-live"
    });
    var line = el("p", { className: "hint len-line" });
    var note = el("p", { className: "hint gentle len-note", hidden: true });
    var add = el("button", { type: "button", className: "primary", onclick: addToList }, "Add to list");
    var cancel = el("button", { type: "button", onclick: closeBox }, "Cancel");
    box = el("div", { className: "len-custom", role: "group", "aria-label": "Custom length", "data-esc-first": "", hidden: true }, [
      el("label", { className: "field" }, [el("span", null, "Minutes"), input]),
      el("div", { id: "len-live", role: "status", "aria-live": "polite" }, [line, note]),
      el("div", { className: "len-actions" }, [add, cancel])
    ]);

    function check() {
      return Core.checkCustomLength(input.value, opts.getStart(), opts.getLimit(), saved());
    }

    // The live line under the box. Nothing is said about an empty box or one still being typed.
    function update() {
      if (box.hidden) return;
      var r = check();
      line.textContent = input.value.trim() ? r.line : "Whole minutes, from 15 to 600.";
      note.textContent = input.value.trim() ? r.message : "";
      note.hidden = !note.textContent;
    }

    function openBox() {
      box.hidden = false;
      input.value = "";
      update();
      input.focus();
    }

    function closeBox() {
      box.hidden = true;
      select.trigger.focus();
    }

    function addToList() {
      var r = check();
      if (!r.ok) {
        update();
        input.focus();
        return;
      }
      var added = Core.addCustomLength(saved(), r.mins, opts.getStart(), opts.getLimit());
      setSetting("customLengths", added.list);
      select.value = String(r.mins);
      select.setItems(lengthItems());
      box.hidden = true;
      select.trigger.focus();
      weekToast(r.mins + " min is in your list.");
      if (opts.onChange) opts.onChange();
    }

    input.addEventListener("input", update);
    box.addEventListener("keydown", function (e) {
      if (e.key === "Escape") {
        e.preventDefault();
        e.stopPropagation();
        closeBox();
      } else if (e.key === "Enter" && e.target === input) {
        e.preventDefault();
        addToList();
      }
    });

    select = Menu.select({
      ariaLabel: "Length",
      items: [{ value: String(opts.minutes), label: Core.lengthLabel(opts.minutes, true) }],
      value: String(opts.minutes),
      onchange: function () { if (opts.onChange) setTimeout(opts.onChange, 0); }
    });
    select.setItems(lengthItems());

    var root = el("div", { className: "len-chooser" }, [select, box]);
    Object.defineProperty(root, "mins", { get: function () { return +select.value; } });
    root.trigger = select.trigger;
    root.refresh = update;
    // Sets the length from an extras row (Phase 6 "Use my real time"). A length not in the list shows as
    // "Custom (N min)". Nothing is saved until the dialog's Save.
    root.choose = function (mins) {
      select.value = String(mins);
      select.setItems(lengthItems());
      select.trigger.focus();
      if (opts.onChange) opts.onChange();
    };
    return root;
  }
};

// Month view: a 6 week grid with dots for cards that are due or have a block, and a day panel (side by
// side on wide screens, below the grid on a phone). It only reads the data. The ways to change something
// are the shared card dialog, the shared Quick add dialog (with a due date) and "Add an existing card",
// which sets a due date and nothing else.
// App.monthSel is the selected day, and the shown month is the month it is in (memory only).

var moScrollPending = false; // after a tap on a phone, the day heading is scrolled into view if it is off screen
var moJumpOpen = false; // the Choose month and year panel (memory only, rebuilt on every redraw)
var moJumpYear = null; // the year the panel shows
var moLastClick = null; // { date, at } of the last day click, for the double click (reset on a month change)
var MO_DOUBLE_MS = 400;

// The Month view shows years YEAR_MIN to YEAR_MAX only (Core.YEAR_MIN, Core.YEAR_MAX).
function monthDateAllowed(date) {
  var y = +date.slice(0, 4);
  return Core.clampYear(y) === y;
}

function selectDay(date, scroll) {
  App.monthSel = date;
  moScrollPending = !!scroll;
  render();
}

// A month change always closes the jump panel and forgets the last click.
function monthChanged() {
  moJumpOpen = false;
  moLastClick = null;
  moScrollPending = false;
}

// Previous or next month: the same day number (the last day of a shorter month, today in this month).
// Stops kindly at the year limits.
function shiftMonthView(n) {
  var r = Core.monthStep(App.monthSel, n, Core.todayISO());
  if (!r.moved) {
    Toast.show("That is as far as the calendar goes.", { ms: 4000, tapDismiss: true, coexist: true });
    return;
  }
  App.monthSel = r.date;
  monthChanged();
  render();
}

function goToThisMonth() {
  App.monthSel = Core.todayISO();
  monthChanged();
  render();
}

// Keys inside the grid only. A key that is not used here is left alone, so the page keeps it.
function monthKeys(e) {
  var date = App.monthSel;
  var focused = e.target && e.target.getAttribute ? e.target.getAttribute("data-key") : null;
  if (focused && focused.indexOf("day-") === 0) date = focused.slice(4);
  var target = null;
  if (e.key === "ArrowLeft") target = Core.addDays(date, -1);
  else if (e.key === "ArrowRight") target = Core.addDays(date, 1);
  else if (e.key === "ArrowUp") target = Core.addDays(date, -7);
  else if (e.key === "ArrowDown") target = Core.addDays(date, 7);
  else if (e.key === "PageUp" || e.key === "PageDown") {
    var step = Core.monthStep(date, e.key === "PageUp" ? -1 : 1, Core.todayISO());
    target = step.moved ? step.date : null;
  }
  if (!target || !Core.isValidISODate(target)) return;
  e.preventDefault();
  if (!monthDateAllowed(target)) return;
  var node = Shell.main.querySelector("[data-key='day-" + target + "']");
  if (node) {
    node.focus();
    return;
  }
  // Past the edge of the grid: a new month, with focus on the same day.
  App.monthSel = target;
  monthChanged();
  render();
  focusByKey("day-" + target);
}

// A click selects. Two clicks on the same date within 400 ms also open "Add an existing card". Detected
// here, not with the browser double click event: the first click redraws the view, so the second click lands on a new button.
function dayClicked(d) {
  if (!monthDateAllowed(d)) return; // the spill-over days of the first and last month
  var now = Date.now();
  if (moLastClick && moLastClick.date === d && now - moLastClick.at <= MO_DOUBLE_MS) {
    moLastClick = null;
    selectDay(d, false);
    openExistingTask(d);
    return;
  }
  moLastClick = { date: d, at: now };
  selectDay(d, phoneLayout());
}

function monthDayButton(d, today, counts, sel, inMonth) {
  var n = counts[d] || 0;
  var dots = Core.dotsFor(n);
  var kids = [];
  for (var i = 0; i < dots.shown; i++) kids.push(el("span", { className: "mo-dot" }));
  if (dots.more) kids.push(el("span", { className: "mo-more" }, "+" + dots.more));
  var label = Core.formatLongDate(d) + ", " + Core.taskCountText(n) + (d === today ? ", today" : "");
  return el("button", {
    type: "button",
    className: "mo-day" + (inMonth ? "" : " is-out") + (d === today ? " is-today" : "") +
      (d < today && inMonth ? " is-past" : "") + (d === sel ? " is-sel" : ""),
    "data-key": "day-" + d,
    tabindex: d === sel ? "0" : "-1",
    "aria-pressed": d === sel ? "true" : "false",
    "aria-current": d === today ? "date" : null,
    "aria-label": label,
    onclick: function () { dayClicked(d); }
  }, [
    el("span", { className: "mo-num" }, String(+d.slice(8))),
    el("span", { className: "mo-dots", "aria-hidden": "true" }, kids)
  ]);
}

function monthItem(it) {
  var t = it.task;
  var label = t.labelId ? findLabel(t.labelId) : null;
  var done = t.status === "done";
  var when = it.kind === "block" ? Core.blockSpanText(t) : "Due";
  var open = el("button", {
    type: "button",
    className: "mo-item" + (done ? " is-done" : ""),
    "data-key": "item-" + t.id,
    onclick: function () { openCardEdit(t.id); }
  }, [
    el("span", { className: "mo-when" }, when),
    el("span", { className: "mo-title" }, [label ? colorDot(label.color) : null, el("span", { dir: "auto" }, t.title)]),
    done ? el("span", { className: "mo-status" }, "Done") : null
  ]);

// Cards that are not done, have no due date and no block. Choosing one sets its due date to this day and
// nothing else (the card keeps its column, block, label, notes and steps). The Undo is toast only.
function openExistingTask(date) {
  var search = el("input", {
    type: "search",
    className: "mo-search",
    autocomplete: "off",
    dir: "auto",
    placeholder: "Search cards",
    "aria-label": "Search cards"
  });
  var note = el("p", { className: "hint", role: "status" });
  var list = el("div", { className: "mo-pick" });
  var current = { items: [], total: 0 };
  var dlg = null;

  function choose(id) {
    var r = Core.setDueOnly(App.state, id, date);
    if (!r.changed) {
      note.className = "hint gentle";
      note.textContent = "That card changed, so nothing was added.";
      draw();
      return;
    }
    commit(r.state);
    dlg.close();
    Toast.show("Due " + Core.formatShortDate(date) + ", added.", {
      undo: function () {
        var u = Core.applyDueUndo(App.state, r.undo);
        if (u.ok) commit(u.state);
        else {
          Toast.show(u.reason === "changed" ? "That card was changed again, so Undo left it alone."
            : "That card is gone, so there is nothing to undo.", { ms: 4000, tapDismiss: true, coexist: true });
        }
      }
    });
  }

  function draw() {
    current = Core.eligibleForDay(App.state, search.value);
    list.textContent = "";
    if (!current.total) {
      var any = Core.eligibleForDay(App.state, "").total;
      list.appendChild(any
        ? el("p", { className: "hint" }, "No cards match. Try fewer letters.")
        : el("p", { className: "mo-nothing" }, "Nothing to add. Every open card already has a day, or the board is empty."));
      return;
    }
    list.appendChild(el("ul", { className: "mo-list" }, current.items.map(function (t) { return existingRow(t, choose); })));
    if (current.total > current.items.length) {
      list.appendChild(el("p", { className: "hint" }, "Showing the first " + current.items.length + " of " + current.total + ". Type to narrow the list."));
    }
  }

  search.addEventListener("input", function () {
    note.textContent = "";
    note.className = "hint";
    draw();
  });
  // Enter picks the first card only when something is typed. An empty search does nothing.
  search.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    e.preventDefault();
    if (search.value.trim() && current.items.length) choose(current.items[0].id);
  });

  var body = el("div", null, [
    el("label", { className: "field" }, [el("span", null, "Which card goes on " + Core.formatLongDate(date) + "?"), search]),
    note,
    list
  ]);
  dlg = Dialog.open({
    title: "Add an existing card",
    body: body,
    buttons: [{ label: "Close" }]
  });
  draw();
  search.focus();
}

  moLastClick = null;
