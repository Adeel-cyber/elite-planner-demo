  }

  // The kind line for a full day (tooltip and screen readers). Never a warning.
  function fullDayText(load, settings, m) {
    var h = awakeHours(settings);
    return "About " + formatMins(load.mins) + (m > 1 ? " with your real time" : " planned") +
      ", more than your waking hours (" + h.start + " to " + h.end + "). Moving one thing could help.";
  }

  // The chart on the Today card: the newest 10 records the multiplier uses, oldest first.
  // title is null for a card that was deleted.
  function timeChart(state) {
    var pool = timePool(state.timeLog);
    return pool.slice(Math.max(0, pool.length - TIME_CHART)).map(function (e) {
      var i = findIndexById(state.tasks, e.taskId);
      return { taskId: e.taskId, title: i >= 0 ? state.tasks[i].title : null, estimate: e.estimate, actual: e.actual };
    });
  }

  // ---------- Migrate ----------

  // MIGRATIONS[n] takes a version n state and returns a version n+1 state.
  // Empty while we are on version 1. Each step must return a new object.
  var MIGRATIONS = {};

  function migrate(raw) {
    if (!isObj(raw)) return { ok: false, code: "shape", reason: MSG.notPlanner };
    var v = raw.schemaVersion;
    if (typeof v !== "number" || Math.floor(v) !== v || v < 1) {

    }
    if (v > SCHEMA_VERSION) return { ok: false, code: "newer", reason: MSG.newer };
    var s = Object.assign({}, raw);
    while (v < SCHEMA_VERSION) {
      if (!MIGRATIONS[v]) return { ok: false, code: "version", reason: MSG.version };
      s = MIGRATIONS[v](s);
      v += 1;
      s.schemaVersion = v;
    }
    return { ok: true, state: s };
  }

  // ---------- Sanitize (shared by load and import) ----------
  // Every object is rebuilt from a whitelist, so unknown fields are dropped.

  function makeCtx(now) {
    return { now: now, warnings: [], seen: Object.create(null) };
  }

  function warn(ctx, msg) {
    if (ctx.seen[msg]) return;
    ctx.seen[msg] = true;
    ctx.warnings.push(msg);
  }

  function wholeMins(v) {
    if (!isFiniteNum(v)) return null;
    var r = Math.round(v);
    return r >= 0 && r <= LIMITS.mins ? r : null;
  }

  // Settings added after the first release. Data saved before one of them existed is not damaged,
  // so a missing one is filled with its default and never counts as a repair or a warning.
  var ADDED_SETTINGS = ["weekRowSize", "customLengths", "awakeStart", "awakeEnd", "lastResetDay", "freshDay"];

  function withAddedSettings(settings) {
    if (!isObj(settings)) return settings;
    var d = defaultSettings();
    var out = settings;
    ADDED_SETTINGS.forEach(function (k) {
      if (has(out, k)) return;
      if (out === settings) out = Object.assign({}, settings);
      out[k] = d[k];
    });
    return out;
  }

  // Card fields added after the first release (Phase 7c). Same idea as ADDED_SETTINGS: a missing one is
  // filled quietly. laterAt of an old Later card is its createdAt, any other card gets null.
  var ADDED_TASK_FIELDS = ["laterAt", "archivedAt"];

  function withAddedTaskFields(t) {
    if (!isObj(t)) return t;
    var out = t;
    ADDED_TASK_FIELDS.forEach(function (k) {
      if (has(out, k)) return;
      if (out === t) out = Object.assign({}, t);
      out[k] = k === "laterAt" && t.status === "later" ? t.createdAt : null;
    });
    return out;
  }

  // A saved planner as it reads once the added settings, card fields and the old Gray spelling are filled in.
  // Only used to compare.
  function withAddedDefaults(obj) {
    if (!isObj(obj)) return obj;
    var out = obj;
    if (isObj(obj.settings)) {
      var settings = withAddedSettings(obj.settings);
      if (settings !== obj.settings) out = Object.assign({}, out, { settings: settings });
    }
    if (Array.isArray(obj.tasks)) {
      var changed = false;
      var tasks = obj.tasks.map(function (t) {
        var f = withAddedTaskFields(t);
        if (f !== t) changed = true;
        return f;
      });
      if (changed) out = Object.assign({}, out, { tasks: tasks });
    }
    // A label saved with the old Gray spelling is not a repair either.
    if (Array.isArray(obj.labels)) {
      var relabeled = false;
      var labels = obj.labels.map(function (l) {
        if (!isObj(l) || !isOldGray(l.color)) return l;
        relabeled = true;
        return Object.assign({}, l, { color: "Gray" });
      });
      if (relabeled) out = Object.assign({}, out, { labels: labels });
    }
    return out;
  }

  function sanitizeSettings(src, ctx) {
    var s = isObj(src) ? src : {};
    var d = defaultSettings();
    var out = {
      theme: THEMES.indexOf(s.theme) >= 0 ? s.theme : d.theme,
      fontScale: isFiniteNum(s.fontScale) ? clamp(s.fontScale, 0.85, 1.5) : d.fontScale,
      reduceMotion: s.reduceMotion === true,
      weekStart: WEEK_STARTS.indexOf(s.weekStart) >= 0 ? s.weekStart : d.weekStart,
      weekRowSize: typeof s.weekRowSize === "string" && has(WEEK_ROW_SIZES, s.weekRowSize) ? s.weekRowSize : d.weekRowSize,
      // Missing is the empty list. A list that is present but not valid is repaired and reported.
      customLengths: has(s, "customLengths") ? cleanCustomLengths(s.customLengths) : d.customLengths,
      awakeStart: d.awakeStart,
      awakeEnd: d.awakeEnd,
      lastResetDay: isValidISODate(s.lastResetDay) ? s.lastResetDay : null,
      // Only an explicit false turns the Fresh day check-in off. Missing is on (an old save or backup).
      freshDay: s.freshDay !== false,
      lastBackupAt: isValidStamp(s.lastBackupAt) ? s.lastBackupAt : null,
      backupReminderDays: isFiniteNum(s.backupReminderDays)
        ? clamp(Math.round(s.backupReminderDays), 0, LIMITS.reminderDays)
        : d.backupReminderDays,
      sound: s.sound === true
    };
    // Waking hours: two valid "HH:MM" times that are not the same, else the default pair. A missing one
    // (an old backup) is its default, so only a bad value is ever reported below.
    var wa = has(s, "awakeStart") ? s.awakeStart : d.awakeStart;
    var wb = has(s, "awakeEnd") ? s.awakeEnd : d.awakeEnd;
    if (isAwakeTime(wa) && isAwakeTime(wb) && wa !== wb) {
      out.awakeStart = wa;
      out.awakeEnd = wb;
    }
    // A missing added setting (an old backup) is fine, only a bad value is reported.
    if (!deepEqual(out, withAddedSettings(src))) warn(ctx, "Some settings were reset to their defaults.");
    return out;
  }

  // Same rules for a new label and an imported one, so a backup round trip changes nothing.
  function cleanLabel(item, id) {
    return {
      id: id,
      name: typeof item.name === "string" && item.name.trim() ? cut(item.name, LIMITS.labelName) : "Label",
      color: normalizeLabelColor(item.color)
    };
  }

  function sanitizeLabels(arr, ctx) {
    var labels = [];
    var ids = Object.create(null);
    arr.forEach(function (item) {
      if (!isObj(item)) {
        warn(ctx, "Some damaged labels were removed.");
        return;
      }
      var id = item.id;
      if (!isValidId(id) || ids[id]) {
        if (isValidId(id)) warn(ctx, "Some labels shared an id and were given new ones.");
        id = newId("l");
      }
      ids[id] = true;
      var label = cleanLabel(item, id);
      // Capital letters or a 3-digit hex are tidied quietly. Only real damage is reported.
      var asRead = Object.assign({}, item);
      if (readLabelColor(item.color)) asRead.color = label.color;
      if (!deepEqual(label, asRead)) warn(ctx, "Some label details were not valid and were fixed.");
      labels.push(label);
    });
    return { labels: labels, ids: ids };
  }

  function sanitizeSteps(arr, ctx, title) {
    if (!Array.isArray(arr)) return [];
    var out = [];
    var used = Object.create(null);
    for (var i = 0; i < arr.length; i++) {
      var s = arr[i];
      if (!isObj(s)) continue;
      if (out.length >= LIMITS.steps) {
        warn(ctx, "Some steps on \"" + cut(title, 40) + "\" were removed. A card can have up to 8 steps.");
        break;
      }
      var id = isValidId(s.id) && !used[s.id] ? s.id : newId("s");
      used[id] = true;
      out.push({
        id: id,
        text: typeof s.text === "string" ? cut(s.text, LIMITS.stepText) : "",
        done: s.done === true
      });
    }
    return out;
  }

  function sanitizeScheduled(v) {
    if (!isObj(v)) return null;
    if (!isValidISODate(v.date)) return null;
    if (typeof v.start !== "string" || !TIME_RE.test(v.start)) return null;
    if (!isFiniteNum(v.mins)) return null;
    var mins = Math.round(v.mins);
    if (mins < LIMITS.blockMin || mins > LIMITS.blockMax) return null;
    return { date: v.date, start: v.start, mins: mins };
  }

  function sanitizeTask(t, index, ctx, labelIds, usedIds) {
    if (!isObj(t)) {
      warn(ctx, "Some damaged cards were removed.");
      return null;
    }
    var id = t.id;
    if (!isValidId(id) || usedIds[id]) {
      if (isValidId(id)) warn(ctx, "Some cards shared an id and were given new ones.");
      id = newId("t");
    }
    usedIds[id] = true;
    var title = typeof t.title === "string" && t.title.trim() ? cut(t.title, LIMITS.title) : "Untitled card";
    var notes = typeof t.notes === "string" ? t.notes : "";
    if (notes.length > NOTES_MAX) {
      notes = cut(notes, NOTES_MAX);
      warn(ctx, "Notes on \"" + cut(title, 40) + "\" were very long and were shortened.");
    }
    var task = {
      id: id,
      title: title,
      notes: notes,
      status: STATUSES.indexOf(t.status) >= 0 ? t.status : "todo",
      // labelIds is null when the caller checks labels itself (createTask).
      labelId: isValidId(t.labelId) && (!labelIds || labelIds[t.labelId]) ? t.labelId : null,
      steps: sanitizeSteps(t.steps, ctx, title),
      due: isValidISODate(t.due) ? t.due : null,
      scheduled: sanitizeScheduled(t.scheduled),
      cost: COSTS.indexOf(t.cost) >= 0 ? t.cost : DEFAULT_COST,
      estimateMins: wholeMins(t.estimateMins),
      actualMins: wholeMins(t.actualMins),
      order: isFiniteNum(t.order) ? t.order : index,
      createdAt: isValidStamp(t.createdAt) ? t.createdAt : nowStamp(ctx.now),
      doneAt: isValidStamp(t.doneAt) ? t.doneAt : null,
      laterAt: null,
      archivedAt: null
    };
    // Both are kept only on a Later card. A Later card always has a laterAt (its createdAt if none is known).
    if (task.status === "later") {
      task.laterAt = isValidStamp(t.laterAt) ? t.laterAt : task.createdAt;
      task.archivedAt = isValidStamp(t.archivedAt) ? t.archivedAt : null;
    }
    // A missing added field (an old backup) is fine, only a bad value is reported.
    if (!deepEqual(task, withAddedTaskFields(t))) warn(ctx, "Some card details were not valid and were fixed.");
    return task;
  }

  function sanitizeDays(obj, ctx, taskIds) {
    var out = {};
    if (!isObj(obj)) return out;
    Object.keys(obj).forEach(function (key) {
      var v = obj[key];
      // The date check also blocks keys like "__proto__".
      if (!isValidISODate(key) || !isObj(v)) {
        warn(ctx, "Some damaged day plans were removed.");
        return;
      }
      var focus = [];
      if (Array.isArray(v.focusIds)) {
        v.focusIds.forEach(function (fid) {
          if (typeof fid === "string" && taskIds[fid] && focus.indexOf(fid) < 0 &&
            focus.length < LIMITS.focusHistory) focus.push(fid);
        });
      }
      var day = {
        battery: BATTERIES.indexOf(v.battery) >= 0 ? v.battery : DEFAULT_BATTERY,
        focusIds: focus
      };
      // Picked battery (Phase 7a). Absent means not picked, so old data needs no repair.
      if (v.batterySet === true) day.batterySet = true;
      if (!deepEqual(day, v)) warn(ctx, "Some day plans were not valid and were fixed.");
      out[key] = day;
    });
    return out;
  }

  function byAt(a, b) {
    return Date.parse(a.at) - Date.parse(b.at);
  }

  function sanitizeTimeLog(arr, ctx) {
    if (!Array.isArray(arr)) return [];
    var out = [];
    arr.forEach(function (e) {
      if (isObj(e) && isValidId(e.taskId) && isFiniteNum(e.estimate) && e.estimate > 0 &&
        isFiniteNum(e.actual) && e.actual > 0 && isValidStamp(e.at)) {
        out.push({ taskId: e.taskId, estimate: e.estimate, actual: e.actual, at: e.at });
      } else {
        warn(ctx, "Some damaged time records were removed.");
      }
    });
    out.sort(byAt);
    if (out.length > LIMITS.timeLog) out = out.slice(out.length - LIMITS.timeLog);
    return out;
  }

  // Returns { state, warnings }. Never throws, whatever it is given.
  function sanitizeState(obj, now) {
    var ctx = makeCtx(now);
    var src = isObj(obj) ? obj : {};
    var lab = sanitizeLabels(Array.isArray(src.labels) ? src.labels : [], ctx);
    var taskIds = Object.create(null);
    var tasks = [];
    (Array.isArray(src.tasks) ? src.tasks : []).forEach(function (t, i) {
      var clean = sanitizeTask(t, i, ctx, lab.ids, taskIds);
      if (clean) tasks.push(clean);
    });
    var createdAt = isValidStamp(src.createdAt) ? src.createdAt : nowStamp(now);
    var state = {
      app: APP_ID,
      schemaVersion: SCHEMA_VERSION,
      createdAt: createdAt,
      updatedAt: isValidStamp(src.updatedAt) ? src.updatedAt : createdAt,
      settings: sanitizeSettings(src.settings, ctx),
      labels: lab.labels,
      tasks: tasks,
      days: sanitizeDays(src.days, ctx, taskIds),
      timeLog: sanitizeTimeLog(src.timeLog, ctx)
    };
    return { state: state, warnings: ctx.warnings };
  }

  // ---------- Import ----------

  function reject(reason) {
    return { ok: false, reason: reason };
  }

  // Accepts the file text (or an already parsed object).
  // Returns { ok:true, state, warnings, summary } or { ok:false, reason }.
  function validateImport(input, now) {
    var obj = input;
    if (typeof input === "string") {
      if (input.length > LIMITS.importChars) return reject(MSG.tooBig);
      // Drop a byte order mark that some editors add at the start.
      var text = input.charCodeAt(0) === 0xfeff ? input.slice(1) : input;
      if (!text.trim()) return reject(MSG.unreadable);
      try {
        obj = JSON.parse(text);
      } catch (e) {
        return reject(MSG.unreadable);
      }
    }
    if (!isObj(obj)) return reject(MSG.notPlanner);
    if (obj.app !== APP_ID) return reject(MSG.otherApp);
    var mig = migrate(obj);
    if (!mig.ok) return reject(mig.reason);
    var s = mig.state;
    if (!has(s, "tasks") && !has(s, "labels") && !has(s, "days")) return reject(MSG.noData);
    if (has(s, "tasks") && !Array.isArray(s.tasks)) return reject(MSG.badTasks);
    if (has(s, "labels") && !Array.isArray(s.labels)) return reject(MSG.badLabels);
    if (has(s, "days") && !isObj(s.days)) return reject(MSG.badDays);

    var warnings = [];
    if (!has(s, "tasks")) warnings.push("No cards were found in this file.");
    if (!has(s, "labels")) warnings.push("No labels were found in this file.");
    if (!has(s, "days")) warnings.push("No day plans were found in this file.");
    var clean = sanitizeState(s, now);
    return {
      ok: true,
      state: clean.state,
      warnings: warnings.concat(clean.warnings),
      summary: {
        tasks: clean.state.tasks.length,
        labels: clean.state.labels.length,
        days: Object.keys(clean.state.days).length
      }
    };
  }

  // ---------- Storage ----------

  function memoryStorage() {
    var data = Object.create(null);
    return {
      getItem: function (k) { return k in data ? data[k] : null; },
      setItem: function (k, v) { data[k] = String(v); },
      removeItem: function (k) { delete data[k]; }
    };
  }

  function isQuotaError(e) {
    return !!e && (e.name === "QuotaExceededError" || e.name === "NS_ERROR_DOM_QUOTA_REACHED" ||
      e.code === 22 || e.code === 1014);
  }

  function storageFail(e) {
    return isQuotaError(e)
      ? { ok: false, code: "full", reason: MSG.full }
      : { ok: false, code: "blocked", reason: MSG.blocked };
  }

  // Copy slot n (1 to LIMITS.recoveredSlots). Slot 1 is the key an older build wrote, so its copy is found too.
  function recoveredKey(n) {
    return n === 1 ? KEYS.recovered : KEYS.recovered + "." + n;
  }

  function validSlot(n) {
    return n === Math.floor(n) && n >= 1 && n <= LIMITS.recoveredSlots;
  }

  // storage is window.localStorage, or null when the browser blocks it (then data lives in memory).
  function createStore(storage) {
    var backend = storage || memoryStorage();
    var store = {
      persistent: !!storage,
      locked: null, // reason text when saving is switched off for this session
      lastRaw: null // what this tab last loaded or saved, to spot other tabs
    };

    function read(key) {
      var v = backend.getItem(key);
      return v === undefined ? null : v;
    }

    // Keeps the original text before anything is changed or dropped. kind: "unreadable" or "repaired".
    // With no room for the copy nothing on disk changes and saving is locked, and raw comes back so the
    // person can still download it from memory.
    function recover(raw, clean, now, kind) {
      var state = clean ? clean.state : createEmptyState(now);
      var warnings = clean ? clean.warnings : [];
      var kept = store.keepRecovered(raw, kind, now);
      if (!kept.ok) {
        store.locked = MSG.noRoomForCopy;
        return { state: state, status: "locked", message: MSG.noRoomForCopy, warnings: warnings, kind: kind, raw: raw };
      }
      return {
        state: state,
        status: "recovered",
        message: kind === "repaired" ? MSG.repairedStored : MSG.unreadableStored,
        warnings: warnings,
        kind: kind,
        slot: kept.slot
      };
    }

    // The info key as an object. Missing or bad info is {}: every copy then counts as not downloaded.
    function readInfo() {
      try {
        var o = JSON.parse(read(KEYS.recoveredInfo));
        return isObj(o) ? o : {};
      } catch (e) {
        return {};
      }
    }

    // Read fresh before each write, so two tabs never wipe each other's entries. Best effort only.
    function changeInfo(fn) {
      try {
        var info = readInfo();
        fn(info);
        backend.setItem(KEYS.recoveredInfo, JSON.stringify(info));
        return true;
      } catch (e) {
        return false;
      }
    }

    // Puts raw in a copy slot and returns { ok, slot, reused } or { ok:false, code }. A slot that holds
    // anything is never written. The same text again (a reload, a second tab) reuses its slot.
    store.keepRecovered = function (raw, kind, now) {
      var n;
      try {
        for (n = 1; n <= LIMITS.recoveredSlots; n++) {
          if (read(recoveredKey(n)) === raw) return { ok: true, slot: n, reused: true };
        }
        for (n = 1; n <= LIMITS.recoveredSlots; n++) {
          if (read(recoveredKey(n)) !== null) continue;
          backend.setItem(recoveredKey(n), raw);
          // Read back: another tab may have taken this slot at the same moment.
          if (read(recoveredKey(n)) === raw) break;
        }
      } catch (e) {
        return { ok: false, code: isQuotaError(e) ? "full" : "blocked" };
      }
      if (n > LIMITS.recoveredSlots) return { ok: false, code: "slots" };
      var slot = n;
      changeInfo(function (info) {
        info[slot] = { keptAt: nowStamp(now), kind: kind === "repaired" ? "repaired" : "unreadable", downloadedAt: null };
      });
      return { ok: true, slot: slot, reused: false };
    };

    // [{ slot, chars, keptAt, kind, downloadedAt }], oldest first (an unknown date first). The UI keeps
    // this list and reads it again only after a change, so a big copy is not read on every redraw.
    store.listRecovered = function () {
      var info = readInfo();
      var out = [];
      for (var n = 1; n <= LIMITS.recoveredSlots; n++) {
        var raw;
        try {
          raw = read(recoveredKey(n));
        } catch (e) {
          return out;
        }
        if (raw === null) continue;
        var e = isObj(info[n]) ? info[n] : {};
        out.push({
          slot: n,
          chars: raw.length,
          keptAt: isValidStamp(e.keptAt) ? e.keptAt : null,
          kind: e.kind === "repaired" || e.kind === "unreadable" ? e.kind : null,
          downloadedAt: isValidStamp(e.downloadedAt) ? e.downloadedAt : null
        });
      }
      return out.sort(function (a, b) {
        var ta = a.keptAt ? Date.parse(a.keptAt) : -Infinity;
        var tb = b.keptAt ? Date.parse(b.keptAt) : -Infinity;
        return ta === tb ? a.slot - b.slot : ta < tb ? -1 : 1;
      });
    };

    // The copy exactly as kept, or null when it is gone (another tab removed it).
    store.readRecoveredSlot = function (n) {
      if (!validSlot(n)) return null;
      try {
        return read(recoveredKey(n));
      } catch (e) {
        return null;
      }
    };

    // Returns { ok }. ok false (storage full) means the mark lives only in memory for this session.
    store.markRecoveredDownloaded = function (n, now) {
      if (!validSlot(n)) return { ok: false };
      return {
        ok: changeInfo(function (info) {
          var e = isObj(info[n]) ? info[n] : { keptAt: null, kind: null };
          info[n] = Object.assign({}, e, { downloadedAt: nowStamp(now) });
        })
      };
    };

    // Only ever called from the person's own confirm. Nothing removes a copy by itself.
    store.removeRecovered = function (n) {
      if (!validSlot(n)) return { ok: false };
      try {
        backend.removeItem(recoveredKey(n));
      } catch (e) {
        return { ok: false };
      }
      changeInfo(function (info) { delete info[n]; });
      return { ok: true };
    };

    // Returns { state, status, message, warnings }.
    // status: new, ok, recovered, newer, locked, blocked.
    store.load = function (now) {
      var raw;
      try {
        raw = read(KEYS.state);
      } catch (e) {
        backend = memoryStorage();
        store.persistent = false;
        return { state: createEmptyState(now), status: "blocked", message: MSG.blocked, warnings: [] };
      }
      store.lastRaw = raw;
      if (raw === null) return { state: createEmptyState(now), status: "new", message: "", warnings: [] };

      var parsed;
      try {
        parsed = JSON.parse(raw);
      } catch (e) {
        parsed = null;
      }
      if (!isObj(parsed) || parsed.app !== APP_ID) return recover(raw, null, now, "unreadable");

      var mig = migrate(parsed);
      if (!mig.ok && mig.code === "newer") {
        store.locked = MSG.newerStored;
        return { state: sanitizeState(parsed, now).state, status: "newer", message: MSG.newerStored, warnings: [] };
      }
      if (!mig.ok) return recover(raw, null, now, "unreadable");

      var clean = sanitizeState(mig.state, now);
      // Data saved before a setting existed is not a repair: compare with the new defaults filled in.
      if (deepEqual(withAddedDefaults(parsed), clean.state)) {
        return { state: clean.state, status: "ok", message: "", warnings: [] };
      }
      return recover(raw, clean, now, "repaired");
    };

    // Returns null when saving is allowed, else { ok:false, code, reason }.
    // Storage must still hold what this tab last loaded or saved, or another tab changed it.
    store.check = function () {
      if (store.locked) return { ok: false, code: "locked", reason: store.locked };
      var current;
      try {
        current = read(KEYS.state);
      } catch (e) {
        return storageFail(e);
      }
      if (current !== store.lastRaw) {
        store.locked = MSG.conflict;
        return { ok: false, code: "conflict", reason: MSG.conflict };
      }
      return null;
    };

    // Returns { ok:true, state } (state has the new updatedAt) or { ok:false, code, reason }.
    store.save = function (state, now) {
      var blocked = store.check();
      if (blocked) return blocked;
      var next = Object.assign({}, state, { updatedAt: nowStamp(now) });
      var raw = JSON.stringify(next);
      try {
        backend.setItem(KEYS.state, raw);
      } catch (e) {
        return storageFail(e);
      }
      store.lastRaw = raw;
      return { ok: true, state: next };
    };

    store.saveSafetyCopy = function (state, now) {
      try {
        backend.setItem(KEYS.safety, JSON.stringify({ savedAt: nowStamp(now), state: state }));
        return { ok: true };
      } catch (e) {
        return storageFail(e);
      }
    };

    // The safety copy exactly as stored (or null), so Restore can put it back byte for byte if it fails.
    store.readSafetyRaw = function () {
      try {
        return read(KEYS.safety);
      } catch (e) {
        return null;
      }
    };

    store.writeSafetyRaw = function (raw) {
      try {
        if (raw === null) backend.removeItem(KEYS.safety);
        else backend.setItem(KEYS.safety, raw);
        return { ok: true };
      } catch (e) {
        return storageFail(e);
      }
    };

    // Returns { savedAt, state } or null.
    store.readSafetyCopy = function () {
      try {
        var raw = read(KEYS.safety);
        if (!raw) return null;
        var o = JSON.parse(raw);
        if (!isObj(o) || !isObj(o.state)) return null;
        return { savedAt: isValidStamp(o.savedAt) ? o.savedAt : null, state: o.state };
      } catch (e) {
        return null;
      }
    };

    return store;
  }

  // ---------- Undo ----------

  function undoEntry(type, label, now, payload) {
    return { type: type, label: label, at: nowStamp(now), payload: payload };
  }

  // Newest first, keeps the last `limit` entries. Memory only.
  function createUndoStack(limit) {
    var max = limit || LIMITS.undo;
    var items = [];
    return {
      push: function (entry) {
        items.unshift(entry);
        if (items.length > max) items.length = max;
      },
      pop: function () { return items.shift() || null; },
      peek: function () { return items[0] || null; },
      size: function () { return items.length; },
      clear: function () { items = []; }
    };
  }

  // Returns { state, undo }. undo is null when the task was not found.
  function deleteTask(state, id, now) {
    var index = findIndexById(state.tasks, id);
    if (index < 0) return { state: state, undo: null };
    var task = state.tasks[index];
    var focusRefs = [];
    var days = {};
    Object.keys(state.days).forEach(function (date) {
      var day = state.days[date];
      var pos = day.focusIds.indexOf(id);
      if (pos < 0) {
        days[date] = day;
        return;
      }
      focusRefs.push({ date: date, index: pos });
      days[date] = Object.assign({}, day, {
        focusIds: day.focusIds.filter(function (f) { return f !== id; })
      });
    });
    var tasks = state.tasks.slice();
    tasks.splice(index, 1);
    return {
      state: Object.assign({}, state, { tasks: tasks, days: days }),
      undo: undoEntry("deleteTask", "Deleted card \"" + cut(task.title, 40) + "\"", now,
        { task: task, index: index, focusRefs: focusRefs })
    };
  }

  // Tasks that used the label keep existing, with no label. Returns { state, undo }.
  function deleteLabel(state, id, now) {
    var index = findIndexById(state.labels, id);
    if (index < 0) return { state: state, undo: null };
    var label = state.labels[index];
    var taskIds = [];
    var tasks = state.tasks.map(function (t) {
      if (t.labelId !== id) return t;
      taskIds.push(t.id);
      return Object.assign({}, t, { labelId: null });
    });
    var labels = state.labels.slice();
    labels.splice(index, 1);
    return {
      state: Object.assign({}, state, { labels: labels, tasks: tasks }),
      undo: undoEntry("deleteLabel", "Deleted label \"" + label.name + "\"", now,
        { label: label, index: index, taskIds: taskIds })
    };
  }

  function applyUndo(state, entry) {
    if (!entry || !isObj(entry.payload)) return state;
    var p = entry.payload;

    if (entry.type === "replace") return p.previous;

    if (entry.type === "deleteTask") {
      var task = Object.assign({}, p.task);
      if (findIndexById(state.tasks, task.id) >= 0) task.id = newId("t");
      if (task.labelId && findIndexById(state.labels, task.labelId) < 0) task.labelId = null;
      var tasks = state.tasks.slice();
      tasks.splice(Math.min(p.index, tasks.length), 0, task);
      var days = Object.assign({}, state.days);
      p.focusRefs.forEach(function (ref) {
        var day = days[ref.date] || { battery: DEFAULT_BATTERY, focusIds: [] };
        if (day.focusIds.length >= LIMITS.focusHistory) return;
        var focus = day.focusIds.slice();
        focus.splice(Math.min(ref.index, focus.length), 0, task.id);
        days[ref.date] = Object.assign({}, day, { focusIds: focus });
      });
      return Object.assign({}, state, { tasks: tasks, days: days });
    }

    if (entry.type === "deleteLabel") {
      var label = Object.assign({}, p.label);
      if (findIndexById(state.labels, label.id) >= 0) label.id = newId("l");
      var labels = state.labels.slice();
      labels.splice(Math.min(p.index, labels.length), 0, label);
      var relink = Object.create(null);
      p.taskIds.forEach(function (id) { relink[id] = true; });
      var relinked = state.tasks.map(function (t) {
        // Only tasks still without a label, so a newer choice is never overwritten.
        return relink[t.id] && t.labelId === null ? Object.assign({}, t, { labelId: label.id }) : t;
      });
      return Object.assign({}, state, { labels: labels, tasks: relinked });
    }

    return state;
  }

  // Undo for Quick add (L7). Removes the card only while it is still the card that was added (a move
  // changes only its order, which does not count). A card that was edited is left alone, and a card that
  // is already gone is not an error. Returns { state, ok, reason } with reason "" | "changed" | "gone".
  function undoQuickAdd(state, added) {
    var index = isObj(added) ? findIndexById(state.tasks, added.id) : -1;
    if (index < 0) return { state: state, ok: false, reason: "gone" };
    if (!sameTask(state.tasks[index], added)) return { state: state, ok: false, reason: "changed" };
    var tasks = state.tasks.slice();
    tasks.splice(index, 1);
    return { state: Object.assign({}, state, { tasks: tasks }), ok: true, reason: "" };
  }

  // ---------- Merge and Replace ----------

  // Order, laterAt and archivedAt do not make a card different, so merging an older backup never brings an
  // archived card back as a copy. The current card wins, as always.
  function sameTask(a, b) {
    var skip = { order: 0, laterAt: null, archivedAt: null };
    return deepEqual(Object.assign({}, a, skip), Object.assign({}, b, skip));
  }

  // Adds incoming data to current. Nothing in current is removed or changed.
  // Both states must already be sanitized. Returns { state, report }.
  // report: added (new tasks), alreadyHere (identical, skipped), copies (same id but
  // different content, kept with a new id). Each task is counted in exactly one of them.
  function mergeStates(current, incoming) {
    var report = { added: 0, alreadyHere: 0, copies: 0, labelsAdded: 0, labelsMapped: 0 };

    // Labels: same name (any case) means the same label.
    var labels = current.labels.slice();
    var labelIds = Object.create(null);
    var byName = Object.create(null);
    var labelMap = Object.create(null);
    labels.forEach(function (l) {
      labelIds[l.id] = true;
      var key = l.name.trim().toLowerCase();
      if (!byName[key]) byName[key] = l.id;
    });
    incoming.labels.forEach(function (l) {
      var key = l.name.trim().toLowerCase();
      if (byName[key]) {
        labelMap[l.id] = byName[key];
        report.labelsMapped++;
        return;
      }
      var id = labelIds[l.id] ? newId("l") : l.id;
      labels.push({ id: id, name: l.name, color: normalizeLabelColor(l.color) });
      labelIds[id] = true;
      byName[key] = id;
      labelMap[l.id] = id;
      report.labelsAdded++;
    });

    // Tasks: identical ones are skipped, a clash with different content keeps both.
    var tasks = current.tasks.slice();
    var byId = Object.create(null);
    var taskMap = Object.create(null);
    var maxOrder = Object.create(null);
    STATUSES.forEach(function (s) { maxOrder[s] = -1; });
    tasks.forEach(function (t) {
      byId[t.id] = t;
      if (t.order > maxOrder[t.status]) maxOrder[t.status] = t.order;
    });
    incoming.tasks.slice().sort(function (a, b) { return a.order - b.order; }).forEach(function (t) {
      var copy = Object.assign({}, t, { labelId: t.labelId ? labelMap[t.labelId] || null : null });
      var existing = byId[t.id];
      if (existing && sameTask(existing, copy)) {
        taskMap[t.id] = t.id;
        report.alreadyHere++;
        return;
      }
      if (existing) {
        // A sample card keeps its demo- prefix, so Clear sample data still finds the copy.
        copy.id = newId(isSampleTask(t) ? SAMPLE_PREFIX + "t" : "t");
        report.copies++;
      } else {
        report.added++;
      }
      maxOrder[copy.status] += 1;
      copy.order = maxOrder[copy.status];
      tasks.push(copy);
      byId[copy.id] = copy;
      taskMap[t.id] = copy.id;
    });

    // Days: focus lists are combined. A picked battery wins over one that was not picked,
    // and when both were picked the current one wins.
    var days = Object.assign({}, current.days);
    Object.keys(incoming.days).forEach(function (date) {
      var inc = incoming.days[date];
      var mapped = inc.focusIds.map(function (id) { return taskMap[id]; }).filter(Boolean);
      var cur = days[date];
      if (!cur) {
        days[date] = { battery: inc.battery, focusIds: mapped.slice(0, LIMITS.focusHistory) };
        if (inc.batterySet === true) days[date].batterySet = true;
        return;
      }
      var focus = cur.focusIds.slice();
      mapped.forEach(function (id) {
        if (focus.indexOf(id) < 0 && focus.length < LIMITS.focusHistory) focus.push(id);
      });
      var takeInc = inc.batterySet === true && cur.batterySet !== true;
      days[date] = { battery: takeInc ? inc.battery : cur.battery, focusIds: focus };
      if (cur.batterySet === true || inc.batterySet === true) days[date].batterySet = true;
    });

    // Time log: combined, exact repeats removed, newest 50 kept.
    var seen = Object.create(null);
    var log = [];
    current.timeLog.concat(incoming.timeLog.map(function (e) {
      return Object.assign({}, e, { taskId: taskMap[e.taskId] || e.taskId });
    })).forEach(function (e) {
      var key = e.taskId + "|" + e.estimate + "|" + e.actual + "|" + e.at;
      if (seen[key]) return;
      seen[key] = true;
      log.push(e);
    });
    log.sort(byAt);
    if (log.length > LIMITS.timeLog) log = log.slice(log.length - LIMITS.timeLog);

    return {
      state: Object.assign({}, current, { labels: labels, tasks: tasks, days: days, timeLog: log }),
      report: report
    };
  }

  // Safety copy first, then save. Only counts as done once the new state is saved.
  // Returns { ok:true, state, undo } or { ok:false, state: current, reason }.
  function replaceState(store, current, incoming, now) {
    var blocked = store.check();
    if (blocked) return { ok: false, state: current, reason: blocked.reason };
    var safe = store.saveSafetyCopy(current, now);
    if (!safe.ok) return { ok: false, state: current, reason: MSG.safetyFailed };
    var saved = store.save(incoming, now);
    if (!saved.ok) {
      var reason = saved.code === "full" || saved.code === "blocked"
        ? MSG.replaceFailed + " " + saved.reason
        : saved.reason;
      return { ok: false, state: current, reason: reason };
    }
    return {
      ok: true,
      state: saved.state,
      undo: undoEntry("replace", "Replaced with imported data", now, { previous: current })
    };
  }

  // Puts the safety copy back. It is a swap: the current planner becomes the new safety copy first, so
  // nothing is ever left without a copy. Only one safety copy is kept. If the current planner cannot be
  // copied, nothing changes. If the restored planner cannot be saved, the old safety copy is written back
  // exactly as it was. Like Replace, lastResetDay becomes today (see prepareReplace).
  function restoreSafetyCopy(store, current, now) {
    var blocked = store.check();
    if (blocked) return { ok: false, state: current, reason: blocked.reason };
    var raw = store.readSafetyRaw();
    var copy = store.readSafetyCopy();
    if (!copy) return { ok: false, state: current, reason: MSG.noSafety };
    var v = validateImport(copy.state, now);
    if (!v.ok) return { ok: false, state: current, reason: v.reason };
    var safe = store.saveSafetyCopy(current, now);
    if (!safe.ok) return { ok: false, state: current, reason: MSG.safetyFailed };
    var saved = store.save(prepareReplace(v.state, current, todayISO(now)), now);
    if (!saved.ok) {
      store.writeSafetyRaw(raw);
      var reason = saved.code === "full" || saved.code === "blocked"
        ? MSG.restoreFailed + " " + saved.reason
        : saved.reason;
      return { ok: false, state: current, reason: reason };
    }
    return {
      ok: true,
      state: saved.state,
      savedAt: copy.savedAt,
      undo: undoEntry("replace", "Restored the safety copy", now, { previous: current })
    };
  }

  // ---------- Export and backup reminder ----------

  function exportJSON(state, now) {
    return {
      filename: "eliteplanner-backup-" + todayISO(now) + ".json",
      text: JSON.stringify(state, null, 2)
    };
  }

  function markBackedUp(state, now) {
    return Object.assign({}, state, {
      settings: Object.assign({}, state.settings, { lastBackupAt: nowStamp(now) })
    });
  }

  // Whole days since the last export, or null if never.
  function daysSinceBackup(state, today) {
    var last = state.settings.lastBackupAt;
    if (!last) return null;
    return diffDays(dateOfStamp(last), today || todayISO());
  }

  // Never backed up: due once the planner itself is that many days old. 0 days means off.
  function isBackupDue(state, today) {
    var every = state.settings.backupReminderDays;
    if (!every) return false;
    var day = today || todayISO();
    var since = daysSinceBackup(state, day);
    if (since === null) since = diffDays(dateOfStamp(state.createdAt), day);
    return since >= every;
  }

  // ---------- Backup card (Phase 8a) ----------

  function countText(n, one, many) {
    return n + " " + (n === 1 ? one : many);
  }

  // What a planner (or a backup file) holds. Archived cards are counted inside cards.
  function plannerCounts(state) {
    var archived = 0;
    state.tasks.forEach(function (t) { if (isArchived(t)) archived++; });
    return {
      cards: state.tasks.length,
      archived: archived,
      labels: state.labels.length,
      days: Object.keys(state.days).length,
      timeRecords: state.timeLog.length
    };
  }

  // "42 cards (3 archived), 4 labels, 20 planned days, 12 time records"
  function countsText(c) {
    return cardsText(c.cards) + (c.archived ? " (" + c.archived + " archived)" : "") + ", " +
      countText(c.labels, "label", "labels") + ", " +
      countText(c.days, "planned day", "planned days") + ", " +
      countText(c.timeRecords, "time record", "time records");
  }

  // A backup stamp in the future (the clock was set back) reads as today.
  function backupStatusText(state, today) {
    var since = daysSinceBackup(state, today);
    if (since === null) return "No backup yet.";
    if (since <= 0) return "Last backup: today.";
    if (since === 1) return "Last backup: yesterday.";
    return "Last backup: " + since + " days ago (" + formatShortDate(dateOfStamp(state.settings.lastBackupAt)) + ").";
  }

  // "24 Oct, 14:05" for a stamp, in this device's time zone. "" when the stamp is not valid.
  function stampText(stamp) {
    if (!isValidStamp(stamp)) return "";
    var d = new Date(stamp);
    return formatShortDate(toISODate(d)) + ", " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  // "From 21 Oct 2026." for an imported file (its last save), "" when it has no valid stamp.
  function fileDateText(state) {
    if (!isValidStamp(state.updatedAt)) return "";
    var day = dateOfStamp(state.updatedAt);
    return "From " + formatShortDate(day) + " " + day.slice(0, 4) + ".";
  }

  function exportedText(filename) {
    return "Backup file created: " + filename + ". Check your Downloads folder and keep a copy somewhere safe, like a cloud folder. No file? Try Export again.";
  }

  // ---------- Old data (Phase 9c) ----------
  // A saved planner that could not be read, or needed a repair, is kept as a copy (createStore.keepRecovered).
  // These are the words and the file name for getting it back. copy is a listRecovered row; the copy held only
  // in memory (no room to keep it) has slot 0 and no keptAt.

  // eliteplanner-recovered-2026-10-24.txt, the local day it was kept (unknown: the download day). Slot 2 and
  // up add -2, -3 so two copies kept on one day get two names.
  function recoveredFileName(copy, now) {
    var day = copy && isValidStamp(copy.keptAt) ? dateOfStamp(copy.keptAt) : todayISO(now);
    var slot = copy && copy.slot > 1 ? "-" + copy.slot : "";
    return "eliteplanner-recovered-" + day + slot + ".txt";
  }

  // A rough size from the number of characters: "under 1 KB", "about 40 KB", "about 3.2 MB".
  function dataSizeText(chars) {
    var n = isFiniteNum(chars) && chars > 0 ? chars : 0;
    if (n < 1024) return "under 1 KB";
    if (n < 1024 * 1024) return "about " + Math.round(n / 1024) + " KB";
    return "about " + String(Math.round(n / (1024 * 1024) * 10) / 10) + " MB";
  }

  // The banner before a download. o: { kind (what happened on this open, else null), chars, count }.
  function recoveredBannerText(o) {
    var first = o.kind === "unreadable" ? MSG.unreadableStored
      : o.kind === "repaired" ? MSG.repairedStored
        : "Old data from your planner is kept in this browser.";
    var text = first + " Download it to keep a copy (" + dataSizeText(o.chars) + ").";
    if (o.count > 1) text += " " + o.count + " copies are kept. This is the oldest one.";
    return text;
  }

  function recoveredDoneText(filename) {
    return "Downloaded as " + filename + ". Check your Downloads folder. Your old data also stays in this browser until you remove it.";
  }

  // The remove question. A copy not downloaded yet gets the plainer warning.
  function recoveredRemoveText(downloaded) {
    return downloaded
      ? "Remove the old data from this browser? The file in your Downloads folder is not touched. This cannot be undone."
      : "You have not downloaded this one. Remove it anyway? It cannot come back.";
  }

  // One Settings row: "Kept 24 Oct 2026, about 3.2 MB, downloaded".
  function recoveredLineText(copy) {
    var when = isValidStamp(copy.keptAt)
      ? "Kept " + formatShortDate(dateOfStamp(copy.keptAt)) + " " + dateOfStamp(copy.keptAt).slice(0, 4)
      : "Kept on an earlier day";
    return when + ", " + dataSizeText(copy.chars) + ", " + (copy.downloadedAt ? "downloaded" : "not downloaded yet");
  }

  // The reminder bar text, or null when it should not show. An empty planner needs no backup, and neither
  // does one that holds only the sample cards.
  function backupReminder(state, today) {
    if (!state.tasks.length || onlySample(state) || !isBackupDue(state, today)) return null;
    var since = daysSinceBackup(state, today);
    if (since === null) return "Your plans live only in this browser. A backup file keeps them safe.";
    return "Your last backup was " + countText(since, "day", "days") + " ago. A fresh copy keeps your plans safe.";
  }

  // How many cards of a file Merge would add as copies (same id, different content). Same rule as Merge
  // itself, so the number in the warning always matches what Merge then does. Nothing is changed.
  function mergeCopyCount(current, incoming) {
    return mergeStates(current, incoming).report.copies;
  }

  // The calm line shown before the Merge and Replace buttons. Empty when no card would become a copy.
  function mergeCopyText(n) {
    if (!(n > 0)) return "";
    var first = n === 1
      ? "1 card in this file is different from the one you have now. Merge adds it as a copy."
      : n + " cards in this file are different from the ones you have now. Merge adds them as copies.";
    return first + " Replace restores the file exactly. You can Undo right after.";
  }

  // The result line after a Merge (report from mergeStates).
  function mergeText(report) {
    if (!report.added && !report.copies && !report.labelsAdded) {
      return "Nothing new in this file." +
        (report.alreadyHere ? " " + cardsText(report.alreadyHere) + (report.alreadyHere === 1 ? " was" : " were") + " already here." : "");
    }
    var parts = [cardsText(report.added) + " added"];
    if (report.alreadyHere) parts.push(report.alreadyHere + " already here");
    if (report.copies) parts.push(report.copies + (report.copies === 1 ? " kept as a copy" : " kept as copies"));
    if (report.labelsAdded) parts.push(countText(report.labelsAdded, "new label", "new labels"));
    return "Merged. " + parts.join(", ") + ".";
  }

  function newerStamp(a, b) {
    if (!isValidStamp(a)) return isValidStamp(b) ? b : null;
    if (!isValidStamp(b)) return a;
    return Date.parse(b) > Date.parse(a) ? b : a;
  }

  // The state a Replace (or Restore) saves. lastResetDay is today, so old cards in the file never open a
  // Fresh day dialog, and the newer lastBackupAt is kept, so the reminder does not come straight back.
  function prepareReplace(incoming, current, today) {
    var settings = Object.assign({}, incoming.settings, {
      lastResetDay: isValidISODate(today) ? today : incoming.settings.lastResetDay,
      lastBackupAt: newerStamp(incoming.settings.lastBackupAt, current ? current.settings.lastBackupAt : null)
    });
    return Object.assign({}, incoming, { settings: settings });
  }

  // Settings an Export or the daily Fresh day check write. Changing only these is not an edit.
  var QUIET_SETTINGS = ["lastBackupAt", "lastResetDay"];

  // False when next differs from prev only by QUIET_SETTINGS (or nothing). Cards, labels, days and the
  // time log are compared as objects: any new array counts as an edit, which is the safe side.
  function isRealEdit(prev, next) {
    if (!prev || !next) return true;
    if (prev.tasks !== next.tasks || prev.labels !== next.labels || prev.days !== next.days ||
      prev.timeLog !== next.timeLog) return true;
    if (prev.settings === next.settings) return false;
    var keys = Object.keys(Object.assign({}, prev.settings, next.settings));
    return keys.some(function (k) {
      return QUIET_SETTINGS.indexOf(k) < 0 && !deepEqual(prev.settings[k], next.settings[k]);
    });
  }

  // Merge plus an Undo entry (the whole planner from before, like Replace). Use with applyImportUndo.
  function mergeWithUndo(current, incoming, now) {
    var r = mergeStates(current, incoming);
    return {
      state: r.state,
      report: r.report,
      undo: undoEntry("replace", "Merged a backup", now, { previous: current })
    };
  }

  // Undo of a Merge, Replace or Restore: the planner from before, but it keeps the newer lastBackupAt and
  // today's lastResetDay, so an Export made since still counts and no Fresh day dialog comes back.
  function applyImportUndo(current, entry) {
    var back = applyUndo(current, entry);
    if (back === current) return current;
    return Object.assign({}, back, {
      settings: Object.assign({}, back.settings, {
        lastResetDay: current.settings.lastResetDay,
        lastBackupAt: newerStamp(back.settings.lastBackupAt, current.settings.lastBackupAt)
      })
    });
  }

  // ---------- First run and sample data (Phase 8c) ----------
  // Sample cards are found by their id (SAMPLE_PREFIX), so the data contract does not change. The sample is
  // built from today's date, so it always looks like the current week. Done cards stay in the past; To Do and
  // Doing cards never get a block or a due date before today.

  var SAMPLE_PREFIX = "demo-";
  var SAMPLE_DAY_END = 22 * 60;

  // The welcome screen words, in one place so a test can check them.
  var WELCOME = {
    line: "Plan one calm day at a time.",
    startHint: "A clean planner. Home, Work, Study and Me labels are ready.",
    sampleHint: "A calm example week to try everything. Clear it any time in Settings.",
    backupLink: "I already have a backup file",
    footer: "Your plans stay in this browser on this device. Nothing is sent anywhere."
  };

  // loadInfo is what store.load returns. Only a planner that was never saved counts. A recovered, newer or
  // locked planner is somebody's data, never a first run.
  function isFirstRun(info) {
    return isObj(info) && info.status === "new" && isObj(info.state) &&
      Array.isArray(info.state.tasks) && info.state.tasks.length === 0;
  }

  function isSampleTask(t) {
    return !!(t && typeof t.id === "string" && t.id.indexOf(SAMPLE_PREFIX) === 0);
  }

  // Sample cards in the planner, archived ones included.
  function sampleCount(state) {
    return state.tasks.filter(isSampleTask).length;
  }

  // True when every card is a sample card (and there is at least one).
  function onlySample(state) {
    return state.tasks.length > 0 && state.tasks.every(isSampleTask);
  }

  // [key, title, label, effort, guess, real minutes, days ago, hour, minute, has a due date]
  var SAMPLE_DONE = [
    ["bed", "Make the bed and open the window", "Me", 1, null, null, 0, 8, 10, false],
    ["bedding", "Wash the bedding", "Home", 1, 20, 25, 1, 11, 30, false],
    ["invoice", "Send the invoice for the flyer job", "Work", 1, 15, 20, 1, 17, 15, true],
    ["lab", "Finish the lab report introduction", "Study", 3, 60, 95, 2, 15, 0, false],

  function stampOn(today, daysAgo, h, m) {
    var d = parseISODate(addDays(today, -daysAgo));
    d.setHours(h, m, 0, 0);
    return nowStamp(d);
  }

  // Where blocks and due dates go. A wished weekday that is already past moves to today or a later day of the
  // current week, taking the days that are left in turn (all on today when it is the last day). A block that
  // would overlap another on its day moves later in 15 minute steps.
  function samplePlacer(today, startDay) {
    var week = weekDays(today, startDay);
    var left = week.filter(function (d) { return d >= today; });
    var turn = { block: 0, due: 0 };
    var busy = {};

    function dayFor(wd, kind) {
      for (var i = 0; i < week.length; i++) {
        if (parseISODate(week[i]).getDay() === wd && week[i] >= today) return week[i];
      }
      return left[turn[kind]++ % left.length];
    }

    function place(date, at, mins) {
      var list = busy[date] || (busy[date] = []);
      function clash(s) {
        return list.some(function (b) { return s < b.to && s + mins > b.from; });
      }
      var s = at;
      while (s + mins <= SAMPLE_DAY_END && clash(s)) s += 15;
      if (s + mins > SAMPLE_DAY_END) {
        s = 6 * 60;
        while (s + mins <= SAMPLE_DAY_END && clash(s)) s += 15;
      }
      list.push({ from: s, to: s + mins });
      return { date: date, start: minsToTime(s), mins: mins };
    }

    return {
      week: week,
      block: function (b) { return place(dayFor(b.wd, "block"), timeToMins(b.at), b.mins); },
      past: function (date, at, mins) { return week.indexOf(date) >= 0 ? place(date, at, mins) : null; },
      due: function (d) {
        // Every due date stays in this month, so the sample matches what the month view shows.
        var last = today.slice(0, 8) + pad(daysInMonth(+today.slice(0, 4), +today.slice(5, 7)));
        var want = d.within === undefined ? dayFor(d.wd, "due") : addDays(today, d.within);
        return want > last ? last : want;
      }
    };
  }

  // A planner with the example week in it. Only an empty planner gets it (nothing is ever overwritten); any
  // other planner is returned as it is. now is a Date (default: now). The check-in day is today, so no
  // Fresh day question is asked about sample cards.
  function sampleState(state, now) {
    if (state.tasks.length) return state;
    var when = now || new Date();
    var today = todayISO(when);
    var startDay = state.settings.weekStart;
    var placer = samplePlacer(today, startDay);

    var labels = state.labels.slice();
    function labelId(name) {
      for (var i = 0; i < labels.length; i++) if (labels[i].name.toLowerCase() === name.toLowerCase()) return labels[i].id;
      var color = DEFAULT_LABEL_COLOR;
      STARTER_LABELS.forEach(function (l) { if (l.name === name) color = l.color; });
      var made = cleanLabel({ name: name, color: color }, newId("l"));
      labels.push(made);
      return made.id;
    }

    var tasks = [];
    var log = [];
    var order = { todo: 0, doing: 0, done: 0, later: 0 };
    function add(fields) {
      fields.order = order[fields.status]++;
      tasks.push(createTask(fields, when));
    }
    function stepList(list) {
      return (list || []).map(function (s, i) { return { id: "x", text: s[0], done: s[1] }; });
    }

    SAMPLE_DONE.forEach(function (d) {
      var doneAt;
      if (d[6] === 0) {
        var t = new Date(when.getTime() - 20 * 60000);
        doneAt = nowStamp(toISODate(t) === today ? t : when);
      } else {
        doneAt = stampOn(today, d[6], d[7], d[8]);
      }
      var day = addDays(today, -d[6]);
      var scheduled = null;
      if (d[4] && d[5]) {
        var from = Math.max(6 * 60, Math.floor((d[7] * 60 + d[8] - d[5]) / 15) * 15);
        scheduled = placer.past(day, from, Math.max(15, d[5]));
      }
      add({
        id: SAMPLE_PREFIX + d[0], title: d[1], status: "done", labelId: labelId(d[2]), cost: d[3],
        estimateMins: d[4], actualMins: d[5], due: d[9] ? day : null, scheduled: scheduled,
        createdAt: stampOn(today, d[6] + 3, 9, 0), doneAt: doneAt
      });
      if (d[4] && d[5]) log.push({ taskId: SAMPLE_PREFIX + d[0], estimate: d[4], actual: d[5], at: doneAt });
    });

    SAMPLE_OPEN.forEach(function (o) {
      add({
        id: SAMPLE_PREFIX + o.k, title: o.t, notes: o.note || "", status: o.st, labelId: labelId(o.l), cost: o.c,
        estimateMins: o.est, steps: stepList(o.steps), due: o.due ? placer.due(o.due) : null,
        scheduled: o.block ? placer.block(o.block) : null, createdAt: stampOn(today, 7, 9, 0)
      });
    });

    SAMPLE_LATER.forEach(function (l) {
      add({
        id: SAMPLE_PREFIX + l[0], title: l[1], status: "later", labelId: labelId(l[2]), cost: l[3],
        createdAt: stampOn(today, l[4] + 10, 9, 0), laterAt: stampOn(today, l[4], 10, 0),
        archivedAt: l[5] === null ? null : stampOn(today, l[5], 10, 0)
      });
    });

    // Step ids are made once the task exists, so each is unique inside its card.
    tasks = tasks.map(function (t) {
      return Object.assign({}, t, {
        steps: t.steps.map(function (s, i) { return Object.assign({}, s, { id: t.id + "-s" + (i + 1) }); })
      });
    });

    var days = {};
    function dayOf(ago, ids, picked) {
      var day = { battery: DEFAULT_BATTERY, focusIds: ids.map(function (k) { return SAMPLE_PREFIX + k; }) };
      if (picked) day.batterySet = true;
      days[addDays(today, -ago)] = day;
    }
    dayOf(0, ["bio", "reply", "bed"], true);
    dayOf(1, ["bedding", "invoice"]);
    dayOf(2, ["lab", "update"]);
    dayOf(3, ["tutor"]);

    log.sort(byAt);
    return Object.assign({}, state, {
      settings: Object.assign({}, state.settings, { lastResetDay: today }),
      labels: labels,
      tasks: tasks,
      days: days,
      timeLog: log
    });
  }

  // Removes the sample cards and what hangs on them: their place in a day's list (a day that held one and is
  // empty afterwards goes too) and their time records. Cards, labels, settings and days of the person's own
  // stay. Returns { state, undo, removed }; undo is null when there was nothing to clear.
  function clearSample(state) {
    var gone = Object.create(null);
    var removedTasks = [];
    var tasks = [];
    state.tasks.forEach(function (t, i) {
      if (isSampleTask(t)) {
        gone[t.id] = true;
        removedTasks.push({ task: t, index: i });
      } else {
        tasks.push(t);
      }
    });
    if (!removedTasks.length) return { state: state, undo: null, removed: 0 };

    var days = {};
    var touched = {};
    Object.keys(state.days).forEach(function (date) {
      var day = state.days[date];
      var rest = day.focusIds.filter(function (id) { return !gone[id]; });
      if (rest.length === day.focusIds.length) {
        days[date] = day;
        return;
      }
      touched[date] = day;
      if (rest.length) days[date] = Object.assign({}, day, { focusIds: rest });
    });

    var removedLog = state.timeLog.filter(function (e) { return gone[e.taskId]; });
    return {
      state: Object.assign({}, state, {
        tasks: tasks,
        days: days,
        timeLog: state.timeLog.filter(function (e) { return !gone[e.taskId]; })
      }),
      undo: { tasks: removedTasks, days: touched, log: removedLog },
      removed: removedTasks.length
    };
  }

  // Puts the sample back: cards where they were (none that are already here), their places in the day lists
  // and their time records. Anything the person did since stays.
  function applySampleUndo(state, undo) {
    if (!isObj(undo) || !Array.isArray(undo.tasks)) return state;
    var tasks = state.tasks.slice();
    var back = Object.create(null);
    undo.tasks.forEach(function (r) {
      if (findIndexById(tasks, r.task.id) >= 0) return;
      tasks.splice(Math.min(r.index, tasks.length), 0, r.task);
      back[r.task.id] = true;
    });
    var days = Object.assign({}, state.days);
    Object.keys(undo.days || {}).forEach(function (date) {
      var before = undo.days[date];
      var ids = before.focusIds.filter(function (id) { return back[id]; });
      var now = days[date];
      if (!now) {
        days[date] = Object.assign({}, before, { focusIds: ids });
      } else {
        var list = ids.concat(now.focusIds.filter(function (id) { return ids.indexOf(id) < 0; }));
        days[date] = Object.assign({}, now, { focusIds: list.slice(0, LIMITS.focusHistory) });
      }
    });
    var next = Object.assign({}, state, { tasks: tasks, days: days });
    return applyTimeLogUndo(next, { log: (undo.log || []).filter(function (e) { return back[e.taskId]; }) });
  }

  // ---------- Debounced save ----------

  // saveFn takes no arguments and saves the latest state when it runs.
  function createDebouncedSaver(saveFn, waitMs, timers) {
    var t = timers || {
      setTimeout: function (f, ms) { return setTimeout(f, ms); },
      clearTimeout: function (h) { clearTimeout(h); }
    };
    var handle = null;
    var pending = false;

    function run() {
      handle = null;
      if (!pending) return;
      pending = false;
      saveFn();
    }

    return {
      schedule: function () {
        pending = true;
        if (handle !== null) t.clearTimeout(handle);
        handle = t.setTimeout(run, waitMs);
      },
      flush: function () {
        if (handle !== null) t.clearTimeout(handle);
        run();
      },
      cancel: function () {
        if (handle !== null) t.clearTimeout(handle);
        handle = null;
        pending = false;
      },
      isPending: function () { return pending; }
    };
  }

      var row = el("div", {
        role: "option",
        className: "select-row" + (item.action ? " is-action" : ""),
        tabindex: "-1",
        "aria-selected": on ? "true" : "false",
        onclick: function () { choose(item); }
      }, [
        item.color !== undefined ? colorDot(item.color) : null,
        el("span", { className: "select-name", dir: "auto" }, item.label),
        el("span", { className: "select-tick", "aria-hidden": "true" }, on ? "✓" : "")
      ]);
      list.appendChild(el("div", { className: "select-item" + (item.divider ? " has-divider" : "") },
        [row, item.remove ? removeButton(list, item) : null]));
    });
  }

  function open() {
    typed = "";
    var list = el("div", { className: "menu select-list", role: "listbox", "aria-label": opts.ariaLabel });
    fillRows(list);
    list.addEventListener("keydown", function (e) {
      var rows = rowsOf(list);
      var active = document.activeElement;
      var i = rows.indexOf(active);
      // On an x, the row it belongs to is where the arrows continue from.
      var holder = active && active.closest ? active.closest(".select-item") : null;
      var at = i >= 0 ? i : holder ? rows.indexOf(holder.querySelector("[role=option]")) : -1;
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key === "ArrowDown") { e.preventDefault(); focusRow(list, at + 1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); focusRow(list, at - 1); }
      else if (e.key === "Home") { e.preventDefault(); focusRow(list, 0); }
      else if (e.key === "End") { e.preventDefault(); focusRow(list, rows.length - 1); }
      else if (e.key === "ArrowRight" && i >= 0 && items[i].remove) {
        e.preventDefault();
        rows[i].parentNode.querySelector(".select-x").focus();
      }
      else if (e.key === "ArrowLeft" && i < 0 && at >= 0) { e.preventDefault(); rows[at].focus(); }
      else if ((e.key === "Delete" || e.key === "Backspace") && at >= 0 && items[at].remove) {
        e.preventDefault();
        removeItem(list, items[at]);
      }
      else if (i >= 0 && (e.key === "Enter" || (e.key === " " && !typed))) { e.preventDefault(); choose(items[i]); }
      else if (e.key === "Tab") { trigger.focus(); popup.close(false); }
      else if (e.key.length === 1 && i >= 0) { e.preventDefault(); typeAhead(list, e.key); }
    });
    popup = Popup.show({ wrap: wrap, panel: list, trigger: trigger });
    var start = -1;
    items.forEach(function (item, k) { if (!item.action && item.value === current) start = k; });
    focusRow(list, start < 0 ? 0 : start);
  }

  function isOpen() { return !!(popup && popup.panel.isConnected); }

  trigger.onclick = function () { if (isOpen()) popup.close(true); else open(); };
  trigger.onkeydown = function (e) {
    if ((e.key === "ArrowDown" || e.key === "ArrowUp") && !isOpen()) { e.preventDefault(); open(); }
  };

  drawTrigger();
  wrap.appendChild(trigger);
  Object.defineProperty(wrap, "value", {
    get: function () { return current; },
    set: function (v) { current = v; drawTrigger(); }
  });
  // Lets a caller change the rows (the color list shows the current custom color).
  // An open list is redrawn in place.
  wrap.setItems = function (next) {
    items = next;
    drawTrigger();
    if (isOpen()) fillRows(popup.panel);
  };
  wrap.trigger = trigger;
  return wrap;
};

// ---------- EmptyState ----------
function EmptyState(title, text, action) {
  return el("section", { className: "empty" }, [
    el("h2", null, title),
    el("p", null, text),
    action ? el("button", { type: "button", className: "primary", onclick: action.onclick }, action.label) : null
  ]);
}

// The Status field (To Do, Doing, Done, Later) used by the card dialog and the Week Edit time block dialog.
// StatusField.create(value) returns { node, select }. Saving goes through Core.updateTask, never a direct write.
var StatusField = {
  create: function (value) {
    var select = el("select", null, Core.STATUSES.map(function (s) {
      return el("option", { value: s }, Core.COLUMN_NAMES[s]);
    }));
    select.value = value;
    return { node: el("label", { className: "field" }, [el("span", null, "Status"), select]), select: select };

// Backup (Phase 8a): the Settings block (Export, Import with Merge or Replace, Restore safety copy, the
// reminder choice) and the gentle reminder bar under the banners. Settings is a drawer Dialog, so every
// question here is asked inline: a second dialog would close the drawer.

var BACKUP_REMIND_OPTIONS = [
  { label: "7 days", value: 7 },
  { label: "14 days", value: 14 },
  { label: "30 days", value: 30 },
  { label: "Off", value: 0 }
];

// Saves text as a file in Downloads. The one download path (backups and old data). A big file keeps its
// link longer, so a slow browser can still read it.
function downloadText(text, filename, type) {
  var url = URL.createObjectURL(new Blob([text], { type: type }));
  var a = el("a", { href: url, download: filename, hidden: true });
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, text.length > 1000000 ? 60000 : 1000);
}

// The one export path (Settings block, reminder bar, Replace question). The planner is marked first, so the file
// records its own backup time. Returns the file name.
function exportBackup() {
  var marked = Core.markBackedUp(App.state);
  var out = Core.exportJSON(marked);
  downloadText(out.text, out.filename, "application/json");
  commit(marked);
  return out.filename;
}

// The reminder bar. Drawn again only when its text changes, so a redraw never takes a button away.
// It waits while the first-run screen is open (App.firstRun) and after "Not now" until the next open.
function updateReminder() {
  var node = Shell.reminder;
  if (!node) return;
  var text = App.firstRun || App.backupSnoozed ? null : Core.backupReminder(App.state, Core.todayISO());
  var key = text || "";
  if (key === Shell.reminderKey) return;
  Shell.reminderKey = key;
  var hadFocus = node.contains(document.activeElement);
  node.textContent = "";
  if (hadFocus) Shell.main.focus({ preventScroll: true });
  if (!text) return;
  node.appendChild(el("div", { className: "banner reminder-bar" }, [
    el("p", null, text),
    el("button", {
      type: "button",
      className: "primary",
      onclick: function () { Toast.show(Core.exportedText(exportBackup())); }
    }, "Back up now"),
    el("button", {
      type: "button",
      onclick: function () {
        App.backupSnoozed = true;
        updateReminder();
      }
    }, "Not now")
  ]));
}

function backupBlock() {
  var box = el("fieldset", { className: "settings-block backup-block" });
  var live = el("p", { className: "hint gentle", role: "status", "aria-live": "polite" });
  // .txt too: a downloaded copy of old data that only needed a repair is planner text and imports like a backup.
  var fileInput = el("input", { type: "file", accept: ".json,.txt,application/json,text/plain", hidden: true, onchange: pickFile });
  var pending = null; // a checked file waiting for Merge or Replace
  // null, "file", "replace" (the Replace question), "restore" (the Restore question) or "rec-N" (remove old data copy N)
  var mode = null;
  var undo = null; // { entry, changes } for the last Merge, Replace or Restore

  function say(text, focusKey) {
    live.textContent = text || "";
    // From the toast, after the drawer closed, the line would not be seen.
    if (text && !box.isConnected) Toast.show(text);
    draw(focusKey);
  }

  function pickFile(e) {
    if (Demo.importOff()) { e.target.value = ""; return; }
    var file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    pending = null;
    mode = null;
    if (file.size > Core.LIMITS.importChars) return say(Core.MSG.tooBig, "import");
    var reader = new FileReader();
    reader.onload = function () {
      var r = Core.validateImport(String(reader.result));
      if (!r.ok) return say(r.reason, "import");
      pending = r;
      mode = "file";
      say("", "merge");
    };
    reader.onerror = function () { say(Core.MSG.unreadable, "import"); };
    reader.readAsText(file);
  }

  // Undo for Merge, Replace and Restore puts back the whole planner from before, so it only runs while
  // nothing real was changed since (App.changes). Export and the Fresh day marker do not count.
  function offerUndo(entry, text) {
    undo = { entry: entry, changes: App.changes };
    Toast.show(text, { undo: runUndo });
    say(text, "undo");
  }

  function runUndo() {
    if (!undo) return;
    var u = undo;
    undo = null;
    Toast.hide();
    if (App.changes !== u.changes) return say("Things changed since, so Undo is off. The safety copy is still here.", "export");
    endFocusQuietly();
    commit(Core.applyImportUndo(App.state, u.entry));
    App.boardFilter = Core.validFilter(App.state, App.boardFilter);
    say("Undone. Your planner is back as it was.", "export");
  }

  // Replace and Restore swap the whole planner: saved already, so it goes in without commit's save.
  function swapIn(r, text) {
    var stopped = endFocusQuietly();
    App.changes++;
    App.state = r.state;
    App.saveStatus = "Saved";
    App.boardFilter = Core.validFilter(App.state, App.boardFilter);
    render();
    offerUndo(r.undo, text + (stopped ? " Your focus timer was stopped." : ""));
  }

  function merge() {
    if (Demo.importOff()) return;
    var m = Core.mergeWithUndo(App.state, pending.state);
    pending = null;
    mode = null;
    commit(m.state);
    offerUndo(m.undo, Core.mergeText(m.report));
  }

  function replace() {
    if (Demo.importOff()) return;
    var incoming = Core.prepareReplace(pending.state, App.state, Core.todayISO());
    var r = Core.replaceState(App.store, App.state, incoming);
    if (!r.ok) {
      mode = "file";
      return say(r.reason, "merge");
    }
    pending = null;
    mode = null;
    swapIn(r, "Your planner was replaced. A safety copy of the old one was saved.");
  }

  function restore() {
    if (Demo.importOff()) return;
    var r = Core.restoreSafetyCopy(App.store, App.state);
    mode = null;
    if (!r.ok) return say(r.reason, "restore");
    swapIn(r, "The safety copy is back. Your planner from before is now the safety copy.");
  }

  function button(text, key, onclick, opts) {
    opts = opts || {};
    return el("button", {
      type: "button",
      className: opts.primary ? "primary" : "",
      "data-bk": key,
      disabled: !!opts.disabled,
      onclick: onclick
    }, text);
  }

  function filePanel() {
    var r = pending;
    var kids = [el("p", null, ["This file has " + Core.countsText(Core.plannerCounts(r.state)) + ".", Core.fileDateText(r.state)]
      .filter(Boolean).join(" "))];
    if (r.warnings.length) {
      kids.push(el("p", null, "A few things in the file were fixed:"));
      kids.push(el("ul", { className: "backup-warnings" }, r.warnings.map(function (w) { return el("li", { dir: "auto" }, w); })));
    }
    if (mode === "replace") {
      kids.push(el("p", { className: "gentle-q" }, "Replace everything in this planner with this file? A safety copy of your planner is saved first."));
      kids.push(el("div", { className: "backup-actions" }, [
        button("Export my current planner first", "export-first", function () {
          say(Core.exportedText(exportBackup()), "yes-replace");
        }),
        button("Yes, replace", "yes-replace", replace, { primary: true }),
        button("Keep my planner", "keep", function () { mode = "file"; say("", "merge"); })
      ]));
    } else {
      var copies = Core.mergeCopyText(Core.mergeCopyCount(App.state, r.state));
      if (copies) kids.push(el("p", { className: "hint gentle", "data-bk": "copies" }, copies));
      kids.push(el("div", { className: "backup-actions" }, [
        button("Merge into my planner", "merge", merge, { primary: true }),
        button("Replace my planner", "replace", function () { mode = "replace"; say("", "keep"); }),
        button("Cancel", "cancel", function () { pending = null; mode = null; say("Import canceled. Nothing changed.", "import"); })
      ]));
    }
    return el("div", { className: "backup-panel", role: "group", "aria-label": "Import a backup" }, kids);
  }

  function restorePart(blocked) {
    var copy = App.store.readSafetyCopy();
    if (!copy) return null;
    var when = Core.stampText(copy.savedAt) || "an unknown date";
    if (mode === "restore") {
      return el("div", { className: "backup-panel", role: "group", "aria-label": "Restore safety copy" }, [
        el("p", null, "Put back the safety copy from " + when + "? Your planner now becomes the new safety copy."),
        el("div", { className: "backup-actions" }, [
          button("Yes, restore", "yes-restore", restore, { primary: true }),
          button("Keep my planner", "keep-restore", function () { mode = null; say("", "restore"); })
        ])
      ]);
    }
    return el("div", null, [
      button("Restore safety copy (" + when + ")", "restore", function () { mode = "restore"; say("", "keep-restore"); }, { disabled: blocked }),
      el("p", { className: "hint" }, "Only your latest safety copy is kept.")
    ]);
  }

  // Old data (Phase 9c): every kept copy of a saved planner that could not be read or needed a repair.
  // Remove always asks first, more plainly for a copy not downloaded yet. The banner uses the same helpers.
  function downloadCopy(c, focusKey) {
    var name = recoveryDownload(c);
    updateRecovery();
    say(name ? "Downloaded as " + name + ". Check your Downloads folder." : Core.MSG.recoveredGone, focusKey);
  }

  function removeCopy(c) {
    mode = null;
    var ok = recoveryRemove(c.slot);
    updateRecovery();
    say(ok ? Core.MSG.recoveredRemoved : "Nothing was removed. Please try again.", "export");
  }

  function recoveredPart(blocked) {
    if (!Recovery.list.length) return null;
    var rows = Recovery.list.map(function (c) {
      var line = Core.recoveredLineText(c);
      var kids = [el("p", null, line)];
      if (mode === "rec-" + c.slot) {
        kids.push(el("p", { className: "gentle-q" }, Core.recoveredRemoveText(!!c.downloadedAt)));
        var acts = [];
        if (!c.downloadedAt) {
          acts.push(button("Download first", "rec-first-" + c.slot, function () { downloadCopy(c, "rec-yes-" + c.slot); }, { primary: true }));
        }
        acts.push(button("Yes, remove it", "rec-yes-" + c.slot, function () { removeCopy(c); }, { disabled: blocked }));
        acts.push(button("Keep it", "rec-keep-" + c.slot, function () { mode = null; say("", "rec-rm-" + c.slot); }));
        kids.push(el("div", { className: "backup-actions" }, acts));
      } else {
        kids.push(el("div", { className: "backup-actions" }, [
          button("Download", "rec-dl-" + c.slot, function () { downloadCopy(c, "rec-dl-" + c.slot); }),
          button("Remove", "rec-rm-" + c.slot, function () { mode = "rec-" + c.slot; say("", "rec-keep-" + c.slot); }, { disabled: blocked })
        ]));
      }
      return el("div", { className: "backup-panel", role: "group", "aria-label": line, "data-bk": "rec-row-" + c.slot }, kids);
    });
    return el("div", { className: "recovered-part" }, [
      el("p", { className: "recovered-head" }, "Old data kept in this browser"),
      el("p", { className: "hint" }, "A copy of a saved planner that could not be opened, or needed a repair.")
    ].concat(rows));
  }

  function draw(focusKey) {
    var blocked = !!App.otherTab;
    var today = Core.todayISO();
    box.textContent = "";
    box.appendChild(el("legend", null, "Backup"));
    box.appendChild(el("p", { className: "hint" }, Core.backupStatusText(App.state, today)));
    box.appendChild(el("p", { className: "hint" }, "This planner: " + Core.countsText(Core.plannerCounts(App.state)) + "."));
    if (blocked) {
      box.appendChild(el("p", { className: "hint gentle" }, "This planner was changed in another tab. Reload first, then import, restore or remove."));
    }
    box.appendChild(el("div", { className: "backup-actions" }, [
      button("Export a backup", "export", function () { say(Core.exportedText(exportBackup()), "export"); }),
      Demo.offButton(button("Import a backup", "import", function () { fileInput.click(); }, { disabled: blocked })),
      fileInput
    ]));
    box.appendChild(Demo.importHint());
    box.appendChild(live);
    if (pending && mode && !blocked) box.appendChild(filePanel());
    if (undo) {
      box.appendChild(el("div", { className: "undo-bar" }, [
        el("span", null, "Changed your mind?"),
        button("Undo", "undo", runUndo)
      ]));
    }
    var rest = restorePart(blocked);
    if (rest) box.appendChild(rest);
    var old = recoveredPart(blocked);
    if (old) box.appendChild(old);
    box.appendChild(segmentedGroup("backupReminderDays", "Remind me to back up", BACKUP_REMIND_OPTIONS,
      App.state.settings.backupReminderDays, "backupReminderDays", true));
    if (focusKey) {
      var target = box.querySelector('[data-bk="' + focusKey + '"]');
      if (target && !target.disabled) target.focus();
    }
  }

  draw();
  return box;
}

// Board view: To Do, Doing, Done and a collapsible Later shelf.

// Text typed in an "add a card" box, kept per column so a redraw never loses it.
var boardDrafts = {};

var EMPTY_COLUMN = {
  todo: "Nothing waiting. Add one below.",
  doing: "Nothing in progress. Pick one when you are ready.",
  done: "Finished cards land here.",
  later: "Nothing parked. Anything you set aside rests here."
};

function findLabel(id) {
  for (var i = 0; i < App.state.labels.length; i++) {
    if (App.state.labels[i].id === id) return App.state.labels[i];
  }
  return null;
}

// Only the circle and the border carry the label color. The text stays the theme color.
function labelChip(label) {
  return el("span", { className: "chip", style: "border-color:" + Core.labelHex(label.color) }, [
    colorDot(label.color),
    el("span", { dir: "auto" }, label.name)
  ]);
}

// Items for a label list: an optional first row (All areas, No label) then every label.
function labelItems(firstLabel) {
  return [{ value: "", label: firstLabel, color: null }].concat(App.state.labels.map(function (l) {
    return { value: l.id, label: l.name, color: l.color };
  }));
}

function boardCard(t, ctx) {
  var label = t.labelId ? findLabel(t.labelId) : null;
  var prog = Core.stepProgress(t);
  var meta = [];
  if (label) meta.push(labelChip(label));
  if (t.due) {
    // Neutral color even when the date has passed. No "overdue" anywhere.
    meta.push(el("time", { className: "due", datetime: t.due }, "Due " + Core.formatShortDate(t.due)));
  }
  if (prog.total) {
    meta.push(el("span", {
      className: "steps",
      title: prog.done + " of " + prog.total + " steps done",
      "aria-label": prog.done + " of " + prog.total + " steps done"
    }, prog.done + "/" + prog.total));
  }
  var open = el("button", {
    type: "button",
    className: "card-open",
    "data-key": "card-" + t.id,
    "aria-haspopup": "dialog",
    onclick: function () { openCardEdit(t.id); }
  }, el("span", { className: "card-title", dir: "auto" }, t.title));
  // The note icon (only for a card with a note) is the touch way to read the note preview. It sits at the
  // top right, left of the Move button, so a card with a note is no taller.
  var note = NotePreview.button(t, ".card");
  var card = el("li", { className: "card" + (t.status === "done" ? " is-done" : "") + (note ? " has-note" : ""), "data-id": t.id }, [
    open,
    moveMenu(t, ctx),
    note,
    meta.length ? el("div", { className: "card-meta" }, meta) : null
  ]);
  NotePreview.attach(card, open, t);
  return card;
}

function addBox(status) {
  var name = Core.COLUMN_NAMES[status];
  var input = el("input", {
    type: "text",
    maxLength: Core.LIMITS.title,
    autocomplete: "off",
    dir: "auto",
    placeholder: "Add a card",
    "aria-label": "Add a card to " + name,
    "data-key": "add-" + status
  });
  input.value = boardDrafts[status] || "";
  var hint = el("p", { className: "hint", role: "status" });
  input.addEventListener("input", function () {
    boardDrafts[status] = input.value;
    if (hint.textContent) { hint.textContent = ""; hint.className = "hint"; }
  });
  return el("form", {
    className: "add-box",
    onsubmit: function (e) {
      e.preventDefault();
